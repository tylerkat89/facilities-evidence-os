<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFBF5" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>FEOS — Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{ --cream:#FFFBF5; --ink:#2D3748; --mute:#66718A; --clay:#C87A48; --hair:rgba(45,55,72,.12); }
*{box-sizing:border-box}
html,body{margin:0; background:var(--cream); color:var(--ink);
  font-family:'Outfit',system-ui,sans-serif; min-height:100dvh}
.wrap{max-width:440px; margin:0 auto; padding:48px 20px}
.kicker{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--clay)}
h1{font-family:'Sora',system-ui,sans-serif; font-size:26px; letter-spacing:-.03em; line-height:1.2; margin:14px 0 10px}
p{color:var(--mute); margin:0 0 18px}
a{display:flex; align-items:center; justify-content:center; min-height:48px; padding:12px 18px;
  border-radius:14px; background:var(--clay); color:#FFF7EC; font-weight:600; text-decoration:none}
</style>
</head>
<body>
  <main class="wrap">
    <div class="kicker">Facilities Evidence OS</div>
    <h1>This walkthrough isn’t a public file.</h1>
    <p>The live demo opens from the card after someone shows it to you. A copied link to the floor will not load the app.</p>
    <a href="/pilot">Open the card</a>
  </main>
</body>
</html>
