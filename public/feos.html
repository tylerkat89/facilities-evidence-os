 {id:'verify', ic:'🔬', label:'Run the acceptance test', desc:'This is the review step — confirm or reject what the Tech submitted. A fail sends it back open, it does not vanish.',
  when:i=>i.cond==='RESOLVED-VERIFY',
  fields:[{k:'res',t:'chips',label:'Result',
            opts:(iss,role)=> role==='tech' ? ['It passed — watch it a while','It failed'] : ['It passed — close it','It passed — watch it a while','It failed'],
            req:true,
            default:(iss,role)=> role==='tech' ? 'It passed — watch it a while'
              : (iss.linked||iss.vendor||WATCH_CATS.includes(iss.cat))?'It passed — watch it a while':'It passed — close it'},
          {k:'who',t:'chips',label:'Who watched it',opts:PEOPLE,req:true},
          {k:'note',t:'textarea',label:'What you observed during the test',req:true}],
  apply:(i,v)=>{
    if(v.res==='It failed') return {patch:{cond:'OPEN',work:'ACTION PENDING',escalated:false,needsReview:false,
      verify:{state:'failed',text:'FAILED — '+v.note+' Re-opened for another attempt.'}},
      ev:{ic:'❌',h:'Verification FAILED',d:v.note,m:v.who+' · just now',fail:true}};
    if(v.res==='It passed — watch it a while'){
      const days=(i.linked||i.vendor||WATCH_CATS.includes(i.cat))?30:7;
      return {patch:{cond:'MONITORING',watchUntil:plusDays(days),escalated:false,needsReview:false,
        verify:{state:'passed',text:'Passed — '+v.note+' Watched by '+v.who+'. '+days+'-day watch window.'}},
        ev:{ic:'✅',h:'Verification passed — watching',d:v.note+' — '+days+'-day watch starts now',m:v.who+' · just now'}};
    }
    return {patch:{cond:'CLOSED',escalated:false,needsReview:false,
      verify:{state:'passed',text:'Passed — '+v.note+' Closed on the spot, watched by '+v.who+'.'}},
      ev:{ic:'🔒',h:'Verification passed — closed',d:v.note,m:v.who+' · just now'}};
  }},

 {id:'close', ic:'🔒', label:'Confirm & close', desc:'Only available after a passed test and a watch window that has actually elapsed.',
  roles:['supervisor','manager'],
  when:i=>i.cond==='MONITORING' && !!i.watchUntil && i.watchUntil<=new Date().toISOString().slice(0,10),
  fields:[{k:'conf',t:'chips',label:'Did anything come back during the watch',opts:['Nothing came back','It came back'],req:true},
          {k:'note',t:'textarea',label:'Anything worth leaving for the next person',req:true}],
  apply:(i,v)=>{
    if(v.conf==='It came back') return {
      patch:{cond:'CLOSED'},
      ev:{ic:'🔁',h:'Recurred during the watch window',d:'This episode closes as verified. A new, linked record opens for what came back. '+v.note,m:'You · just now',fail:true},
      spawnNew:{saw:v.note}
    };
    return {patch:{cond:'CLOSED'},ev:{ic:'🔒',h:'Closed out',d:v.note,m:'You · just now'}};
  }},

 {id:'back', ic:'🔁', label:'It came back', desc:'Opens a new, linked record — this closed one stays exactly as it was verified.',
  when:i=>['MONITORING','CLOSED'].includes(i.cond),
  fields:[{k:'saw',t:'textarea',label:'What you saw this time',req:true},{k:'photos',t:'photo',label:'Photos'}],
  apply:(i,v)=>({
    patch:{cond:'CLOSED'},
    ev:{ic:'🔁',h:'Came back — opened as a new record',d:v.saw,m:'You · just now',fail:true},
    spawnNew:{saw:v.saw, photos:v.photos}
  })},

 {id:'parts', ic:'📦', label:'Log parts used', desc:'Pulls it from stock and puts the cost on this record.',
  when:i=>i.cond!=='CLOSED',
  fields:(iss,role,vendors,inventory)=>{
    const avail=(inventory||[]).filter(it=>!it.archived && it.onHand>0 && (it.unitCost||0)>0);
    const noprice=(inventory||[]).filter(it=>!it.archived && it.onHand>0 && !(it.unitCost>0));
    return [
      {k:'item',t:'chips',label:'What you took',req:true,
       opts:avail.map(it=>it.name+' — '+it.onHand+' '+it.unit+' left'),
       empty: noprice.length
         ? 'Stock is on the shelf with no unit price. Put a price on it in Inventory — enter once, then pull it here.'
         : 'Nothing is in stock to draw from. Add the item in Inventory first.'},
      {k:'qty',t:'text',label:'How many',req:true,ph:'e.g. 2'},
      {k:'note',t:'textarea',label:'What it was for'},
    ];
  },
  apply:(i,v)=>{
    const name=String(v.item).replace(/\s+—\s.*$/,'');
    const qty=Math.max(1, Number(String(v.qty).replace(/[^0-9.]/g,''))||1);
    return {patch:{}, consume:{name, qty},
      ev:{ic:'📦',h:'Parts used — '+qty+' × '+name, d:v.note||'', m:'You · just now'}};
  }},

 {id:'cost', ic:'💰', label:'Record what it cost', desc:'Extra spend that is not already on a contractor invoice or pulled from stock. Entered once.',
  roles:['supervisor','manager'],
  when:i=>i.cond!=='CLOSED',
  fields:[{k:'amt',t:'text',label:'Amount',req:true,ph:'e.g. 285'},
          {k:'what',t:'textarea',label:'What the money covered',req:true,ph:'e.g. Sunrise Plumbing call-out and spud gasket'}],
  apply:(i,v)=>{
    const amt=Number(String(v.amt).replace(/[^0-9.]/g,''))||0;
    // Additive, not an overwrite — matches how the parts/consume path already
    // adds to cost just below, and matches the domain core's cost move.
    return {patch:{cost:(typeof i.cost==='number'?i.cost:0)+amt},
      ev:{ic:'💰',h:'Cost recorded — '+money(amt),d:v.what+' · lands against the '+i.cat+' budget',m:'You · just now'}};
  }},

 {id:'pri', ic:'⚡', label:'Change how fast it needs looking at', desc:'Needs a reason. Priority changes are on the record too.',
  roles:['supervisor','manager'],
  when:i=>i.cond!=='CLOSED',
  fields:[{k:'p',t:'chips',label:'New priority',opts:['P0','P1','P2','P3','P4'],req:true},
          {k:'why',t:'textarea',label:'Why it changed',req:true}],
  apply:(i,v)=>({patch:{pri:v.p},ev:{ic:'⚡',h:'Priority changed to '+v.p+' — '+PRI_WORD[v.p],d:v.why,m:'You · just now'}})},
];

function ActionSheet({iss, role, onPick, onClose}){
  const LOCKED_OK=['evidence','back'];
  const locked=iss.cond==='CLOSED';
  const avail=locked ? MOVES.filter(m=>LOCKED_OK.includes(m.id)) : MOVES.filter(m=>m.when(iss) && roleCan(m,role));
  // complete -> verify -> close is a strict sequence; only flag a gated step as
  // "not available yet" if it's still ahead, not if it's already been passed.
  const STAGE={complete:0, verify:1, close:2};
  const reached = iss.cond==='MONITORING' ? 1 : iss.cond==='RESOLVED-VERIFY' ? 0 : -1;
  const seqBlocked = !locked ? MOVES.filter(m=>STAGE[m.id]!==undefined && !m.when(iss) && STAGE[m.id]>reached) : [];
  const roleBlocked = !locked ? MOVES.filter(m=>m.when(iss) && !roleCan(m,role)) : [];
  return (<>
    <div className="scrim" onClick={onClose}/>
    <div className="modal" role="dialog" aria-label="Update this issue">
      <div className="comp-h">What happened?</div>
      <div className="comp-sub">{iss.id} · viewing as {ROLE_META[role].label} · you record the event, the status follows from it</div>
      {locked && <div className="gate">🔒 This record is closed and locked to where it was verified. You can still attach late paperwork or report that it came back — everything else about it stays frozen.</div>}
      {avail.map(m=>(
        <button key={m.id} className="moverow" onClick={()=>onPick(m.id)}>
          <span className="mi">{m.ic}</span>
          <span><span className="mt">{m.label}</span>{m.desc&&<span className="md">{m.desc}</span>}</span>
        </button>))}
      {seqBlocked.length>0 && (
        <div className="gate">🔒 Not available yet: {seqBlocked.map(m=>m.label.toLowerCase()).join(', ')}. Each one needs the step before it, which is the whole point — nothing skips to closed.</div>)}
      {roleBlocked.length>0 && (
        <div className="gate">🔑 Needs Supervisor access: {roleBlocked.map(m=>m.label.toLowerCase()).join(', ')}. You're viewing as {ROLE_META[role].label}.</div>)}
      <div className="comp-actions"><button className="btn ghost" style={{flex:1}} onClick={onClose}>Cancel</button></div>
    </div>
  </>);
}

function ActionForm({move, iss, role, vendors, inventory, onCancel, onSubmit}){
  const fields = typeof move.fields==='function' ? move.fields(iss,role,vendors,inventory) : move.fields;
  const optsOf=f => typeof f.opts==='function' ? f.opts(iss,role) : f.opts;
  const [v,setV]=useState(()=>{
    const o={}; fields.forEach(f=>{ o[f.k]=f.t==='photo'?[]:(f.default?f.default(iss,role):''); }); return o;
  });
  const [busy,setBusy]=useState(false);
  const set=(k,val)=>setV(p=>({...p,[k]:val}));
  const ok=!busy && fields.every(f=>!f.req||(f.t==='photo'?(v[f.k]||[]).length>0:String(v[f.k]).trim()));
  const live=iss.hyps.filter(h=>!h.dead);
  async function pick(f, fileList){
    const files=Array.from(fileList||[]); if(!files.length) return;
    setBusy(true);
    const added=[];
    for(const file of files.slice(0,4)){ const shot=await ingestPhoto(file); if(shot) added.push(shot); }
    setV(p=>({...p,[f.k]:[...(p[f.k]||[]),...added].slice(0,6)}));
    setBusy(false);
  }
  return (<>
    <div className="scrim" onClick={onCancel}/>
    <div className="modal" role="dialog" aria-label={move.label}>
      <div className="comp-h">{move.ic} {move.label}</div>
      <div className="comp-sub">{iss.id} · {iss.title}</div>
      {fields.map(f=>(
        <div key={f.k}>
          <div className="lbl">{f.label}{f.req&&<span className="req">required</span>}</div>
          {f.t==='textarea' && <textarea rows="3" value={v[f.k]} placeholder={f.ph||''} onChange={e=>set(f.k,e.target.value)}/>}
          {f.t==='text' && <input className="txt" value={v[f.k]} placeholder={f.ph||''} onChange={e=>set(f.k,e.target.value)}/>}
          {f.t==='date' && <input className="txt" type="date" value={v[f.k]} onChange={e=>set(f.k,e.target.value)}/>}
          {f.t==='chips' && (optsOf(f).length
            ? <div className="chips">{optsOf(f).map(o=>(
                <button key={o} className="chip" aria-pressed={v[f.k]===o} onClick={()=>set(f.k,o)}>{o}</button>))}</div>
            : <div className="hint warn">{f.empty||'Nothing available to choose.'}</div>)}
          {f.t==='hyp' && <div className="chips">{live.map(h=>(
            <button key={h.t} className="chip" aria-pressed={v[f.k]===h.t} onClick={()=>set(f.k,h.t)}>{h.t}</button>))}</div>}
          {f.t==='photo' && <>
            <PhotoPicker busy={busy} onFiles={files=>pick(f,files)}/>
            <PhotoStrip photos={v[f.k]} onRemove={i=>set(f.k,(v[f.k]||[]).filter((_,n)=>n!==i))}/>
          </>}
        </div>))}
      <div className="comp-actions">
        <button className="btn ghost" onClick={onCancel}>Cancel</button>
        <button className="btn primary" disabled={!ok} onClick={()=>onSubmit(v)}>Put it on the record</button>
      </div>
    </div>
  </>);
}

/* Build the domino chain from the event log rather than an authored script.
   Every link points at a real recorded event; the trailing risk is the only
   projection, and it says so. */
function dominoesFrom(iss){
  const links=(iss.events||[]).map(e=>{
    const h=(e.h||'').toLowerCase();
    let k='ok';
    if(e.fail) k='bad';
    else if(h.includes('failed')||h.includes('blocked')||h.includes('escalat')) k='bad';
    else if(h.includes('no photo proof')||(e.d||'').includes('no photo proof')) k='bad';
    return {t:e.h, d:e.m||'', k, ic:e.ic};
  });
  const v=iss.vendor;
  if(v && v.photos===0 && v.claimed && v.claimed!=='—'){
    links.push({t:'Contractor billed without proof', d:v.invoice+' · '+v.due, k:'bad', ic:'🧾'});
  }
  if(iss.cond!=='CLOSED'){
    const risk = iss.cat==='Fire / Life Safety' ? 'Failed inspection, or the building sits open overnight'
      : iss.cat==='Water Intrusion'||iss.cat==='Plumbing' ? 'Water reaches substrate — mould, tile, subfloor'
      : iss.cat==='Electrical' ? 'Circuit fault or an outage during trading hours'
      : 'Whatever this becomes if it keeps sitting';
    links.push({t:risk, d:'Not yet — projected from the category, not recorded', k:'risk', ic:'⚠️'});
  }
  return links;
}

        </>; })()}

/* ============ STACKED ============ */
function Stacked({buildings, levels, zonesAll, issues, activeId, onPick}){
  return (
    <div className="stackview">
      <div className="stacks">
        {buildings.map(b=>{
          const ls=levels.filter(l=>l.b===b.id).sort((x,y)=>x.stack-y.stack);
          // The isometric tilt (rotateX/rotateZ below) drifts each higher
          // slab's label further up-left, and that drift is only visual —
          // it doesn't grow this element's actual layout box, so a plain
          // overflow:auto on .stackview can't scroll far enough to reach it
          // once a building has more than the ~2 levels this was tuned on.
          // Reserving real left margin, scaled to level count, fixes that.
          const driftPad = Math.max(0, ls.length - 2) * 60;
          return (
            <div key={b.id}>

function vendorRollup(vendors, issues){
  const map={};
  vendors.forEach(v=>{ map[v.name]={...v, notes:v.notes||[], history:v.history||[], jobs:[]}; });
  issues.forEach(i=>{
    if(!i.vendor) return;
    if(!map[i.vendor.name]) map[i.vendor.name]={id:null, name:i.vendor.name, trade:'—', contact:i.vendor.contact, notes:[], jobs:[]};
    map[i.vendor.name].jobs.push(i);
  });
  return Object.values(map).map(v=>{
    const open=v.jobs.filter(j=>j.cond!=='CLOSED');
    const closed=v.jobs.filter(j=>j.cond==='CLOSED');
    const owing=open.filter(j=>j.vendor.photos===0 && j.vendor.claimed && j.vendor.claimed!=='—');
    return {...v, total:v.jobs.length, openCount:open.length, closedCount:closed.length, owingCount:owing.length};
  }).sort((a,b)=> b.owingCount-a.owingCount || b.openCount-a.openCount || a.name.localeCompare(b.name));
}

function roomsRollup(buildings, levels, zonesAll, issues, recurring){
  const rows=[];
  buildings.forEach(b=>{
    levels.filter(l=>l.b===b.id).sort((x,y)=>y.stack-x.stack).forEach(l=>{
      (zonesAll[l.id]||[]).forEach(z=>{
        const open=issues.filter(i=>i.lvl===l.id&&i.zid===z.id&&i.cond!=='CLOSED').length;
        const closed=issues.filter(i=>i.lvl===l.id&&i.zid===z.id&&i.cond==='CLOSED').length;
        const dues=recurring.filter(r=>r.zid===z.id).map(dueStatus);
        const worstDue = dues.includes('overdue')?'overdue':dues.includes('today')?'today':null;
        rows.push({bldg:b, level:l, zone:z, open, closed, worstDue});
      });
    });
  });
  return rows;
}

function calendarEntries(issues, recurring){
  const list=[];
  issues.forEach(i=>{
    if(i.cond==='CLOSED') return;
    if(i.due) list.push({date:i.due, icon:'📌', title:i.title, kind:'Due date', sub:i.id+' · '+i.pri, issue:i});
    if(i.vendor && i.vendor.visitRaw) list.push({date:i.vendor.visitRaw, icon:'🚚', title:i.vendor.name+' — '+i.title, kind:'Vendor visit', sub:i.id, issue:i});
  });
  recurring.forEach(r=>{
    list.push({date:r.nextDue, icon:'🧹', title:r.title, kind:'Routine check', sub:r.cadence, rec:r});
  });
  return list.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1:0);
}

/* ============ MONEY ============ */
/* Cash on a job = contractor invoice + extras. Parts are inventory, not cash.
   accountedFor = cash + parts (tied to a work record). Enter once. */
function invoiceAmt(i){
  const s=i.vendor && i.vendor.invoice;
  if(!s || s==='—' || s==='') return 0;
  const m=String(s).replace(/,/g,'').match(/\$?\s*(\d+(?:\.\d+)?)/);
  return m?Number(m[1]):0;
}
function partsOf(i){ return Number(i.costParts)||0; }
function extrasOf(i){
  if(typeof i.costExtra==='number') return i.costExtra;
  const keyed=typeof i.cost==='number'?i.cost:0;
  return Math.max(0, keyed - partsOf(i));
}
function cashOf(i){ return invoiceAmt(i) + extrasOf(i); }
function costOf(i){ return cashOf(i) + partsOf(i); }
const money=n=>'$'+(Math.round(n||0)).toLocaleString();
function budgetPeriod(){ return 'FY '+new Date().getFullYear(); }

/* One pull of stock on a job: on-hand down, job parts up, this trade's accounted
   up, remaining down. That job IS the explanation — do not invent unexplained cash.
   unexplained is only cash spent with no work record: max(0, cash spent − accounted). */
function budgetRollup(budget, issues){
  return (budget||[]).filter(b=>!b.archived).map(b=>{
    const rel=issues.filter(i=>i.cat===b.category && costOf(i)>0);
    const logged=rel.reduce((a,i)=>a+costOf(i),0);
    const cashJobs=rel.reduce((a,i)=>a+cashOf(i),0);
    const spent=Math.max(Number(b.spent)||0, cashJobs);
    const budgeted=Number(b.budgeted)||0;
    return {...b,
      budgeted, spent, logged, jobs:rel, issues:rel.length,
      remaining:budgeted-logged,
      unaccounted:Math.max(0, spent-logged)};
  });
}

    </div>
  );
}

function InventoryPanel({inventory, levels, buildings, zonesAll, onAdjust, onAdd, onArchive, onClose, onGoRoom}){
  const [q,setQ]=useState('');
  const [adding,setAdding]=useState(false);
  const [drop,setDrop]=useState(null);
  const [form,setForm]=useState({name:'', cat:CAT[0], unit:'each', onHand:'', par:'', unitCost:'', place:''});
  const set=k=>e=>setForm(p=>({...p,[k]:e.target?e.target.value:e}));
  const active=(inventory||[]).filter(it=>!it.archived);
  const needle=q.trim().toLowerCase();
  const shown=needle ? active.filter(it=>(it.name+' '+it.cat).toLowerCase().includes(needle)) : active;
  const low=shown.filter(isLow);
  const restock=low.reduce((a,it)=>a+(it.par-it.onHand)*(it.unitCost||0),0);
  const rooms=[];
  buildings.forEach(b=>levels.filter(l=>l.b===b.id).forEach(l=>{
    (zonesAll[l.id]||[]).forEach(z=>rooms.push({key:l.id+'|'+z.id, lvl:l.id, zid:z.id, label:b.name+' · '+l.name+' · '+z.name}));
  }));
  const placeOf=it=>{
    const l=levels.find(x=>x.id===it.lvl);
    const b=l&&buildings.find(x=>x.id===l.b);
    const z=(zonesAll[it.lvl]||[]).find(z=>z.id===it.zid);
    return {label:(b?b.name:'—')+' · '+(l?l.name:'—')+' · '+(z?z.name:'—'), lvl:it.lvl, zid:it.zid};
  };
  const groups={};
  shown.forEach(it=>{ const p=placeOf(it); (groups[p.label]=groups[p.label]||{p,items:[]}).items.push(it); });
  function submit(){
    const name=form.name.trim(); if(!name) return;
    const unitCost=Number(String(form.unitCost).replace(/[^0-9.]/g,''));
    if(!(unitCost>0)) return;
    const loc=rooms.find(r=>r.key===form.place);
    onAdd({
      name, cat:form.cat, unit:form.unit.trim()||'each',
      onHand:Math.max(0, Number(form.onHand)||0),
      par:Math.max(0, Number(form.par)||0),
      unitCost,
      lvl:loc?loc.lvl:null, zid:loc?loc.zid:null,
    });
    setForm({name:'', cat:CAT[0], unit:'each', onHand:'', par:'', unitCost:'', place:''});
    setAdding(false);
  }

  const Item=({it})=>(
    <div className={'invrow'+(isLow(it)?' low':'')}>
      <span style={{flex:1,minWidth:0}}>
        <span className="invname">{it.name}</span>
        <span className="invsub">{it.cat} · {money(it.unitCost)}/{it.unit}
          {isLow(it) && <b> · {it.par-it.onHand} {it.unit} below par</b>}</span>
      </span>
      <span className="invcount">
        <span className="onhand">{it.onHand}<small>on hand</small></span>
        <span className="invacts">
          <button className="use" disabled={it.onHand<=0} onClick={()=>onAdjust(it.id,'onHand',-1)} aria-label={'Use one '+it.name}>Use 1</button>
          <button onClick={()=>onAdjust(it.id,'onHand',1)} aria-label={'Receive one '+it.name}>Receive</button>
        </span>
        <span className="invpar">
          Par {it.par}
          <button onClick={()=>onAdjust(it.id,'par',-1)} aria-label={'Lower par for '+it.name}>−</button>
          <button onClick={()=>onAdjust(it.id,'par',1)} aria-label={'Raise par for '+it.name}>+</button>
        </span>
      </span>
      {drop===it.id ? (
        <span style={{display:'flex',gap:4}}>
          <button className="ebtn danger" style={{padding:'4px 8px',fontSize:11}} onClick={()=>{onArchive(it.id); setDrop(null);}}>Remove</button>
          <button className="ebtn" style={{padding:'4px 8px',fontSize:11}} onClick={()=>setDrop(null)}>Keep</button>
        </span>
      ) : (
        <button className="invx" onClick={()=>setDrop(it.id)} aria-label={'Remove '+it.name} title="Remove from active inventory">×</button>
      )}
    </div>
  );

  return (
    <div className="dirwrap" role="dialog" aria-label="Inventory">
      <div className="dir-head">
        <div className="dir-top">
          <span className="dir-title">📦 Inventory</span>
          <button className="x" style={{marginLeft:'auto'}} onClick={onClose} aria-label="Back to the map">
            <span className="backlbl">Back to map</span><span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
      <div className="dir-body">
        <input className="dir-search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search stock…"/>
        <p className="dataline sub">Use 1 takes one off the shelf. Par is the restock line — it does not move when you use stock. To put the cost on a job, log parts on the ticket.</p>

        {!adding ? (
          <button className="btn primary" style={{width:'100%',margin:'8px 0 14px'}} onClick={()=>setAdding(true)}>＋ Add inventory item</button>
        ) : (
          <div className="invadd">
            <div className="vrow-h"><span className="vname">New item — same fields as an import row</span></div>
            <div className="lbl">Item<span className="req">required</span></div>
            <input className="txt" value={form.name} placeholder="e.g. Flush valve spud gasket" onChange={set('name')}/>
            <div className="lbl">Category</div>
            <div className="chips">{CAT.map(c=>(
              <button key={c} className="chip" aria-pressed={form.cat===c} onClick={()=>setForm(p=>({...p,cat:c}))}>{c}</button>))}</div>
            <div className="lbl">Unit</div>
            <input className="txt" value={form.unit} placeholder="each, case, gal" onChange={set('unit')}/>
            <div className="lbl">On hand — how many are on the shelf now</div>
            <input className="txt" inputMode="numeric" value={form.onHand} placeholder="e.g. 5" onChange={set('onHand')}/>
            <div className="lbl">Par — restock line. Using stock does not change this.</div>
            <input className="txt" inputMode="numeric" value={form.par} placeholder="e.g. 8" onChange={set('par')}/>
            <div className="lbl">Unit cost<span className="req">required</span></div>
            <input className="txt" inputMode="decimal" value={form.unitCost} placeholder="e.g. 6.00 — entered once" onChange={set('unitCost')}/>
            {rooms.length>0 && <>
              <div className="lbl">Stored in</div>
              <div className="chips">{rooms.map(r=>(
                <button key={r.key} className="chip" aria-pressed={form.place===r.key} onClick={()=>setForm(p=>({...p,place:r.key}))}>{r.label}</button>))}</div>
            </>}
            <p className="dataline sub">Price is entered here, once. Pulling this item onto a job uses that price. Do not re-type it on the work order.</p>
            <div className="comp-actions" style={{marginTop:12}}>
              <button className="btn ghost" onClick={()=>setAdding(false)}>Cancel</button>
              <button className="btn primary" disabled={!form.name.trim() || !(Number(String(form.unitCost).replace(/[^0-9.]/g,''))>0)} onClick={submit}>Add to inventory</button>
            </div>
          </div>
        )}

        {low.length>0 && (
          <div className="bud-gap" style={{background:'#FDF7EB',borderColor:'#E5B248'}}>
            <b style={{color:'#8A6B2E'}}>{low.length} item{low.length>1?'s':''} below par</b>
            <p style={{color:'#8A6B2E'}}>Bringing everything back to par costs about {money(restock)}.
              Stock you pull on a job is logged against that issue, so it lands in the budget with the work that used it.</p>
          </div>
        )}

        {active.length===0 && !adding && <div className="dir-empty">Nothing on the shelf. Add an item, or import the Inventory sheet from Your data.</div>}
        {active.length>0 && Object.keys(groups).length===0 && <div className="dir-empty">Nothing matches that search.</div>}

        {Object.entries(groups).map(([label,g])=>(
          <Fragment key={label}>
            <div className="room-group-h" style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{flex:1}}>{label}</span>
              {g.p.lvl && <button className="ebtn" style={{padding:'4px 10px',fontSize:11}}
                onClick={()=>onGoRoom(g.p.lvl,g.p.zid)}>Show on map</button>}
            </div>
            <div className="invcard">
              {g.items.sort((a,b)=>(isLow(b)?1:0)-(isLow(a)?1:0)).map(it=><Item key={it.id} it={it}/>)}
            </div>
          </Fragment>
        ))}
      </div>
    </div>
  );
}

/* ============ BUDGET ============ */
function BudgetPanel({budget, issues, onClose, onOpenIssue, onAdd, onArchive, onPatch}){
  const rows=useMemo(()=>budgetRollup(budget,issues),[budget,issues]);
  const [open,setOpen]=useState(null);
  const [adding,setAdding]=useState(false);
  const year=String(new Date().getFullYear());
  const [form,setForm]=useState({category:CAT[0], period:'FY '+year, budgeted:'', spent:'0'});
  const tot=rows.reduce((a,r)=>({b:a.b+r.budgeted, s:a.s+r.spent, l:a.l+r.logged}),{b:0,s:0,l:0});
  const gap=rows.reduce((a,r)=>a+(r.unaccounted||0),0);
  return (
    <div className="dirwrap" role="dialog" aria-label="Budget">
      <div className="dir-head">
        <div className="dir-top">
          <span className="dir-title">💰 Budget</span>
          <button className="x" style={{marginLeft:'auto'}} onClick={onClose} aria-label="Back to the map">
            <span className="backlbl">Back to map</span><span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
      <div className="dir-body">
        {!adding ? (
          <button className="btn primary" style={{width:'100%',margin:'0 0 14px'}} onClick={()=>setAdding(true)}>＋ Add a budget line</button>
        ) : (
          <div className="invadd">
            <div className="vrow-h"><span className="vname">New line — same fields as an import row</span></div>
            <div className="lbl">Category</div>
            <div className="chips">{CAT.map(c=>(
              <button key={c} className="chip" aria-pressed={form.category===c} onClick={()=>setForm(p=>({...p,category:c}))}>{c}</button>))}</div>
            <div className="lbl">Period<span className="req">required</span></div>
            <input className="txt" value={form.period} placeholder={'e.g. FY '+year} onChange={e=>setForm(p=>({...p,period:e.target.value}))}/>
            <div className="lbl">Budgeted<span className="req">required</span></div>
            <input className="txt" inputMode="decimal" value={form.budgeted} placeholder="e.g. 24000" onChange={e=>setForm(p=>({...p,budgeted:e.target.value}))}/>
            <div className="lbl">Already spent (from the books, optional)</div>
            <input className="txt" inputMode="decimal" value={form.spent} placeholder="0" onChange={e=>setForm(p=>({...p,spent:e.target.value}))}/>
            <p className="dataline sub">Cap is entered once. Job costs in this category fill in against it. Spreadsheet import is optional.</p>
            <div className="comp-actions" style={{marginTop:12}}>
              <button className="btn ghost" onClick={()=>setAdding(false)}>Cancel</button>
              <button className="btn primary" disabled={!form.period.trim() || !(Number(String(form.budgeted).replace(/[^0-9.]/g,''))>0)}
                onClick={()=>{
                  if(onAdd({category:form.category, period:form.period.trim(),
                    budgeted:Number(String(form.budgeted).replace(/[^0-9.]/g,''))||0,
                    spent:Number(String(form.spent).replace(/[^0-9.]/g,''))||0})){
                    setForm({category:CAT[0], period:'FY '+year, budgeted:'', spent:'0'}); setAdding(false);
                  }
                }}>Add line</button>
            </div>
          </div>
        )}
        {rows.length===0 && !adding && <div className="dir-empty">No budget lines yet. Add one here, or import a Budget sheet from Your data if you have one.</div>}

        {rows.length>0 && (
          <div className="bud-top">
            <div><span className="bud-k">Budgeted</span><b>{money(tot.b)}</b></div>
            <div><span className="bud-k">Spent</span><b>{money(tot.s)}</b></div>
            <div><span className="bud-k">Accounted for</span><b>{money(tot.l)}</b></div>
          </div>
        )}
        {rows.length>0 && gap>0 && (
          <div className="bud-gap">
            <b>{money(gap)} of spend has no work record behind it.</b>
            <p>Cash went out. Nothing in the facility log explains what it bought. Parts used on a
              job are already accounted — they do not belong in this gap.</p>
          </div>
        )}

        {rows.map(r=>{
          const over=r.logged>r.budgeted;
          const pctS=r.budgeted? Math.min(100, r.spent/r.budgeted*100):0;
          const pctL=r.budgeted? Math.min(100, r.logged/r.budgeted*100):0;
          const isOpen=open===r.category;
          return (
            <div key={r.category+r.period} className="bud-row">
              <button className="bud-h" onClick={()=>setOpen(isOpen?null:r.category)}>
                <span style={{flex:1,minWidth:0}}>
                  <span className="bud-cat">{r.category}</span>
                  <span className="bud-sub">{r.period} · {r.issues} record{r.issues===1?'':'s'} · {money(r.remaining)} remaining</span>
                </span>
                <span className={'bud-amt'+(over?' over':'')}>{money(r.logged)}<small> / {money(r.budgeted)}</small></span>
              </button>
              <div className="bud-bar">
                <div className="bud-fill spent" style={{width:pctS+'%', background:over?'var(--p0)':'var(--clay)'}}/>
                <div className="bud-fill logged" style={{width:pctL+'%'}}/>
              </div>
              <div className="bud-legend">
                <span><i className="sw" style={{background:over?'var(--p0)':'var(--clay)'}}/>spent {money(r.spent)}</span>
                <span><i className="sw" style={{background:'var(--sage-deep)'}}/>accounted {money(r.logged)}</span>
                {r.unaccounted>0 && <span className="bud-un">{money(r.unaccounted)} unexplained</span>}
              </div>
              {isOpen && (
                <div className="bud-jobs">
                  <div className="lbl" style={{marginTop:4}}>Budgeted</div>
                  <input className="txt" inputMode="decimal" defaultValue={r.budgeted}
                    onBlur={e=>onPatch(r.category,r.period,{budgeted:Number(String(e.target.value).replace(/[^0-9.]/g,''))||0})}/>
                  <div className="lbl">Spent (incurred cash)</div>
                  <input className="txt" inputMode="decimal" defaultValue={r.spent}
                    onBlur={e=>onPatch(r.category,r.period,{spent:Number(String(e.target.value).replace(/[^0-9.]/g,''))||0})}/>
                  <p className="dataline sub">Spent is cash out — vendor invoices, extras, stock receipts. Accounted is what is tied to a job. Do not re-type job costs here.</p>
                  {r.jobs.length ? r.jobs.map(j=>(
                    <button key={j.id} className="zrow" onClick={()=>onOpenIssue(j)}>
                      <span className="dot" style={{background:PRI_COLOR[j.pri],width:11,height:11,flex:'0 0 auto'}}/>
                      <span style={{flex:1,minWidth:0}}>
                        <span className="zt">{j.title}</span><br/>
                        <span className="zs mono">{j.id} · {money(costOf(j))}{j.vendor?' · '+j.vendor.name:' · in-house'}</span>
                      </span>
                    </button>
                  )) : <div className="zempty">No record in this category carries a cost yet. Pull parts, log an invoice, or record extras on a job.</div>}
                  <button className="ebtn danger" style={{width:'100%',marginTop:8}} onClick={()=>onArchive(r.category,r.period)}>Remove this line</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============ EXCEL EXPORT / IMPORT ============ */
/* Portability is the product promise here: if they stop paying, they keep a
   file that opens in Excel and still makes sense without this app. So every
   sheet is flat and human-readable — no JSON blobs in cells. */
function buildWorkbook({buildings, levels, zonesAll, issues, vendors, recurring, budget, inventory, propertyName, includeBudget}){
  const S=XLSX.utils;
  const wb=S.book_new();
  const nameOf=id=>{ const l=levels.find(x=>x.id===id); const b=l&&buildings.find(x=>x.id===l.b);
    return {bldg:b?b.name:'', level:l?l.name:''}; };
  const roomOf=i=>{ const zs=zonesAll[i.lvl]||[]; const z=zs.find(z=>z.id===i.zid); return z?z.name:''; };

  const issueRows=issues.map(i=>{
    const n=nameOf(i.lvl);
    return {
      'Issue ID':i.id, 'Title':i.title, 'Category':i.cat,
      'Priority':i.pri, 'Priority means':PRI_WORD[i.pri],
      'Condition':i.cond, 'Work state':i.work, 'Status':i.plain,
      'Building':n.bldg, 'Level':n.level, 'Room':roomOf(i),
      'Building ID': (levels.find(x=>x.id===i.lvl)||{}).b||'',
      'Level ID':i.lvl||'', 'Room ID':i.zid||'',
      'Pin X': i.rx==null?'':i.rx, 'Pin Y': i.ry==null?'':i.ry,
      'What was observed':i.saw, 'Reported by':i.sawBy, 'When':i.sawAt,
      'What we did':i.did, 'Done by':i.didBy,
      'Temporary control':i.control||'', 'Control expires':i.controlExp||'',
      'Verification':i.verify?i.verify.text:'', 'Verify state':i.verify?i.verify.state:'',
      'Owner':i.owner||'', 'Due':i.due||'',
      'Vendor':i.vendor?i.vendor.name:'', 'Vendor claimed':i.vendor?i.vendor.claimed:'',
      'We verified':i.vendor?i.vendor.verified:'', 'Photo proof count':i.vendor?i.vendor.photos:'',
      'Invoice':i.vendor?i.vendor.invoice:'',
      'Cost':i.cost==null?'':i.cost,
      'Photos attached':(i.photos||[]).length,
      'Evidence digests':(i.photos||[]).filter(p=>p.hash).map(p=>p.hash).join(' | '),
      'Linked to':i.linked||'', 'Escalated':i.escalated?'YES':'', 'Awaiting review':i.needsReview?'YES':'',
    };
  });
  S.book_append_sheet(wb, S.json_to_sheet(issueRows), 'Issues');

  const eventRows=[];
  issues.forEach(i=>(i.events||[]).forEach(e=>eventRows.push({
    'Issue ID':i.id, 'Event':e.h, 'Detail':e.d||'', 'Who / when':e.m||'',
    'Flagged':e.fail?'YES':'', 'Photos':(e.photos||[]).length,
  })));
  S.book_append_sheet(wb, S.json_to_sheet(eventRows), 'Event log');

  const vendorRows=vendors.filter(v=>!v.archived).map(v=>{
    const jobs=issues.filter(i=>i.vendor&&i.vendor.name===v.name);
    const owing=jobs.filter(j=>j.cond!=='CLOSED'&&j.vendor.photos===0&&j.vendor.claimed&&j.vendor.claimed!=='—');
    return {'Vendor':v.name, 'Trade':v.trade||'', 'Contact':v.contact||'',
      'Jobs total':jobs.length, 'Jobs open':jobs.filter(j=>j.cond!=='CLOSED').length,
      'Owing photo proof':owing.length,
      'Field notes':(v.notes||[]).map(n=>n.text).join(' | ')};
  });
  S.book_append_sheet(wb, S.json_to_sheet(vendorRows), 'Vendors');

  const histRows=[];
  vendors.forEach(v=>(v.history||[]).forEach(h=>histRows.push({
    'Vendor':v.name, 'Date':h.date||'', 'Description':h.description||'',
    'Amount':h.amount==null?'':h.amount, 'Invoice':h.invoice||'',
  })));
  if(!histRows.length) histRows.push({'Vendor':'','Date':'','Description':'','Amount':'','Invoice':''});
  S.book_append_sheet(wb, S.json_to_sheet(histRows), 'Vendor history');

  if(includeBudget!==false){
    const budgetRows=(budget||[]).filter(b=>!b.archived).map(b=>({
      'Category':b.category, 'Period':b.period, 'Budgeted':b.budgeted, 'Spent':b.spent,
      'Remaining':(Number(b.budgeted)||0)-(Number(b.spent)||0),
    }));
    if(!budgetRows.length) budgetRows.push({'Category':'','Period':'','Budgeted':'','Spent':'','Remaining':''});
    S.book_append_sheet(wb, S.json_to_sheet(budgetRows), 'Budget');
  }

  const bldgRows=buildings.map(b=>({
    'Building ID':b.id, 'Building':b.name, 'Emoji':b.emo||'', 'Kind':b.kind||'structure',
    'X':b.x, 'Y':b.y, 'W':b.w, 'H':b.h,
  }));
  if(!bldgRows.length) bldgRows.push({'Building ID':'','Building':'','Emoji':'','Kind':'','X':'','Y':'','W':'','H':''});
  S.book_append_sheet(wb, S.json_to_sheet(bldgRows), 'Buildings');

  const levelRows=levels.map(l=>{
    const b=buildings.find(x=>x.id===l.b);
    return {'Level ID':l.id, 'Building ID':l.b, 'Building':b?b.name:'', 'Level':l.name,
      'Emoji':l.emo||'', 'Stack':l.stack==null?'':l.stack};
  });
  if(!levelRows.length) levelRows.push({'Level ID':'','Building ID':'','Building':'','Level':'','Emoji':'','Stack':''});
  S.book_append_sheet(wb, S.json_to_sheet(levelRows), 'Levels');

  const roomRows=[];
  buildings.forEach(b=>levels.filter(l=>l.b===b.id).forEach(l=>{
    (zonesAll[l.id]||[]).forEach(z=>roomRows.push({
      'Building':b.name, 'Level':l.name, 'Room':z.name, 'Code':z.code,
      'Kind':(KINDS[z.kind]||{}).label||z.kind, 'Kind key':z.kind||'',
      'Building ID':b.id, 'Level ID':l.id, 'Room ID':z.id,
      'X':z.x, 'Y':z.y, 'W':z.w, 'H':z.h,
      'Open issues':issues.filter(i=>i.lvl===l.id&&i.zid===z.id&&i.cond!=='CLOSED').length,
      'Closed issues':issues.filter(i=>i.lvl===l.id&&i.zid===z.id&&i.cond==='CLOSED').length,
    }));
  }));
  if(!roomRows.length) roomRows.push({'Building':'','Level':'','Room':'','Code':'','Kind':'','Kind key':'','Building ID':'','Level ID':'','Room ID':'','X':'','Y':'','W':'','H':'','Open issues':'','Closed issues':''});
  S.book_append_sheet(wb, S.json_to_sheet(roomRows), 'Rooms');

  const recRows=(recurring||[]).map(r=>{
    const n=nameOf(r.lvl); const zs=zonesAll[r.lvl]||[]; const z=zs.find(z=>z.id===r.zid);
    return {'Check':r.title, 'Building':n.bldg, 'Level':n.level, 'Room':z?z.name:'',
      'Cadence':r.cadence, 'Last done':r.lastDone, 'Next due':r.nextDue,
      'State':dueStatus(r)};
  });
  if(!recRows.length) recRows.push({'Check':'','Building':'','Level':'','Room':'','Cadence':'','Last done':'','Next due':'','State':''});
  S.book_append_sheet(wb, S.json_to_sheet(recRows), 'Routine checks');

  const invRows=(inventory||[]).filter(it=>!it.archived).map(it=>{
    const n=nameOf(it.lvl); const zs=zonesAll[it.lvl]||[]; const z=zs.find(z=>z.id===it.zid);
    return {'Item':it.name, 'Category':it.cat, 'Unit':it.unit,
      'On hand':it.onHand, 'Par':it.par, 'Below par':Math.max(0,it.par-it.onHand),
      'Unit cost':it.unitCost, 'Value on hand':(it.onHand*(it.unitCost||0)),
      'Building':n.bldg, 'Level':n.level, 'Stored in':z?z.name:''};
  });
  if(!invRows.length) invRows.push({'Item':'','Category':'','Unit':'','On hand':'','Par':'','Below par':'','Unit cost':'','Value on hand':'','Building':'','Level':'','Stored in':''});
  S.book_append_sheet(wb, S.json_to_sheet(invRows), 'Inventory');

  S.book_append_sheet(wb, S.json_to_sheet([
    {'Field':'Property','Value':propertyName},
    {'Field':'Exported','Value':new Date().toLocaleString()},
    {'Field':'Issues','Value':issues.length},
    {'Field':'Rooms','Value':roomRows.length},
    {'Field':'Vendors','Value':vendors.length},
    {'Field':'Note','Value':'Every sheet is plain and readable without Facilities Evidence OS. Photographs are not embedded; the Issues sheet lists their SHA-256 digests.'},
  ]), 'About');

  return wb;
}

/* Import merges — it never wipes what is already there. Vendors match on name.
   Sheet titles do not have to say “Vendors” / “Inventory” / “Budget”. We read
   the columns (and the file name) and classify. A FEOS export still round-trips
   because those exact sheet names win first. */
function normHeader(s){ return String(s||'').replace(/^\ufeff/,'').trim(); }
function compactHeader(s){ return normHeader(s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function cell(row, ...names){
  const keys=Object.keys(row||{});
  for(const n of names){
    if(row[n]!=null && row[n]!=='') return row[n];
    const want=String(n).toLowerCase();
    const wantC=compactHeader(n);
    let hit=keys.find(k=>normHeader(k).toLowerCase()===want);
    if(hit==null) hit=keys.find(k=>compactHeader(k)===wantC);
    if(hit==null && wantC.length>=4){
      hit=keys.find(k=>{
        const c=compactHeader(k);
        return c.includes(wantC) || (c.length>=4 && wantC.includes(c));
      });
    }
    if(hit!=null && row[hit]!=='' && row[hit]!=null) return row[hit];
  }
  return '';
}
function headerKeys(rows){
  if(!rows || !rows.length) return [];
  return Object.keys(rows[0]).map(k=>normHeader(k).toLowerCase()).filter(Boolean);
}
function keysHit(keys, aliases){
  const compact=keys.map(k=>k.replace(/[^a-z0-9]/g,''));
  return aliases.some(a=>{
    const want=String(a).toLowerCase();
    const wantC=want.replace(/[^a-z0-9]/g,'');
    return keys.some(k=>k===want || k.includes(want)) ||
      (wantC.length>=3 && compact.some(c=>c===wantC || c.includes(wantC) || (c.length>=4 && wantC.includes(c))));
  });
}
const LEDGER_KIND = {
  vendors: {
    names: ['vendors','vendor','contractors','contractor','suppliers','supplier','vendor list','vendor roster','contractor list','contacts'],
    need: ['vendor','vendor name','company','contractor','contractor name','supplier','business','firm'],
    boost: ['trade','specialty','contact','phone','email','rep'],
  },
  inventory: {
    names: ['inventory','stock','parts','materials','supplies','parts list','inventory list','items','item list'],
    need: ['item','item name','part','part name','part number','sku','product','material','description'],
    boost: ['on hand','onhand','qty','quantity','par','unit cost','unit','stock','qoh'],
  },
  budget: {
    names: ['budget','budgets','gl','accounts','cost codes','budget vs actual'],
    need: ['budgeted','budget','budget amount','approved budget','approved'],
    boost: ['spent','actual','remaining','period','year','category','ytd'],
  },
  history: {
    names: ['vendor history','history','invoices','payments','job costs','job history'],
    need: ['amount','invoice'],
    boost: ['vendor','date','description'],
  },
};
function nameHint(label, aliases){
  const n=normHeader(label).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  if(!n) return false;
  return aliases.some(a=>{
    if(n===a) return true;
    if(a.length>=3 && n.includes(a)) return true;
    return false;
  });
}
function scoreLedgerKind(kind, sheetName, keys, fileName){
  const spec=LEDGER_KIND[kind]; if(!spec) return 0;
  let s=0;
  if(nameHint(sheetName, spec.names)) s+=6;
  if(nameHint(String(fileName||'').replace(/\.[^.]+$/,''), spec.names)) s+=3;
  if(keysHit(keys, spec.need)) s+=5;
  spec.boost.forEach(b=>{ if(keysHit(keys,[b])) s+=1; });
  if(kind==='inventory' && keysHit(keys,['on hand','qty','quantity','par','qoh'])) s+=2;
  if(kind==='budget' && keysHit(keys,['budgeted','budget','spent','remaining']) && !keysHit(keys,['on hand','qty','par'])) s+=2;
  if(kind==='vendors' && keysHit(keys,['trade','phone','contact']) && !keysHit(keys,['on hand','budgeted','qty'])) s+=2;
  if(kind==='history' && keysHit(keys,['amount','invoice','date']) && !keysHit(keys,['budgeted','on hand'])) s+=2;
  return s;
}
function pickLedgerKind(sheetName, keys, fileName){
  let best='', score=0;
  Object.keys(LEDGER_KIND).forEach(k=>{
    const n=scoreLedgerKind(k, sheetName, keys, fileName);
    if(n>score){ best=k; score=n; }
  });
  return score>=5 ? best : '';
}
function parseSpreadsheet(buf, fileName){
  let wb;
  try{
    wb=XLSX.read(buf,{type:'array', cellFormula:false, cellHTML:false, raw:false});
  }catch(e1){
    try{
      const text=new TextDecoder('utf-8').decode(buf);
      wb=XLSX.read(text,{type:'string', cellFormula:false, raw:false});
    }catch(_){
      throw e1;
    }
  }
  return {wb, fileName: String(fileName||'')};
}
function readWorkbook(buf, fileName, forceKind){
  const {wb}=parseSpreadsheet(buf, fileName);
  const sheets=wb.SheetNames.map(n=>normHeader(n));
  const clean=row=>{
    const o={};
    Object.keys(row||{}).forEach(k=>{
      if(k==='__proto__'||k==='constructor'||k==='prototype') return;
      const key=normHeader(k).slice(0,80);
      if(!key) return;
      const v=row[k];
      if(typeof v==='string') o[key]=v.replace(/^\ufeff/,'').slice(0,500);
      else if(typeof v==='number' && isFinite(v)) o[key]=v;
      else if(v==null) o[key]='';
    });
    return o;
  };
  const rowsOf=real=>XLSX.utils.sheet_to_json(wb.Sheets[real],{defval:'', raw:false}).slice(0,500).map(clean);
  const grab=n=>{
    const want=n.toLowerCase();
    const real=wb.SheetNames.find(s=>normHeader(s).toLowerCase()===want);
    if(!real) return [];
    return rowsOf(real);
  };
  const packed=wb.SheetNames.map(real=>{
    const rows=rowsOf(real);
    return {real, name:normHeader(real), rows, keys:headerKeys(rows)};
  });
  const preview=[];
  packed.forEach(s=>s.keys.forEach(k=>{ if(preview.length<12 && !preview.includes(k)) preview.push(k); }));

  const used=new Set();
  const take=(kind, exact)=>{
    const hit=packed.find(s=>!used.has(s.real) && normHeader(s.name).toLowerCase()===exact);
    if(!hit) return [];
    used.add(hit.real);
    return hit.rows;
  };

  let budget=take('budget','budget');
  let history=take('history','vendor history');
  let vendors=take('vendors','vendors');
  let inventory=take('inventory','inventory');
  ['buildings','levels','rooms','issues','event log','routine checks','about'].forEach(n=>{
    const hit=packed.find(s=>normHeader(s.name).toLowerCase()===n);
    if(hit) used.add(hit.real);
  });

  if(forceKind && LEDGER_KIND[forceKind]){
    const leftover=packed.filter(s=>s.rows.length && !used.has(s.real));
    const rows=leftover.length ? leftover.flatMap(s=>s.rows) : packed.flatMap(s=>s.rows);
    if(forceKind==='budget') budget=budget.concat(rows);
    if(forceKind==='vendors') vendors=vendors.concat(rows);
    if(forceKind==='inventory') inventory=inventory.concat(rows);
    if(forceKind==='history') history=history.concat(rows);
  }else{
    packed.forEach(s=>{
      if(used.has(s.real) || !s.rows.length) return;
      const kind=pickLedgerKind(s.name, s.keys, fileName);
      if(!kind) return;
      used.add(s.real);
      if(kind==='budget') budget=budget.concat(s.rows);
      else if(kind==='vendors') vendors=vendors.concat(s.rows);
      else if(kind==='inventory') inventory=inventory.concat(s.rows);
      else if(kind==='history') history=history.concat(s.rows);
    });
  }

  return {
    budget, history, vendors, inventory, sheets, preview,
    buildings:grab('Buildings'), levels:grab('Levels'), rooms:grab('Rooms'),
    issues:grab('Issues'), events:grab('Event log'), checks:grab('Routine checks'),
  };
}

function kindKey(label){
  const s=String(label||'').trim().toLowerCase();
  if(KINDS[s]) return s;
  const hit=Object.keys(KINDS).find(k=>(KINDS[k].label||'').toLowerCase()===s);
  return hit||'office';
}
function hasGeom(r){
  return cell(r,'X')!=='' && cell(r,'Y')!=='' && cell(r,'W')!=='' && cell(r,'H')!=='';
}
function restoreFacility(parsed, cur){
  const buildings=cur.buildings.map(b=>({...b}));
  const levels=cur.levels.map(l=>({...l}));
  const zonesAll={}; Object.keys(cur.zonesAll||{}).forEach(k=>{ zonesAll[k]=(cur.zonesAll[k]||[]).map(z=>({...z})); });
  let bseq=cur.bseq||0, lseq=cur.lseq||0, zseq=cur.zseq||0, seq=cur.seq||1000;
  const counts={buildings:0, levels:0, rooms:0, issues:0, events:0, checks:0};

  const findB=name=>buildings.find(b=>b.name.toLowerCase()===String(name||'').trim().toLowerCase());
  const findL=(bid,name)=>levels.find(l=>l.b===bid && l.name.toLowerCase()===String(name||'').trim().toLowerCase());
  const findZ=(lid,name)=>(zonesAll[lid]||[]).find(z=>z.name.toLowerCase()===String(name||'').trim().toLowerCase());

  (parsed.buildings||[]).forEach(r=>{
    const name=String(cell(r,'Building')||'').trim(); if(!name) return;
    const id=String(cell(r,'Building ID')||'').trim();
    if(id && buildings.some(b=>b.id===id)) return;
    if(findB(name)) return;
    bseq++;
    const nb={id: id||('B'+bseq), emo:String(cell(r,'Emoji')||'🏢')||'🏢', name,
      kind:kindKey(cell(r,'Kind')||'structure'),
      x:hasGeom(r)?Number(cell(r,'X')):snap(80+((buildings.length%2)*480)),
      y:hasGeom(r)?Number(cell(r,'Y')):snap(80+(Math.floor(buildings.length/2)*280)),
      w:hasGeom(r)?Number(cell(r,'W')):440, h:hasGeom(r)?Number(cell(r,'H')):240};
    buildings.push(nb); counts.buildings++;
  });

  (parsed.rooms||[]).forEach(r=>{
    const bName=String(cell(r,'Building')||'').trim();
    const lName=String(cell(r,'Level')||'').trim();
    const rName=String(cell(r,'Room')||'').trim();
    if(!bName||!lName||!rName) return;
    let b= (cell(r,'Building ID') && buildings.find(x=>x.id===String(cell(r,'Building ID')))) || findB(bName);
    if(!b){
      bseq++;
      b={id:String(cell(r,'Building ID')||('B'+bseq)), emo:'🏢', name:bName, kind:'structure',
        x:snap(80+((buildings.length%2)*480)), y:snap(80+(Math.floor(buildings.length/2)*280)), w:440, h:240};
      buildings.push(b); counts.buildings++;
    }
    let l= (cell(r,'Level ID') && levels.find(x=>x.id===String(cell(r,'Level ID')))) || findL(b.id, lName);
    if(!l){
      lseq++;
      const lid=String(cell(r,'Level ID')|| (b.id+'-'+lseq));
      l={id:lid, b:b.id, emo:String(cell(r,'Emoji')||'🚪')||'🚪', name:lName, stack:Number(cell(r,'Stack'))||0};
      levels.push(l); if(!zonesAll[l.id]) zonesAll[l.id]=[]; counts.levels++;
    }
    if(!zonesAll[l.id]) zonesAll[l.id]=[];
    if(findZ(l.id, rName)) return;
    if(cell(r,'Room ID') && zonesAll[l.id].some(z=>z.id===String(cell(r,'Room ID')))) return;
    zseq++;
    const i=zonesAll[l.id].length;
    const cols=3;
    const z={
      id: String(cell(r,'Room ID')||('n'+zseq)),
      code: String(cell(r,'Code')||('RM-'+zseq)),
      name: rName,
      kind: kindKey(cell(r,'Kind key')||cell(r,'Kind')),
      x: hasGeom(r)?Number(cell(r,'X')): (40+(i%cols)*300),
      y: hasGeom(r)?Number(cell(r,'Y')): (40+Math.floor(i/cols)*180),
      w: hasGeom(r)?Number(cell(r,'W')): 280,
      h: hasGeom(r)?Number(cell(r,'H')): 160,
    };
    zonesAll[l.id].push(z); counts.rooms++;
  });

  (parsed.levels||[]).forEach(r=>{
    const lName=String(cell(r,'Level')||'').trim(); if(!lName) return;
    const bName=String(cell(r,'Building')||'').trim();
    const bid=String(cell(r,'Building ID')||'');
    const b= buildings.find(x=>x.id===bid) || findB(bName);
    if(!b) return;
    if(findL(b.id, lName)) return;
    if(cell(r,'Level ID') && levels.some(x=>x.id===String(cell(r,'Level ID')))) return;
    lseq++;
    levels.push({id:String(cell(r,'Level ID')||(b.id+'-'+lseq)), b:b.id,
      emo:String(cell(r,'Emoji')||'🚪')||'🚪', name:lName, stack:Number(cell(r,'Stack'))||0});
    counts.levels++;
  });

  const locate=(r)=>{
    const lid=String(cell(r,'Level ID')||'');
    const zid=String(cell(r,'Room ID')||'');
    if(lid && zid && (zonesAll[lid]||[]).some(z=>z.id===zid)) return {lvl:lid, zid};
    const b=findB(cell(r,'Building'));
    const l=b && findL(b.id, cell(r,'Level'));
    if(!l) return null;
    const z=findZ(l.id, cell(r,'Room'));
    return z ? {lvl:l.id, zid:z.id} : {lvl:l.id, zid:null};
  };

  const issues=cur.issues.map(i=>({...i}));
  const seen=new Set(issues.map(i=>i.id));
  const eventsBy={};
  (parsed.events||[]).forEach(r=>{
    const id=String(cell(r,'Issue ID')||'').trim(); if(!id) return;
    (eventsBy[id]=eventsBy[id]||[]).push({
      ic:'📋', h:String(cell(r,'Event')||''), d:String(cell(r,'Detail')||''),
      m:String(cell(r,'Who / when','Who/when')||''), fail:String(cell(r,'Flagged')||'').toUpperCase()==='YES',
    });
  });

  (parsed.issues||[]).forEach(r=>{
    let id=String(cell(r,'Issue ID')||'').trim();
    if(!id){ seq++; id='ISS-'+seq; }
    if(seen.has(id)) return;
    const loc=locate(r);
    const pri=String(cell(r,'Priority')||'P3').trim()||'P3';
    const cond=String(cell(r,'Condition')||'OPEN').trim()||'OPEN';
    const work=String(cell(r,'Work state')||'UNASSIGNED').trim()||'UNASSIGNED';
    const vName=String(cell(r,'Vendor')||'').trim();
    const hashes=String(cell(r,'Evidence digests')||'').split('|').map(s=>s.trim()).filter(Boolean);
    const photos=hashes.map(h=>({hash:h, name:'evidence.jpg', thumb:null}));
    const rx=cell(r,'Pin X')===''?0.5:Number(cell(r,'Pin X'));
    const ry=cell(r,'Pin Y')===''?0.5:Number(cell(r,'Pin Y'));
    const nw={
      id, title:String(cell(r,'Title')||'Imported record').trim()||'Imported record',
      cat:String(cell(r,'Category')||'General Repair').trim()||'General Repair',
      pri, cond, work,
      saw:String(cell(r,'What was observed')||''), sawBy:String(cell(r,'Reported by')||'Imported'),
      sawAt:String(cell(r,'When')||''), did:String(cell(r,'What we did')||'Nothing yet.')||'Nothing yet.',
      didBy:String(cell(r,'Done by')||'—')||'—',
      control:String(cell(r,'Temporary control')||'')||undefined,
      controlExp:String(cell(r,'Control expires')||'')||undefined,
      verify:{state:String(cell(r,'Verify state')||'none')||'none', text:String(cell(r,'Verification')||'')},
      owner:String(cell(r,'Owner')||'')||undefined,
      due:String(cell(r,'Due')||'')||undefined,
      vendor: vName ? {name:vName, contact:'—', visit:String(cell(r,'Vendor claimed')?'':'—'),
        claimed:String(cell(r,'Vendor claimed')||'—')||'—',
        verified:String(cell(r,'We verified')||'—')||'—',
        photos:Number(cell(r,'Photo proof count'))||0,
        invoice:String(cell(r,'Invoice')||'—')||'—'} : null,
      cost: cell(r,'Cost')===''?undefined:Number(cell(r,'Cost')),
      photos, hash: hashes[0] || 'Imported from spreadsheet — original photographs not attached',
      linked:String(cell(r,'Linked to')||'')||undefined,
      escalated:String(cell(r,'Escalated')||'').toUpperCase()==='YES',
      needsReview:String(cell(r,'Awaiting review')||'').toUpperCase()==='YES',
      hyps:[], chain:[], domino:[], origin:'imported',
      lvl: loc?loc.lvl:null, zid: loc?loc.zid:null, rx, ry,
    };
    nw.plain = String(cell(r,'Status')||'') || plainOf(nw);
    nw.events = eventsBy[id] && eventsBy[id].length ? eventsBy[id] : [{ic:'📥',h:'Imported from spreadsheet',d:'Photographs are not in the file — only their digests, if any.',m:'Import'}];
    counts.events += (eventsBy[id]||[]).length;
    issues.push(nw); seen.add(id); counts.issues++;
  });

  const recurring=cur.recurring.map(x=>({...x}));
  (parsed.checks||[]).forEach(r=>{
    const title=String(cell(r,'Check')||'').trim(); if(!title) return;
    const loc=locate(r);
    if(recurring.some(x=>x.title===title && x.lvl===(loc&&loc.lvl))) return;
    recurring.push({id:'rec'+(recurring.length+1), title, cadence:String(cell(r,'Cadence')||'Weekly'),
      lastDone:String(cell(r,'Last done')||''), nextDue:String(cell(r,'Next due')||''),
      lvl:loc?loc.lvl:null, zid:loc?loc.zid:null});
    counts.checks++;
  });

  return {buildings, levels, zonesAll, issues, recurring, bseq, lseq, zseq, seq, counts};
}

        <div className="pack-integrity">
          <b>About this document</b>
          <p>{real.length>0
            ? `${real.length} of ${photos.length} attached photograph${photos.length>1?'s carry':' carries'} a SHA-256 digest computed in the browser from the original file at the moment of capture. The digest identifies that exact file. It does not by itself prove when or where the photograph was taken.`
            : 'No cryptographic digest is attached to this record.'}</p>
          {demo && <p><b>Demo record.</b> This issue is seeded example data. Its narrative and any photograph counts described in the observation are illustrative, not captured evidence.</p>}
          <p>Section 7 is generated from the event log, not written by hand. Entries are appended; a correction is a new entry rather than an edit.</p>
          <p className="pack-proto"><b>Prototype limitation:</b> this build stores a downscaled copy of each photograph for display. The digest above refers to the original file, which is not retained here. A production deployment would keep the original and re-verify against it.</p>
        </div>
      </div>
    </div>
  );
}

/* ============ API CLIENT ============ */
/* Standalone by default. Double-click still runs on seed data with no server.
   Live mode: ?api=https://host&session=<token>&facility=FAC-1234
   The session is identity. It is never written to localStorage, never left
   in the address bar, and never sent anywhere except Authorization on the
   pinned API origin. */
const CFG_KEY='feos_api_cfg';
const SESS_KEY='feos_sess';
const SECRET_KEYS=['session','enroll','token','pin','access_token','refresh','password','key','secret','role'];
function safeJsonParse(raw){
  try{
    return JSON.parse(raw, (k,v)=> (k==='__proto__'||k==='constructor'||k==='prototype') ? undefined : v);
  }catch(_){ return null; }
}
function asSession(v){
  return (typeof v==='string' && v.length>=16 && v.length<=2048 && /^[A-Za-z0-9._~+/-]+=*$/.test(v)) ? v : null;
}
function asPin(v){
  return (typeof v==='string' && v.length>=6 && v.length<=64 && /^[\x21-\x7e]+$/.test(v)) ? v : null;
}
function allowedApiBase(raw){
  if(!raw || typeof raw!=='string') return null;
  let u; try{ u=new URL(raw.trim()); }catch(_){ return null; }
  if(u.username || u.password) return null;
  const host=u.hostname.toLowerCase();
  const local=host==='127.0.0.1' || host==='localhost' || host==='[::1]';
  if(u.protocol==='http:'){ if(!local) return null; }
  else if(u.protocol!=='https:') return null;
  u.hash=''; u.search='';
  return u.origin;
}
function takeLaunchParams(){
  let hash=new URLSearchParams((location.hash||'').replace(/^#/, ''));
  let query=new URLSearchParams(location.search);
  const get=k => hash.get(k) || query.get(k);
  const out={api:get('api'), session:get('session'), facility:get('facility'), enroll:get('enroll')};
  try{
    let dirty=false;
    SECRET_KEYS.forEach(k=>{
      if(hash.has(k)){ hash.delete(k); dirty=true; }
      if(query.has(k)){ query.delete(k); dirty=true; }
    });
    if(query.has('api')){ query.delete('api'); dirty=true; }
    if(hash.has('api')){ hash.delete('api'); dirty=true; }
    ['role','view'].forEach(k=>{
      if(query.has(k)){ query.delete(k); dirty=true; }
      if(hash.has(k)){ hash.delete(k); dirty=true; }
    });
    if(dirty){
      const q=query.toString();
      const h=hash.toString();
      history.replaceState({}, '', location.pathname+(q?'?'+q:'')+(h?'#'+h:''));
    }
  }catch(_){}
  return out;
}
function wipeFacilityCache(facility){
  try{
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); if(!k) continue;
      if(k===CFG_KEY) continue;
      if(k.indexOf('feos_')===0) keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }catch(_){}
}
const API = {
  base:null, session:null, facility:null, me:null, enrollToken:null, claimRole:'tech',
  init(){
    const launch=takeLaunchParams();
    const stored=safeJsonParse(localStorage.getItem(CFG_KEY)||'null');
    const pinned=stored && allowedApiBase(stored.base);
    const fromLaunch=allowedApiBase(launch.api);
    this.base = pinned || fromLaunch || null;
    this.facility = (launch.facility || (stored&&stored.facility) || '').replace(/[^A-Za-z0-9._:-]/g,'').slice(0,64) || null;
    this.enrollToken = launch.enroll && /^[A-Za-z0-9._-]{8,200}$/.test(launch.enroll) ? launch.enroll : null;
    const memSess=(()=>{ try{ return sessionStorage.getItem(SESS_KEY); }catch(_){ return null; } })();
    this.session = asSession(launch.session) || asSession(memSess) || null;
    this.persist();
    return this.on();
  },
  persist(){
    try{
      if(this.base) localStorage.setItem(CFG_KEY, JSON.stringify({base:this.base, facility:this.facility||null}));
      if(this.session) sessionStorage.setItem(SESS_KEY, this.session);
      else sessionStorage.removeItem(SESS_KEY);
    }catch(_){}
  },
  on(){ return !!(this.base && this.session); },
  headers(){
    const h={'Content-Type':'application/json', 'Accept':'application/json', 'X-FEOS-Role':authRole()};
    if(this.session) h['Authorization']='Bearer '+this.session;
    return h;
  },
  safePath(path){
    if(typeof path!=='string' || path[0]!=='/' || path.indexOf('//')===0) return null;
    if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(path)) return null;
    return path;
  },
  async call(method, path, payload){
    const role=authRole();
    if(isBudgetRequest(path, payload) && !canSeeBudget(role)){
      throw budgetForbidden(role, method+' '+path, path);
    }
    if(!this.base) throw new Error('Not connected to a server.');
    const p=this.safePath(path);
    if(!p) throw new Error('Bad request path.');
    const url=this.base+p;
    let dest; try{ dest=new URL(url); }catch(_){ throw new Error('Bad request path.'); }
    if(dest.origin!==this.base) throw new Error('Request origin does not match the pinned API.');
    const ctrl=typeof AbortController!=='undefined' ? new AbortController() : null;
    const t=ctrl ? setTimeout(()=>ctrl.abort(), 25000) : null;
    let res;
    try{
      res=await fetch(url, {
        method, headers:this.headers(),
        body: payload===undefined ? undefined : JSON.stringify(payload),
        credentials:'omit', cache:'no-store', redirect:'error',
        mode:'cors', referrerPolicy:'no-referrer',
        signal: ctrl ? ctrl.signal : undefined,
      });
    }catch(err){
      if(err && err.name==='AbortError') throw new Error('The facility server did not answer in time.');
      throw err;
    }finally{ if(t) clearTimeout(t); }
    const text=await res.text();
    let data=null; try{ data=text?safeJsonParse(text):null; }catch(_){}
    if(!res.ok){
      const err=new Error((data&&typeof data.error==='string'&&data.error.slice(0,240)) || `Request failed (${res.status})`);
      err.status=res.status; err.kind=data&&data.kind;
      throw err;
    }
    return projectForRole(data, role);
  },
  async enroll(pin, label){
    const p=asPin(pin);
    if(!this.enrollToken || !p) throw new Error('Enrollment needs a PIN of at least 6 characters.');
    const rec=await this.call('POST', '/enroll/'+encodeURIComponent(this.enrollToken), {pin:p, label:(label||'').slice(0,40)});
    const sess=asSession(rec && rec.session);
    if(!sess) throw new Error('The server did not return a usable session.');
    this.session=sess; this.enrollToken=null;
    if(rec && rec.role) this.me={...(this.me||{}), role:rec.role};
    if(rec && rec.me) this.me=rec.me;
    this.persist();
    return rec;
  },
  async signInWithPin(userId, pin){
    const p=asPin(pin);
    if(!p) throw new Error('That PIN is not usable.');
    const rec=await this.call('POST', '/auth/pin', {user_id:String(userId||'').slice(0,80), pin:p});
    const sess=asSession(rec && rec.session);
    if(!sess) throw new Error('The server did not return a usable session.');
    this.session=sess;
    if(rec && rec.role) this.me={...(this.me||{}), role:rec.role};
    if(rec && rec.me) this.me=rec.me;
    this.persist();
    return rec;
  },
  signOut(){
    this.session=null; this.enrollToken=null; this.me=null; this.claimRole='tech';
    try{ sessionStorage.removeItem(SESS_KEY); }catch(_){}
    wipeFacilityCache(this.facility);
    this.persist();
  },
  async notifications(unreadOnly){
    return this.call('GET', '/notifications' + (unreadOnly ? '?unread=1' : ''));
  },
  async markRead(ids){
    return this.call('POST', '/notifications/read', ids ? {ids} : {});
  },
  async floorplan(sha){
    if(!/^[a-fA-F0-9]{32,128}$/.test(sha||'')) throw new Error('Could not load the floorplan.');
    const key='feos_plan_'+(this.facility||'x')+'_'+sha;
    try{ const hit=localStorage.getItem(key); if(hit && hit.slice(0,5)==='data:') return hit; }catch(_){}
    const res=await fetch(this.base+'/floorplans/'+sha, {
      headers:this.headers(), credentials:'omit', cache:'no-store',
      redirect:'error', mode:'cors', referrerPolicy:'no-referrer',
    });
    if(!res.ok) throw new Error('Could not load the floorplan.');
    const blob=await res.blob();
    if(blob.size>8*1024*1024) throw new Error('Floorplan is too large to keep on this phone.');
    const dataUrl=await new Promise((ok,no)=>{
      const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=no; r.readAsDataURL(blob);
    });
    try{ localStorage.setItem(key, dataUrl); }catch(_){}
    return dataUrl;
  },
};

function EnrollGate({onDone, onCancel}){
  const [pin,setPin]=useState('');
  const [label,setLabel]=useState('');

      </div>

  </>);
}

/* ============ OFFLINE QUEUE ============ */
function outboxKey(){ return 'feos_outbox_'+(API.facility||'local'); }
function outboxRead(){ try{ const q=safeJsonParse(localStorage.getItem(outboxKey())||'[]'); return Array.isArray(q)?q.slice(0,80):[]; }catch(_){ return []; } }
function outboxWrite(q){ try{ localStorage.setItem(outboxKey(), JSON.stringify(q)); }catch(_){} }
function outboxPush(entry){
  const q=outboxRead();
  const payload=entry.payload && typeof entry.payload==='object' ? entry.payload : {};
  q.push({method:entry.method, path:entry.path, payload, queuedAt:new Date().toISOString()});
  outboxWrite(q);
  return q.length;
}
async function outboxFlush(){
  if(!API.on()) return {sent:0, failed:0, left:outboxRead().length};
  let q=outboxRead(), sent=0, failed=0;
  const keep=[];
  for(const item of q){
    try{
      await API.call(item.method, item.path, item.payload);
      sent++;
    }catch(err){
      if(err.status && err.status>=400 && err.status<500){ failed++; }
      else { keep.push(item); }
    }
  }
  outboxWrite(keep);
  return {sent, failed, left:keep.length};
}

/* ============ PERSISTENCE ============ */
const SAVE_KEY='feos_state_v3';
const SITE_KEY='feos_site_id';
function isSiteId(v){ return typeof v==='string' && /^s_[a-f0-9]{32}$/.test(v); }
function siteFromUrl(){
  try{ const s=new URLSearchParams(location.search).get('site')||''; return isSiteId(s)?s:''; }catch(_){ return ''; }
}
function readSiteId(){
  const fromUrl=siteFromUrl();
  if(fromUrl){
    try{ localStorage.setItem(SITE_KEY, fromUrl); }catch(_){}
    return fromUrl;
  }
  try{ const s=localStorage.getItem(SITE_KEY)||''; return isSiteId(s)?s:''; }catch(_){ return ''; }
}
function writeSiteId(id){
  if(!isSiteId(id)) return;
  try{ localStorage.setItem(SITE_KEY, id); }catch(_){}
  try{
    const u=new URL(location.href);
    if(u.searchParams.get('site')!==id){
      u.searchParams.set('site', id);
      history.replaceState({}, '', u.pathname + u.search);
    }
  }catch(_){}
}
function siteLink(id){
  try{ return location.origin + '/demo?site=' + id; }catch(_){ return '/demo?site='+id; }
}
function cacheKey(){
  return API.base ? ('feos_offline_'+(API.facility||'none')) : SAVE_KEY;
}
function loadSaved(){
  try{
    const raw=localStorage.getItem(cacheKey());
    if(!raw) return null;
    const s=safeJsonParse(raw);
    if(!s || !Array.isArray(s.buildings) || !Array.isArray(s.levels)
       || !Array.isArray(s.issues) || typeof s.zonesAll!=='object' || s.zonesAll===null){
      try{ localStorage.removeItem(cacheKey()); }catch(_){}
      return null;
    }
    if(!Array.isArray(s.recurring)) s.recurring=[];
    if(!Array.isArray(s.vendors)) s.vendors=[];
    if(!s.levelImages || typeof s.levelImages!=='object') s.levelImages={};
    return s;
  }catch(_){ try{ localStorage.removeItem(cacheKey()); }catch(__){} return null; }
}
function clearSaved(){ try{ localStorage.removeItem(cacheKey()); }catch(_){} }

  const [dataBusy,setDataBusy]=useState(false);
  const [importReport,setImportReport]=useState(null);
  const [budget,setBudget]=useState(()=> saved ? (saved.budget||BUDGET0) : BUDGET0);
  const [showProperty,setShowProperty]=useState(false);

  const [dataset,setDataset]=useState(()=> saved ? saved.dataset : 'demo');
  /* connection: 'local' (no server configured) | 'loading' | 'live' | 'offline' */
  const [conn,setConn]=useState(()=> API.on() ? 'loading' : 'local');

  const [outbox,setOutbox]=useState(()=> outboxRead().length);
  const [notifs,setNotifs]=useState([]);
  const [unread,setUnread]=useState(0);

  const [claimOpen,setClaimOpen]=useState(()=>!!API.enrollToken);
  const seq=useRef(saved ? saved.seq : 1070);
  const zseq=useRef(saved ? saved.zseq : 100);

  const lastSitePut=useRef('');
  const siteToast=useRef(false);
  const rolePreviewSeen=useRef(false);
  const quotaWarned=useRef(false);
  const apiLoaded=useRef(false);

  /* Pull each level's floorplan by hash. Deliberately not awaited by the
     snapshot load: the rooms, pins and exceptions are usable immediately,
     and the plan fades in underneath as it arrives. A slow image should
     never hold up seeing what is broken.

     A failure here is quiet on purpose — the map still works without the
     plan (rooms are traced shapes, not crops of the image), so a dead
     image is a degraded map, not a broken one. */
  async function loadPlans(levelImages){
    if(!levelImages) return;
    for(const [lid, meta] of Object.entries(levelImages)){
      try{
        const dataUrl=await API.floorplan(meta.sha256);
        setLevelImages(p=>({...p, [lid]:dataUrl}));
      }catch(_){ /* keep whatever is cached locally */ }
    }
  }

  /* Boot: if a server is configured, its snapshot replaces the seed
     constants entirely. If it can't be reached, we keep whatever is in
     localStorage and mark the session offline rather than showing an
     empty map — a tech who opens the app in a dead spot should still
     see the facility as of the last sync. */
  useEffect(()=>{
    if(!API.on() || apiLoaded.current) return;
    apiLoaded.current=true;
    let cancelled=false;
    (async()=>{
      try{
        let fid=API.facility;
        const snap=await API.call('GET', `/facilities/${fid}/snapshot`);
        if(cancelled) return;
        const view=projectForRole(snap, authRole()) || {};
        setBuildings(view.buildings||snap.buildings);
        setLevels(view.levels||snap.levels);
        setZonesAll(view.zonesAll||snap.zonesAll);
        if(canSeeBudget(authRole()) && Array.isArray(snap.budget)) setBudget(snap.budget);
        else setBudget([]);
        setIssues((view.issues||snap.issues||[]).map(i=>({
          ...i,
          /* Fields the demo authors by hand and the server has no
             structured equivalent for. Empty, not invented. */
          chain:[], domino:[], hash:i.events&&i.events.length?('Ledger seq '+i.events.length):'',
          photoCap:'', control:i.control||null, controlExp:i.controlExp||null,
          verify:i.verify||{state:'none',text:''},
          hyps:i.hyps||[], events:i.events||[],
        })));
        if(snap.levels.length) setLevelId(l=>snap.levels.some(x=>x.id===l)?l:snap.levels[0].id);
        setConn('live');
        loadPlans(snap.levelImages);
        const r=await outboxFlush();
        setOutbox(r.left);
        if(r.sent) setConnNote(`Synced ${r.sent} queued ${r.sent===1?'report':'reports'}.`);
        if(r.failed) setConnNote(`${r.failed} queued ${r.failed===1?'report was':'reports were'} refused by the server and dropped.`);

  /* Poll the inbox. Polling rather than a socket because this has to
     survive a phone that sleeps, a tab that gets backgrounded, and
     warehouse wifi that drops — a reconnecting socket is more machinery
     for the same result at this scale. Push, once configured, is what
     makes an urgent one arrive without the app being open at all. */
  useEffect(()=>{
    if(!API.on()) return;
    let stop=false;
    const tick=async()=>{
      try{
        const r=await API.notifications();
        if(stop) return;
        setNotifs(r.notifications||[]);
        setUnread(r.unread||0);
      }catch(_){ /* offline: the badge just stops moving */ }
    };
    tick();
    const t=setInterval(tick, 45000);
    const onFocus=()=>tick();
    window.addEventListener('focus', onFocus);
    return ()=>{stop=true; clearInterval(t); window.removeEventListener('focus', onFocus);};
  },[]);

  function bumpSpent(category, amount){
    if(!category || !(Number(amount)>0)) return;
    const amt=Number(amount);
    const period=budgetPeriod();
    setBudget(prev=>{
      const next=prev.map(b=>({...b}));
      let at=next.findIndex(b=>!b.archived && b.category===category && String(b.period).includes(String(new Date().getFullYear())));
      if(at<0) at=next.findIndex(b=>!b.archived && b.category===category);
      if(at<0){
        next.push({category, period, budgeted:0, spent:amt, notes:'', archived:false});
        return next;
      }
      next[at]={...next[at], spent:(Number(next[at].spent)||0)+amt};
      return next;
    });
  }
  function adjustStock(id, field, delta){
    const it=inventory.find(x=>x.id===id);
    setInventory(prev=>prev.map(x=>{
      if(x.id!==id || x.archived) return x;
      const cur=Number(x[field])||0;
      return {...x, [field]:Math.max(0, cur+delta)};
    }));
    if(it && field==='onHand' && delta>0 && it.unitCost>0){
      bumpSpent(it.cat, it.unitCost*delta);
    }
  }
  function addStock(row){
    const name=String(row.name||'').trim();
    if(!name){ say('Name the item.'); return; }
    if(!(Number(row.unitCost)>0)){ say('A unit cost is required — entered once, used every time this item is pulled.'); return; }
    let dup=false;
    setInventory(prev=>{
      if(prev.some(it=>!it.archived && it.name.toLowerCase()===name.toLowerCase())){ dup=true; return prev; }
      return [...prev, {id:'inv'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
        name, cat:row.cat||'General Repair', unit:row.unit||'each',
        onHand:Math.max(0, Number(row.onHand)||0), par:Math.max(0, Number(row.par)||0),
        unitCost:Number(row.unitCost), lvl:row.lvl||null, zid:row.zid||null, archived:false}];
    });
    if(dup) say(name+' is already on the shelf. Change the count — do not add it twice.');
    else say(name+' added. '+money(row.unitCost)+' / '+(row.unit||'each')+' — that price is used when you pull it on a job.');
  }
  function archiveStock(id){

  function rememberVendorSpend(name, amount, description, invoice){
    if(!name || !(Number(amount)>0)) return;
    const today=new Date().toISOString().slice(0,10);
    const amt=Number(amount);
    setVendors(prev=>{
      const next=prev.map(v=>({...v, history:[...(v.history||[])]}));
      let at=next.findIndex(v=>v.name.toLowerCase()===String(name).trim().toLowerCase());
      if(at<0){ next.push({id:'V'+(next.length+1), name, trade:'—', contact:'—', notes:[], history:[]}); at=next.length-1; }
      const dupe=next[at].history.some(h=>h.amount===amt && h.description===description);
      if(!dupe) next[at].history.push({date:today, description:description||'Job cost', amount:amt, invoice:invoice||''});
      return next;
    });
  }

  function finishImport(parsed){
      const restored=restoreFacility(parsed, {
        buildings, levels, zonesAll, issues, recurring,
        bseq:bseq.current, lseq:lseq.current, zseq:zseq.current, seq:seq.current,
      });
      const rc=restored.counts;
      if(rc.buildings||rc.levels||rc.rooms){
        setBuildings(restored.buildings);

        setZonesAll(restored.zonesAll);
        bseq.current=restored.bseq; lseq.current=restored.lseq; zseq.current=restored.zseq;

        if(first) setLevelId(first.id);
        setShowProperty(false); setEditing(false); setDataset(d=>d==='blank'&&restored.buildings.length?'demo':d);
      }
      if(rc.issues){ setIssues(restored.issues); seq.current=restored.seq; }
      if(rc.checks) setRecurring(restored.recurring);
      const budgetLines=[];
      parsed.budget.forEach(r=>{
        const cat=String(cell(r,'Category','Trade','Account','GL','Cost code','Department')||'').trim();
        const per=String(cell(r,'Period','Year','FY','Fiscal year')||'').trim() || String(new Date().getFullYear());
        if(!cat) return;
        if(!cell(r,'Budgeted','Budget','Budget amount','Approved','Approved budget','Spent','Actual','YTD') && !cell(r,'Remaining')) return;
        budgetLines.push({category:cat, period:per,
          budgeted:Number(cell(r,'Budgeted','Budget','Budget amount','Approved','Approved budget'))||0,
          spent:Number(cell(r,'Spent','Actual','YTD','Expended','Spend'))||0});
      });
      const vendorAdds=[];
      parsed.vendors.forEach(r=>{
        const nm=String(cell(r,'Vendor','Vendor name','Company','Contractor','Contractor name','Supplier','Business','Name')||'').trim(); if(!nm) return;
        vendorAdds.push({name:nm,
          trade:String(cell(r,'Trade','Category','Specialty','Type')||'—').trim()||'—',
          contact:String(cell(r,'Contact','Phone','Email','Phone number','Rep')||'—').trim()||'—'});
      });
      const histAdds=[];
      parsed.history.forEach(r=>{
        const nm=String(cell(r,'Vendor','Vendor name','Company','Contractor','Supplier')||'').trim(); if(!nm) return;
        const date=String(cell(r,'Date')||'').trim();
        const description=String(cell(r,'Description','Job','Notes')||'').trim();
        if(!date && !description) return;
        histAdds.push({name:nm, date, description,
          amount:Number(cell(r,'Amount','Cost','Total'))||0, invoice:String(cell(r,'Invoice','Invoice #')||'')});
      });
      const stockAdds=[];
      parsed.inventory.forEach(r=>{
        const name=String(cell(r,'Item','Item name','Part','Part name','Part number','SKU','Product','Material','Description','Name')||'').trim(); if(!name) return;
        stockAdds.push({
          name,
          cat:String(cell(r,'Category','Trade')||'General Repair').trim()||'General Repair',
          unit:String(cell(r,'Unit','UOM')||'each').trim()||'each',
          onHand:Number(cell(r,'On hand','On Hand','Qty','Quantity','QOH','Stock'))||0,
          par:Number(cell(r,'Par','Min','Reorder','Reorder point'))||0,
          unitCost:Number(cell(r,'Unit cost','Unit Cost','Cost','Price','Unit price'))||0,
          bldg:String(cell(r,'Building')||'').trim(),
          level:String(cell(r,'Level')||'').trim(),
          room:String(cell(r,'Stored in','Room','Location')||'').trim(),
        });
      });

      if(budgetLines.length){
        setBudget(prev=>{
          const next=[...prev];
          budgetLines.forEach(line=>{
            const at=next.findIndex(b=>b.category===line.category&&String(b.period)===line.period);
            if(at>=0) next[at]=line; else next.push(line);
          });
          return next;
        });
      }

      if(vendorAdds.length || histAdds.length){
        setVendors(prev=>{
          const next=prev.map(v=>({...v, history:[...(v.history||[])]}));
          const find=name=>next.findIndex(v=>v.name.toLowerCase()===name.toLowerCase());
          vendorAdds.forEach(v=>{
            if(find(v.name)<0) next.push({id:'V'+(next.length+1), name:v.name, trade:v.trade, contact:v.contact, notes:[], history:[]});
          });
          histAdds.forEach(h=>{
            let at=find(h.name);
            if(at<0){ next.push({id:'V'+(next.length+1), name:h.name, trade:'—', contact:'—', notes:[], history:[]}); at=next.length-1; }
            const dupe=next[at].history.some(x=>x.date===h.date&&x.description===h.description&&x.amount===h.amount);
            if(!dupe) next[at].history.push({date:h.date, description:h.description, amount:h.amount, invoice:h.invoice});
          });
          return next;

      if(stockAdds.length){
        setInventory(prev=>{
          const next=[...prev];
          const find=name=>next.findIndex(it=>it.name.toLowerCase()===name.toLowerCase());
          const placeOf=(bldg,level,room)=>{
            const b=buildings.find(x=>x.name.toLowerCase()===String(bldg||'').toLowerCase());
            const l=levels.find(x=>x.name.toLowerCase()===String(level||'').toLowerCase() && (!b || x.b===b.id));
