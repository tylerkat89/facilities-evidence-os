<html lang="en">
<head>

<title>Facilities Evidence OS — Northgate Property</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" integrity="sha384-1qlE7MZPM2pHD/pBZCU/yB8UCP52RYL8bge/qNdfNBCWToySp8/M+JL2waXU4hjJ" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script src="https://grok.com/grok-app-builder/extensions.js" async></script>
<style>
:root{
  --cream:#FFFBF5; --paper:#FFF6EA;
  --clay:#E8A87C; --clay-deep:#C87A48;
  --sage:#8AA899; --sage-deep:#5E7A6A;
  --slate:#2D3748; --slate-soft:#66718A;
  --zone:#E8F0FE; --zone-line:#BCCFF0;
  --hair:rgba(45,55,72,.10);
  --p0:#E0532E; --p1:#E4863C; --p2:#E5B248; --p3:#8AA899; --p4:#AAB6C6;
  --shadow-sm:0 1px 2px rgba(45,55,72,.05), 0 4px 14px rgba(45,55,72,.06);
  --shadow-md:0 2px 6px rgba(45,55,72,.06), 0 14px 34px rgba(45,55,72,.10);
  --r:18px; --r-lg:26px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body,#root{height:100%}
body{margin:0; background:var(--cream); color:var(--slate);
  font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:15px; line-height:1.5; overscroll-behavior:none}
h1,h2,h3{font-family:'Sora',ui-sans-serif,system-ui,sans-serif; letter-spacing:-.02em; margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font:inherit; color:inherit; border:none; background:none; cursor:pointer}
:focus-visible{outline:2.5px solid var(--clay-deep); outline-offset:2px; border-radius:8px}

.app{display:flex; flex-direction:column; height:100%; height:100dvh; overflow:hidden}
.topbar{display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--hair); position:relative;
  background:rgba(255,251,245,.94); backdrop-filter:blur(10px); z-index:60; flex:0 0 auto}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.brand-mark{width:34px;height:34px;border-radius:11px;flex:0 0 auto;background:linear-gradient(150deg,var(--clay),#F0C39F);
  display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -2px 4px rgba(200,122,72,.25)}
.brand-name{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--slate-soft);white-space:nowrap}
.searchbtn{width:36px; height:36px; border-radius:999px; display:grid; place-items:center; font-size:16px;
  background:#fff; border:1px solid var(--hair); flex:0 0 auto; transition:.15s}
.searchbtn:hover{background:#FDF3E9; border-color:var(--clay)}
.rolebtn{padding:7px 14px; border-radius:999px; font-size:12.6px; font-weight:600; background:#fff;
  border:1.5px solid var(--clay); color:var(--clay-deep); white-space:nowrap; flex:0 0 auto; transition:.15s}
.rolebtn:hover{background:#FDF3E9}
.lenses{display:flex; gap:7px; margin-left:auto; overflow-x:auto; scrollbar-width:none; padding:2px}
.lens-backdrop{position:fixed; inset:0; z-index:39; background:transparent}
.lenspanel{position:absolute; top:calc(100% + 6px); right:18px; width:380px; max-width:calc(100vw - 36px);
  background:#fff; border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--shadow-md);
  z-index:40; max-height:min(56vh,440px); overflow-y:auto; padding:12px; animation:pnl .18s ease both}
@keyframes pnl{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.lenspanel-h{font-size:12.5px; font-weight:600; font-family:'Sora'; margin-bottom:9px; padding-bottom:9px; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; align-items:center}
.lensclose{width:24px; height:24px; border-radius:8px; display:grid; place-items:center; color:var(--slate-soft); font-size:16px; flex:0 0 auto}
.lensclose:hover{background:#F3EBE1}
.lenses::-webkit-scrollbar{display:none}
.lens{padding:6.5px 13px; border-radius:999px; font-size:12.8px; font-weight:500; white-space:nowrap;
  background:#fff; border:1px solid var(--hair); color:var(--slate-soft); transition:.16s}
.lens:hover{border-color:var(--clay); color:var(--slate)}
.lens[aria-pressed="true"]{background:var(--slate); color:#FFF6EA; border-color:var(--slate)}
.lens .cnt{opacity:.55; margin-left:5px; font-size:11.5px}
.body{display:flex; flex:1 1 auto; min-height:0; position:relative}

/* rail */
.rail{width:226px; flex:0 0 auto; padding:15px 12px; overflow-y:auto; border-right:1px solid var(--hair); background:#FFFDFA}
.bgroup{margin-bottom:12px}
.bhead{display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--slate-soft); padding:5px 9px}
.lvl{width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; margin-bottom:3px;
  border-radius:14px; text-align:left; transition:.15s}
.lvl:hover{background:#FFF4E8}
.lvl[aria-current="true"]{background:var(--zone); box-shadow:inset 0 0 0 1.5px var(--zone-line)}
.lvl-emo{font-size:16px; width:22px; text-align:center; flex:0 0 auto}
.lvl-name{font-size:13.5px; font-weight:500; line-height:1.25; display:block}
.lvl-meta{font-size:11px; color:var(--slate-soft)}
.lvl-dots{margin-left:auto; display:flex; gap:3px; flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:99px}
.rail-foot{margin-top:10px; padding:12px 8px 0; border-top:1px solid var(--hair); display:grid; gap:7px}
.rail-btn{display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:14px; background:#fff;
  border:1px solid var(--hair); font-size:12.8px; font-weight:500; box-shadow:var(--shadow-sm); text-align:left}
.rail-btn[aria-pressed="true"]{background:var(--slate); color:#FFF6EA; border-color:var(--slate)}
.rail-note{font-size:11px; color:var(--slate-soft); padding:9px 8px 0; line-height:1.45}
.blank-rail{padding:22px 12px; text-align:center}
.blank-rail-icon{font-size:32px; margin-bottom:8px}
.blank-rail-h{font-size:14.5px; font-weight:600; font-family:'Sora'; margin-bottom:6px}
.blank-rail p{font-size:12px; color:var(--slate-soft); line-height:1.5; margin:0 0 14px}
.blankstage{max-width:360px; margin:0 auto; padding:60px 24px; text-align:center}
.railmobile{display:none}
.bellbtn{position:relative}
.bell-dot{position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px;
  border-radius:999px; background:var(--p0,#C0392B); color:#fff; font-size:10.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; line-height:1}
.inbox-panel{position:fixed; left:12px; right:12px; top:auto; bottom:12px; max-height:min(70vh,540px)}
@media (min-width:700px){
  .inbox-panel{left:auto; right:18px; width:400px; top:76px; bottom:auto; display:block}
}
.inbox-empty{padding:18px 8px; color:var(--slate-soft); font-size:13px; line-height:1.5}
.notif{width:100%; display:flex; gap:11px; align-items:flex-start; text-align:left;
  padding:11px 10px; border-radius:12px; background:transparent; border:1px solid transparent}
.notif:hover{background:var(--paper)}
.notif-unread{background:var(--paper); border-color:var(--hair)}
.notif-ic{flex:0 0 auto; font-size:15px; line-height:1.3}
.notif-t{display:block; font-size:13.2px; font-weight:500; line-height:1.35}
.notif-unread .notif-t{font-weight:600}
.notif-b{display:block; font-size:11.8px; color:var(--slate-soft); margin-top:2px; line-height:1.4}
.connbar{position:fixed; left:12px; right:12px; bottom:12px; z-index:80; display:flex; align-items:center; gap:10px;
  padding:11px 14px; border-radius:14px; background:var(--slate); color:#FFF6EA; font-size:12.6px; line-height:1.4;
  box-shadow:var(--shadow-md)}
.connretry{flex:0 0 auto; padding:5px 12px; border-radius:999px; background:#FFF6EA; color:var(--slate); font-size:12px; font-weight:500}
.blankstage-icon{font-size:38px; margin-bottom:14px}
.blankstage h2{font-size:19px; margin-bottom:8px}
.blankstage p{font-size:13.5px; color:var(--slate-soft); line-height:1.55; margin:0}

/* stage */
.stage{flex:1 1 auto; position:relative; min-width:0; display:flex; flex-direction:column}
.stage-head{display:flex; align-items:center; gap:10px; padding:13px 20px 8px; flex-wrap:wrap}
.stage-title{font-size:18.5px; font-weight:600; font-family:'Sora'}
.stage-sub{font-size:12.3px; color:var(--slate-soft)}
.editbtn{margin-left:auto; padding:8px 15px; border-radius:999px; font-size:12.8px; font-weight:600;
  background:#fff; border:1px solid var(--hair); box-shadow:var(--shadow-sm)}
.editbtn[aria-pressed="true"]{background:var(--clay-deep); color:#FFF7EC; border-color:var(--clay-deep)}

/* editor bar */
.ebar{margin:0 20px 10px; background:#FDF3E9; border:1.5px solid var(--clay); border-radius:var(--r); padding:12px 14px}
.ebar-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px}
.ebar-t{font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--clay-deep)}
.erow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.erow + .erow{margin-top:9px; padding-top:9px; border-top:1px dashed rgba(200,122,72,.32)}
.efield{display:flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--hair); border-radius:12px; padding:5px 10px}
.efield label{font-size:10.5px; color:var(--slate-soft); white-space:nowrap; font-weight:500}
.efield input{border:none; outline:none; font:inherit; font-size:13.5px; background:transparent; width:130px; min-width:70px; color:var(--slate)}
.ebtn{padding:8px 13px; border-radius:12px; font-size:12.6px; font-weight:500; background:#fff; border:1px solid var(--hair); white-space:nowrap}
.ebtn.solid{background:var(--clay-deep); color:#FFF7EC; border-color:var(--clay-deep); font-weight:600}
.ebtn.danger{background:#FCEFE9; color:#B0472A; border-color:#F0C9BB}
.kinds{display:flex; gap:5px; flex-wrap:wrap}
.kind{padding:6px 11px; border-radius:999px; font-size:12px; background:#fff; border:1px solid var(--hair)}
.kind[aria-pressed="true"]{background:var(--sage); color:#fff; border-color:var(--sage)}
.esize{font-size:11.5px; color:var(--slate-soft); font-family:'IBM Plex Mono'}
.ehint{font-size:11.5px; color:#9A6437; margin-top:9px; line-height:1.45}

/* map */
.mapwrap{flex:1 1 auto; position:relative; margin:0 20px 20px; border-radius:var(--r-lg);
  background:var(--paper); box-shadow:var(--shadow-md); overflow:hidden; border:1px solid rgba(200,122,72,.14)}
.mapwrap.editing{touch-action:none}
.mapwrap.adding{cursor:crosshair}
.mapwrap.adding::after{content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 0 3px var(--clay); border-radius:var(--r-lg); animation:breathe 2s ease-in-out infinite}
.mapwrap.editing{border-color:var(--clay); box-shadow:var(--shadow-md), inset 0 0 0 2px rgba(232,168,124,.5)}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
svg.map{width:100%; height:100%; display:block; touch-action:none}
.zone-fill{stroke:var(--zone-line); stroke-width:2; transition:fill .2s}
.zone-g{cursor:pointer}
@media (hover:hover) and (pointer:fine){
  .zone-g:hover .zone-fill{filter:brightness(.975)}
}
.zone-lbl{font-family:'Outfit'; font-size:14px; fill:#4E6183; font-weight:500; pointer-events:none}
.zone-code{font-family:'IBM Plex Mono'; font-size:10px; fill:#93A4C0; pointer-events:none}
.wall{fill:none; stroke:#E4D6C4; stroke-width:9; stroke-linecap:round; stroke-linejoin:round}
.edit-outline{fill:none; stroke:var(--clay-deep); stroke-width:2.5; stroke-dasharray:7 5; pointer-events:none}
.handle{fill:#fff; stroke:var(--clay-deep); stroke-width:3; cursor:nwse-resize}
.zone-drag{cursor:grab}
.zone-drag:active{cursor:grabbing}
@keyframes pulse{0%{r:22; opacity:.5} 70%{r:38; opacity:0} 100%{r:38; opacity:0}}
.halo-pulse{animation:pulse 1.9s ease-out infinite}
@keyframes drop{from{transform:translateY(-14px) scale(.7); opacity:0} to{transform:none; opacity:1}}
.pin-in{animation:drop .35s cubic-bezier(.2,1.3,.4,1) both; transform-origin:center}
.pin{cursor:pointer}
.pin-hit{fill:transparent}

.attn{position:absolute; right:14px; bottom:14px; z-index:13; width:min(330px,calc(100% - 28px));
  background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border:1px solid var(--hair);
  border-radius:var(--r); box-shadow:var(--shadow-md); overflow:hidden}
.attn-h{display:flex; align-items:center; gap:9px; padding:11px 13px; cursor:pointer; user-select:none}
.attn-h b{font-size:13.5px; font-family:'Sora'; font-weight:600}
.attn-count{font-size:11px; font-weight:700; color:#fff; background:var(--p0); border-radius:999px; padding:2px 8px}
.attn-count.calm{background:var(--sage)}
.attn-chev{margin-left:auto; color:var(--slate-soft); font-size:12px}
.attn-body{max-height:230px; overflow-y:auto; border-top:1px solid var(--hair)}
.attn-row{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; padding:10px 13px; border-bottom:1px dashed var(--hair)}
.attn-row:last-child{border-bottom:none}
.attn-row:hover{background:#FFF7EC}
.attn-dot{width:10px; height:10px; border-radius:999px; margin-top:4px; flex:0 0 auto}
.attn-t{font-size:13px; font-weight:500; line-height:1.35}
.attn-w{font-size:11px; color:var(--slate-soft); line-height:1.4; margin-top:2px}
.attn-tag{font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.attn-calm{padding:13px; font-size:12.5px; color:var(--sage-deep); line-height:1.5}
.attn.raised{bottom:88px}
@media (max-width:699px){
  .attn{position:static; width:auto; margin:0 11px 11px; box-shadow:var(--shadow-sm)}
  .attn-body{max-height:none}
}
.legend{
  margin:0 20px 10px; align-self:flex-start; max-width:min(720px, calc(100% - 40px));
  background:#fff; border:1px solid var(--hair); border-radius:14px;
  padding:8px 14px; box-shadow:var(--shadow-sm); font-size:11.4px;
  display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px}
.legend b{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--slate-soft); font-weight:600; margin-right:2px}
.legend-row{display:flex; align-items:center; gap:6px; margin:0}
.fab{position:absolute; right:18px; bottom:18px; z-index:14; width:58px; height:58px; border-radius:999px;
  display:grid; place-items:center; background:var(--clay-deep); color:#FFF7EC;
  box-shadow:0 8px 24px rgba(200,122,72,.42); transition:background .18s, transform .18s, box-shadow .18s}
.fab:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(200,122,72,.5)}
.fab[aria-pressed="true"]{background:var(--slate); box-shadow:0 8px 24px rgba(45,55,72,.35)}
.fab svg{transition:transform .28s cubic-bezier(.2,1.2,.4,1)}
.fab[aria-pressed="true"] svg{transform:rotate(45deg)}
.zoomer{position:absolute; right:14px; top:14px; z-index:12; display:flex; flex-direction:column; gap:5px}
.zoomer button{width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.95);
  backdrop-filter:blur(6px); border:1px solid var(--hair); box-shadow:var(--shadow-sm);
  font-size:19px; font-weight:600; color:var(--slate); display:grid; place-items:center}
.zoomer button:hover{background:#FFF4E8; border-color:var(--clay)}
.zoomer .zfit{font-size:15px}
.zoomlvl{position:absolute; right:58px; top:20px; z-index:12; font-size:11px; font-weight:600;
  background:var(--slate); color:#FFF7EC; padding:3px 8px; border-radius:999px}
@media (max-width:699px){
  .zoomer{right:10px; top:10px}
  .zoomer button{width:34px; height:34px; font-size:17px}
  .zoomlvl{right:50px; top:15px}
}
.tip{position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:14; white-space:nowrap;
  background:var(--slate); color:#FFF7EC; padding:8px 15px; border-radius:999px; font-size:12.8px; font-weight:500;
  box-shadow:0 6px 18px rgba(45,55,72,.28); animation:up .25s cubic-bezier(.2,1.2,.4,1) both; pointer-events:none}

/* drawer */
.drawer{width:404px; flex:0 0 auto; border-left:1px solid var(--hair); background:#FFFDFA;
  display:flex; flex-direction:column; min-height:0; z-index:20; animation:slidein .28s cubic-bezier(.2,.9,.3,1) both}
@keyframes slidein{from{transform:translateX(30px); opacity:0} to{transform:none; opacity:1}}
.dr-head{padding:16px 18px 12px; border-bottom:1px solid var(--hair)}
.dr-top{display:flex; align-items:center; gap:9px; margin-bottom:9px; flex-wrap:wrap}
.iss-id{font-size:11.5px; font-weight:500; color:var(--clay-deep); background:#FBEEE2; padding:3.5px 9px; border-radius:999px}
.x{margin-left:auto; width:31px; height:31px; border-radius:11px; display:grid; place-items:center; color:var(--slate-soft); font-size:18px}
.x:hover{background:#F3EBE1}
.dr-title{font-size:18px; font-weight:600; line-height:1.3}
.where{font-size:12px; color:var(--slate-soft); margin-top:4px}
.statusline{margin-top:10px; padding:10px 13px; border-radius:14px; background:var(--zone); font-size:13.2px; font-weight:500; color:#3C5480; display:flex; gap:9px; align-items:flex-start}
.codes{margin-top:7px; font-size:10.5px; color:var(--slate-soft); display:flex; gap:6px; flex-wrap:wrap}
.code{background:#F4EEE6; padding:2.5px 7px; border-radius:6px}
.tabs{display:flex; gap:4px; padding:9px 12px; border-bottom:1px solid var(--hair); overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px; border-radius:11px; font-size:13px; font-weight:500; color:var(--slate-soft); white-space:nowrap}
.tab[aria-selected="true"]{background:#F3EBE1; color:var(--slate)}
.dr-body{flex:1 1 auto; overflow-y:auto; padding:16px 18px 40px}
.qcard{margin-bottom:14px; background:#fff; border:1px solid var(--hair); border-radius:var(--r); padding:14px 15px; box-shadow:var(--shadow-sm)}
.q{font-size:14.5px; font-weight:600; font-family:'Sora'; margin-bottom:3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.q small{font-family:'Outfit'; font-weight:400; font-size:11.5px; color:var(--slate-soft)}
.qtext{font-size:14px; line-height:1.55; margin-top:7px}
.byline{font-size:11.5px; color:var(--slate-soft); margin-top:9px; font-family:'IBM Plex Mono'}
.hashline{font-size:10px; color:#9AA5B8; margin-top:4px; font-family:'IBM Plex Mono'; word-break:break-all}
.hyp{border-left:3px solid var(--sage); padding:8px 0 8px 11px; margin-top:11px}
.hyp.dead{border-color:#D9D2C8; opacity:.72}
.hyp-h{font-size:13.5px; font-weight:500; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.hyp.dead .hyp-h{text-decoration:line-through; text-decoration-color:#C3BAAE}
.conf{font-size:10.5px; font-weight:600; padding:2.5px 8px; border-radius:999px; background:#E7EFE9; color:var(--sage-deep)}
.hyp p{margin:5px 0 0; font-size:12.6px; color:var(--slate-soft); line-height:1.5}
.chain{position:relative; padding-left:30px}
.chain::before{content:''; position:absolute; left:11px; top:12px; bottom:12px; width:2px; background:#E8DFD4; border-radius:2px}
.node{position:relative; margin-bottom:16px}
.node .bead{position:absolute; left:-30px; top:1px; width:24px; height:24px; border-radius:999px; background:#fff;
  border:2px solid var(--sage); display:grid; place-items:center; font-size:11px; z-index:2}
.node.stall .bead{border-color:var(--p0); background:#FCEDE8}
.node.stall::after{content:''; position:absolute; left:-19.5px; top:26px; bottom:-16px; width:3px; border-radius:3px;
  background:repeating-linear-gradient(180deg,var(--p0) 0 5px,transparent 5px 10px); opacity:.75}
.node-h{font-size:13.6px; font-weight:500}
.node-r{font-size:11.5px; color:var(--slate-soft)}
.node-t{font-size:11px; color:var(--slate-soft); font-family:'IBM Plex Mono'; margin-top:3px}
.node-d{font-size:12.4px; color:var(--slate-soft); line-height:1.5; margin-top:6px}
.stallnote{margin-top:7px; font-size:12.2px; color:#A63D1E; background:#FCEFE9; border-radius:11px; padding:8px 11px; line-height:1.45}
.locknote{margin-top:12px; font-size:12px; color:var(--sage-deep); background:#EDF3EF; border-radius:12px; padding:10px 12px; display:flex; gap:9px; line-height:1.45}
.vend{background:#fff; border:1px solid var(--hair); border-radius:var(--r); padding:15px; box-shadow:var(--shadow-sm)}
.waiting{margin-top:12px; border-radius:15px; padding:13px 14px; background:#FDF4E3; border:1.5px dashed #E5B248; display:flex; gap:11px; align-items:flex-start}
.waiting b{display:block; font-size:13.5px; margin-bottom:2px; font-family:'Sora'}
.waiting p{margin:0; font-size:12.3px; color:#8A6B2E; line-height:1.45}
.claimrow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
.claimbox{flex:1 1 140px; border-radius:14px; padding:11px 12px; font-size:12.5px; line-height:1.45}
.claimbox.said{background:#F4EEE6}
.claimbox.saw{background:#EDF3EF}
.claimbox b{display:block; font-size:10px; letter-spacing:.09em; text-transform:uppercase; margin-bottom:5px; opacity:.65}
.dstep{display:flex; gap:12px; align-items:flex-start}
.dstep .dot2{width:13px; height:13px; border-radius:999px; margin-top:5px; flex:0 0 auto; background:var(--sage); box-shadow:0 0 0 4px #EDF3EF}
.dstep.bad .dot2{background:var(--p0); box-shadow:0 0 0 4px #FCEFE9}
.dstep.risk .dot2{background:#fff; border:2.5px dashed var(--p0); box-shadow:none}
.dlink{width:2px; height:20px; background:#E0D7CB; margin-left:5.5px; border-radius:2px}
.dstep .dh{font-size:13.6px; font-weight:500}
.dstep .dd{font-size:11.8px; color:var(--slate-soft); font-family:'IBM Plex Mono'}

/* modals */
.scrim{position:fixed; inset:0; background:rgba(45,55,72,.3); z-index:70; animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(452px,92vw);
  background:var(--cream); border-radius:var(--r-lg); box-shadow:0 24px 60px rgba(45,55,72,.3); z-index:71;
  padding:20px; animation:pop .3s cubic-bezier(.2,1.2,.4,1) both; max-height:86dvh; overflow-y:auto}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.94); opacity:0} to{transform:translate(-50%,-50%) scale(1); opacity:1}}
.comp-h{font-size:19px; font-weight:600; font-family:'Sora'}
.comp-sub{font-size:12.5px; color:var(--slate-soft); margin-top:3px}
.lbl{font-size:12px; font-weight:600; margin:15px 0 6px; display:flex; align-items:center; gap:7px}
.lbl .req{color:var(--clay-deep); font-size:10.5px; font-weight:500}
textarea,input.txt{width:100%; border:1.5px solid var(--hair); border-radius:15px; padding:12px 13px; font:inherit; font-size:14.5px; background:#fff; resize:none; color:var(--slate)}
textarea:focus,input.txt:focus{border-color:var(--clay); outline:none}
.hint{font-size:11.5px; color:var(--slate-soft); margin-top:6px; line-height:1.45}
.hint.warn{color:var(--clay-deep)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{padding:7px 12px; border-radius:999px; font-size:12.6px; background:#fff; border:1px solid var(--hair)}
.chip[aria-pressed="true"]{background:var(--sage); color:#fff; border-color:var(--sage)}
.chip.pri[aria-pressed="true"]{background:var(--slate); border-color:var(--slate); color:#FFF6EA}
.dropzone{border:2px dashed var(--clay); border-radius:19px; background:#FDF3E9; padding:16px; display:flex; align-items:center; gap:13px; text-align:left; width:100%}
.dropzone b{font-size:13.5px; display:block}
.dropzone span{font-size:11.5px; color:var(--slate-soft)}
.picker{display:flex; gap:8px; flex-wrap:wrap}
.pickbtn{flex:1 1 140px; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:15px 12px; border-radius:16px; font-size:13.8px; font-weight:600;
  border:2px dashed var(--clay); background:#FDF3E9; color:var(--clay-deep)}
.pickbtn.cam{background:var(--clay-deep); color:#FFF7EC; border:2px solid var(--clay-deep);
  box-shadow:0 4px 14px rgba(200,122,72,.3)}
.pickhint{font-size:11.5px; color:var(--slate-soft); margin-top:7px; line-height:1.45}
.shots{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
.shot-real{position:relative; width:72px; height:72px; border-radius:11px; overflow:hidden;
  box-shadow:var(--shadow-sm); background:#EFE7DD; flex:0 0 auto}
.shot-real img{width:100%; height:100%; object-fit:cover; display:block}
.shot-fallback{width:100%; height:100%; display:grid; place-items:center; font-size:22px}
.shot-x{position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:999px;
  background:rgba(45,55,72,.72); color:#fff; font-size:14px; line-height:1; display:grid; place-items:center}
.shot-hash{position:absolute; left:0; right:0; bottom:0; background:rgba(45,55,72,.72); color:#FFF7EC;
  font-size:8.5px; text-align:center; padding:2px 0; letter-spacing:.02em}
.ev-photos{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.comp-actions{display:flex; gap:10px; margin-top:20px}
.btn{flex:1; padding:14px; border-radius:16px; font-weight:600; font-size:14.5px; text-align:center}
.btn.primary{background:var(--clay-deep); color:#FFF7EC; box-shadow:0 5px 16px rgba(200,122,72,.32)}
.btn.primary:disabled{background:#E0D6CA; color:#9C9186; box-shadow:none; cursor:not-allowed}
.btn.ghost{flex:0 0 auto; padding:14px 20px; background:#fff; border:1px solid var(--hair)}
.sendto{font-size:11.8px; color:var(--sage-deep); background:#EDF3EF; border-radius:12px; padding:10px 12px; margin-top:14px; line-height:1.45}
.zrow{display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:11px 12px; border-radius:14px; background:#fff; border:1px solid var(--hair); margin-top:8px}
.zrow .zt{font-size:13.4px; font-weight:500}
.zrow .zs{font-size:11.5px; color:var(--slate-soft)}
.zempty{font-size:13px; color:var(--slate-soft); background:#EDF3EF; border-radius:14px; padding:13px; margin-top:12px; line-height:1.5}

/* actions + event log */
.packbtn{margin-top:7px; width:100%; padding:11px; border-radius:15px; background:#fff;
  border:1px solid var(--hair); color:var(--slate); font-weight:600; font-size:13.5px;
  display:flex; align-items:center; justify-content:center; gap:8px}
.packbtn:hover{border-color:var(--clay); background:#FFF7EC}
.updatebtn{margin-top:11px; width:100%; padding:13px; border-radius:15px; background:var(--clay-deep); color:#FFF7EC;
  font-weight:600; font-size:14.3px; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 5px 16px rgba(200,122,72,.3)}
.moverow{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:12px 13px;
  border-radius:15px; background:#fff; border:1px solid var(--hair); margin-top:8px; transition:.15s}
.moverow:hover{border-color:var(--clay); background:#FFFAF4}
.moverow .mi{font-size:19px; flex:0 0 auto; line-height:1.25}
.moverow .mt{font-size:13.9px; font-weight:600; font-family:'Sora'}
.moverow .md{font-size:11.8px; color:var(--slate-soft); line-height:1.4; margin-top:2px}
.gate{font-size:12px; color:var(--sage-deep); background:#EDF3EF; border-radius:12px; padding:10px 12px; margin-top:14px; line-height:1.45}
.vbtns{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap}
.vbtns .btn{flex:1 1 140px; padding:12px; font-size:13.5px}

/* stacked */
.stackview{flex:1 1 auto; overflow:auto; padding:26px 20px 50px; background:radial-gradient(ellipse at 50% 40%, #FFF6EA 0%, var(--cream) 62%)}
.stacks{display:flex; gap:44px; justify-content:center; flex-wrap:wrap; align-items:flex-end}
.model{perspective:1400px; padding-top:60px}
.slabs{transform-style:preserve-3d; transform:rotateX(56deg) rotateZ(-40deg); display:flex; flex-direction:column-reverse}
.slab{width:min(268px,58vw); height:min(172px,38vw); border-radius:14px; position:relative; background:rgba(255,255,255,.94);
  border:1.5px solid rgba(45,55,72,.13); box-shadow:0 20px 30px rgba(45,55,72,.13); margin-top:-76px; cursor:pointer;
  transition:transform .3s cubic-bezier(.2,1,.3,1), box-shadow .3s; transform-style:preserve-3d}
.slab:hover{transform:translateZ(24px) scale(1.02)}
.slab.active{box-shadow:0 28px 42px rgba(200,122,72,.28); border-color:var(--clay)}
.slab-lbl{position:absolute; left:-12px; top:-8px; transform:rotateZ(40deg) rotateX(-56deg) translateZ(28px);
  font-size:12px; font-weight:600; white-space:nowrap; background:#fff; padding:5px 10px; border-radius:999px;
  box-shadow:var(--shadow-sm); border:1px solid var(--hair)}
.slab svg{width:100%; height:100%}
.bldg-cap{text-align:center; margin-top:14px; font-size:13.5px; font-weight:600; font-family:'Sora'}
.stack-cap{margin:26px auto 0; text-align:center; font-size:12.8px; color:var(--slate-soft); max-width:430px; line-height:1.55}

/* ---------- directory ---------- */
.dirwrap{position:fixed; inset:0; z-index:65; background:var(--cream); display:flex; flex-direction:column}
.dir-head{padding:14px 18px 0; border-bottom:1px solid var(--hair); flex:0 0 auto}
.dir-top{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.dir-title{font-size:19px; font-weight:600; font-family:'Sora'}
.dir-body{flex:1 1 auto; overflow-y:auto; padding:14px 18px calc(30px + env(safe-area-inset-bottom))}
.dir-search{width:100%; border:1.5px solid var(--hair); border-radius:14px; padding:11px 14px; font:inherit; font-size:14px; background:#fff; margin-bottom:14px; color:var(--slate)}
.dir-search:focus{border-color:var(--clay); outline:none}
.vrow{background:#fff; border:1px solid var(--hair); border-radius:var(--r); padding:14px 15px; margin-bottom:12px; box-shadow:var(--shadow-sm)}
.vrow-h{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.vname{font-size:15px; font-weight:600; font-family:'Sora'}
.vbadge{font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:#FCEDE8; color:var(--p0)}
.vmeta{font-size:12px; color:var(--slate-soft); margin-top:2px; font-family:'IBM Plex Mono'}
.vedit{display:flex; gap:7px; margin-top:7px; flex-wrap:wrap}
.vedit .txt{flex:1 1 130px; padding:7px 10px; font-size:12.3px; border-radius:10px}
.vstats{display:flex; gap:13px; margin-top:9px; font-size:12px; color:var(--slate-soft); flex-wrap:wrap}
.vjobs{margin-top:11px; padding-top:11px; border-top:1px solid var(--hair)}
.vnotes{margin-top:11px; padding-top:11px; border-top:1px dashed var(--hair)}
.vnotes-h{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--slate-soft); margin-bottom:6px}
.vnote{font-size:12.6px; line-height:1.5; padding:7px 0; border-bottom:1px dashed var(--hair)}
.vnote:last-of-type{border-bottom:none}
.vnote-add{margin-top:8px}
.vnote-add textarea{width:100%; border:1.5px solid var(--hair); border-radius:12px; padding:9px 11px; font:inherit; font-size:13px}
.vnote-actions{display:flex; gap:8px; margin-top:7px}
.vnote-actions .ebtn{flex:1; padding:9px; text-align:center}
.room-group-h{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--slate-soft); margin:18px 0 8px}
.room-group-h:first-child{margin-top:0}
.dir-empty{font-size:13px; color:var(--slate-soft); background:#EDF3EF; border-radius:14px; padding:16px; text-align:center; margin-top:10px; line-height:1.5}
.due-chip{font-size:10px; font-weight:600; padding:2.5px 8px; border-radius:999px; margin-left:6px}
.due-chip.overdue{background:#FCEDE8; color:var(--p0)}
.due-chip.today{background:#FDF3E9; color:#B78B2A}

.costline{margin-top:10px; padding:9px 12px; border-radius:12px; background:#F4F1EA;
  font-size:13px; font-weight:600; font-family:'IBM Plex Mono'}
.costline span{font-weight:400; font-family:'Outfit'; font-size:11.8px; color:var(--slate-soft)}
.mywork{max-width:640px; margin:0 auto; padding:16px 16px 40px}
.mw-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px}
.mw-h1{font-size:21px; font-family:'Sora'; font-weight:700}
.mw-sub{font-size:12.5px; color:var(--slate-soft); margin-top:2px}
.mw-report{width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
  padding:16px; border-radius:18px; background:var(--clay-deep); color:#FFF7EC;
  font-size:14.5px; font-weight:600; box-shadow:0 6px 18px rgba(200,122,72,.32); margin-bottom:18px}
.mw-sec{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--slate-soft); margin:20px 0 8px; display:flex; justify-content:space-between}
.mw-owner{font-size:12.5px; font-weight:600; color:var(--clay-deep); margin:12px 0 6px}

.invcard{background:#fff; border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--shadow-sm); overflow:hidden}
.invrow{display:flex; align-items:center; gap:10px; padding:11px 13px; border-bottom:1px dashed var(--hair)}
.invrow:last-child{border-bottom:none}
.invrow.low{background:#FDF9F0}
.invname{font-size:13.6px; font-weight:500; display:block}
.invsub{font-size:11.3px; color:var(--slate-soft)}
.invsub b{color:#A67A22}
.invcount{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto}
.invcount .onhand{font-family:'IBM Plex Mono'; font-size:16px; line-height:1}
.invcount .onhand small{color:var(--slate-soft); font-weight:400; font-size:10.5px; margin-left:4px}
.invrow.low .invcount .onhand{color:#A67A22}
.invacts{display:flex; gap:6px}
.invacts button{height:30px; padding:0 10px; border-radius:9px; border:1.5px solid var(--hair);
  background:#fff; font-size:12px; font-weight:600; color:var(--slate)}
.invacts button.use{background:var(--clay-deep); color:#FFF7EC; border-color:var(--clay-deep)}
.invacts button:disabled{opacity:.4}
.invpar{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--slate-soft)}
.invpar button{width:24px; height:24px; border-radius:7px; border:1px solid var(--hair);
  background:#fff; font-size:14px; line-height:1; color:var(--slate)}
.invadd{background:#fff; border:1px dashed var(--hair); border-radius:var(--r); padding:14px; margin-bottom:14px}
.invadd .lbl{margin-top:10px}
.invx{border:none; background:transparent; color:var(--slate-soft); font-size:16px; padding:4px 6px; flex:0 0 auto}
.invx:hover{color:var(--p0)}

.bud-top{display:flex; gap:10px; margin-bottom:12px}
.bud-top>div{flex:1; background:#fff; border:1px solid var(--hair); border-radius:14px; padding:11px 12px; box-shadow:var(--shadow-sm)}
.bud-k{display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--slate-soft); margin-bottom:3px}
.bud-top b{font-size:16px; font-family:'Sora'}
.bud-gap{background:#FCEFE9; border:1px solid #F0C9BB; border-radius:14px; padding:13px 15px; margin-bottom:14px}
.bud-gap b{font-size:13.5px; color:#A63D1E; font-family:'Sora'}
.bud-gap p{margin:6px 0 0; font-size:12.3px; color:#8A4A32; line-height:1.5}
.bud-row{background:#fff; border:1px solid var(--hair); border-radius:var(--r); padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow-sm)}
.bud-h{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left}
.bud-cat{font-size:14px; font-weight:600; font-family:'Sora'; display:block}
.bud-sub{font-size:11.3px; color:var(--slate-soft)}
.bud-amt{font-size:13.5px; font-weight:600; white-space:nowrap; font-family:'IBM Plex Mono'}
.bud-amt.over{color:var(--p0)}
.bud-amt small{font-weight:400; color:var(--slate-soft); font-size:11.5px}
.bud-bar{position:relative; height:12px; border-radius:999px; background:#F1ECE4; margin-top:10px; overflow:hidden}
.bud-fill{position:absolute; left:0; top:0; height:100%; border-radius:999px}
.bud-fill.logged{background:var(--sage-deep); height:6px; top:3px; opacity:.95}
.bud-legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:7px; font-size:11px; color:var(--slate-soft)}
.bud-legend .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px}
.bud-un{color:#A63D1E; font-weight:600}
.bud-jobs{margin-top:10px; padding-top:10px; border-top:1px dashed var(--hair)}

.dataline{font-size:12.5px; line-height:1.55; color:var(--slate); margin:9px 0 0}
.dataline.sub{font-size:11.5px; color:var(--slate-soft)}
.importreport{margin-top:14px; padding:13px 15px; border-radius:14px; background:#EDF3EF;
  color:var(--sage-deep); font-size:12.8px; line-height:1.55}
.importreport.bad{background:#FCEFE9; color:#A63D1E}
.import-pick{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.import-pick button{min-height:40px; padding:8px 12px; border-radius:12px; border:1px solid var(--hair);
  background:#fff; font-weight:600; font-size:13px; cursor:pointer}

/* ---------- evidence pack ---------- */
.packwrap{position:fixed; inset:0; z-index:80; background:#F4F1EC; overflow-y:auto}
.pack-actions{position:sticky; top:0; z-index:2; display:flex; gap:8px; justify-content:space-between;
  padding:12px 16px; background:rgba(244,241,236,.96); backdrop-filter:blur(8px); border-bottom:1px solid #DCD5CB}
.pack{max-width:760px; margin:18px auto 60px; background:#fff; padding:38px 42px;
  box-shadow:0 2px 18px rgba(0,0,0,.09); color:#1E2430; font-size:13.5px; line-height:1.55}
.pack-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  border-bottom:2px solid #1E2430; padding-bottom:14px; margin-bottom:20px}
.pack h1{font-size:23px; font-family:'Sora'; margin:0}
.pack-sub{font-size:13px; color:#555; margin-top:3px}
.pack-meta{font-size:10.5px; color:#666; text-align:right; line-height:1.5}
.pack h2{font-size:18px; font-family:'Sora'; margin:0 0 14px}
.pack h3{font-size:13px; font-family:'Sora'; text-transform:uppercase; letter-spacing:.07em;
  margin:26px 0 9px; padding-bottom:5px; border-bottom:1px solid #DDD8D0; color:#3A4354}
.pack-t{width:100%; border-collapse:collapse; margin:6px 0}
.pack-t th{text-align:left; font-weight:600; font-size:11.5px; color:#5A6478; width:130px;
  padding:5px 10px 5px 0; vertical-align:top; white-space:nowrap}
.pack-t td{padding:5px 0; vertical-align:top; border-bottom:1px solid #EFEBE5}
.pack-obs{background:#F7F5F1; border-left:3px solid #1E2430; padding:11px 14px; margin:8px 0}
.pack-ev td{padding:9px 0}
.pack-thumb{width:96px; padding-right:12px !important}
.pack-thumb img{width:88px; height:88px; object-fit:cover; border:1px solid #DDD}
.pack-hyp{margin:9px 0; padding-left:11px; border-left:3px solid #8AA899}
.pack-hyp.dead{border-color:#C9C3BA; color:#777}
.pack-hyp.dead b{text-decoration:line-through}
.pack-conf{font-size:10.5px; background:#EDF1EE; padding:1px 7px; border-radius:3px; color:#4A6355}
.pack-none{color:#777; font-style:italic}
.pack-note{background:#FDF7EB; border-left:3px solid #D8A93C; padding:10px 13px}

/* ============ EXCEPTION ENGINE ============ */
/* One ranked rule the whole app derives from: what the app opens on, what the
   property map highlights, and what the attention sheet lists. The opening
   state is computed from the records — it can never be hand-authored. */
const EXCEPTIONS = [
  {id:'p0open',  rank:100, label:'P0 unassigned',      short:'P0 unassigned',
   test:i=>i.pri==='P0' && ['UNASSIGNED','ACTION PENDING'].includes(i.work)},
  {id:'escal',   rank:90,  label:'Escalated by hand',  short:'Escalated',
   test:i=>!!i.escalated},
  {id:'p1open',  rank:80,  label:'P1 unassigned',      short:'P1 unassigned',
   test:i=>i.pri==='P1' && ['UNASSIGNED','ACTION PENDING'].includes(i.work)},
  {id:'proof',   rank:70,  label:'Vendor proof late',  short:'Proof late',
   test:i=>!!i.vendor && i.vendor.photos===0 && i.vendor.claimed && i.vendor.claimed!=='—'},
  {id:'overdue', rank:60,  label:'Past its due date',  short:'Overdue',
   test:i=>{ const t=new Date().toISOString().slice(0,10);
             return !!(i.due && i.due<t && i.work!=='WORK COMPLETE'); }},
  {id:'review',  rank:50,  label:'Waiting on verify',  short:'Verify due',
   test:i=>i.cond==='RESOLVED-VERIFY'},
  {id:'stale',   rank:45,  label:'Containment expired',short:'Control expired',
   test:i=>{ const t=new Date().toISOString().slice(0,10);
             return !!(i.controlExp && i.controlExp<t && i.cond==='CONTAINED'); }},
  {id:'blocked', rank:40,  label:'Blocked',            short:'Blocked',
   test:i=>i.work==='BLOCKED'},
];

const PRI_RANK = {P0:0,P1:1,P2:2,P3:3,P4:4};

/* Highest-ranked exception on an issue, or null if it's behaving. */
function exceptionOf(i){
  if(i.cond==='CLOSED') return null;
  for(const e of EXCEPTIONS){ if(e.test(i)) return e; }
  return null;
}
/* Every unresolved exception, worst first. */
function rankedExceptions(issues){
  return issues.map(i=>({iss:i, exc:exceptionOf(i)}))
    .filter(x=>x.exc)
    .sort((a,b)=> b.exc.rank-a.exc.rank || PRI_RANK[a.iss.pri]-PRI_RANK[b.iss.pri]);
}

/* Worst exception per building, propagated up from its rooms. This is what
   lets the property map say "something serious is inside here." */
function buildingHeat(levels, issues){
  const heat={};
  const byLevel={};
  levels.forEach(l=>{ byLevel[l.id]=l.b; });
  issues.forEach(i=>{
    const exc=exceptionOf(i); if(!exc) return;
    const bid=byLevel[i.lvl]; if(!bid) return;
    const cur=heat[bid];
    if(!cur || exc.rank>cur.exc.rank || (exc.rank===cur.exc.rank && PRI_RANK[i.pri]<PRI_RANK[cur.iss.pri])){
      heat[bid]={exc, iss:i, count:(cur?cur.count:0)+1};
    } else {
      cur.count++;
    }
  });
  return heat;
}

/* ============ HELPERS ============ */

function blob(x,y,w,h,seed){
  const base=Math.min(w,h)*0.30;
  const j=n=>((Math.sin(seed*7.3+n*11.7)+1)/2-0.5)*base*0.5;
  const r1=Math.max(4,base+j(1)), r2=Math.max(4,base+j(2)), r3=Math.max(4,base+j(3)), r4=Math.max(4,base+j(4));
  return `M${x+r1},${y} L${x+w-r2},${y} Q${x+w},${y} ${x+w},${y+r2} L${x+w},${y+h-r3} Q${x+w},${y+h} ${x+w-r3},${y+h} L${x+r4},${y+h} Q${x},${y+h} ${x},${y+h-r4} L${x},${y+r1} Q${x},${y} ${x+r1},${y} Z`;
}
const seedOf = id => { let s=0; for(let i=0;i<id.length;i++) s=(s*31+id.charCodeAt(i))%997; return s%40+1; };
const snap = v => Math.round(v/10)*10;
function svgPoint(svg, e, invMatrix){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  let inv=invMatrix;
  if(!inv){ const m=svg.getScreenCTM(); if(!m) return {x:0,y:0}; inv=m.inverse(); }
  const p=pt.matrixTransform(inv); return {x:p.x, y:p.y};
}
function pinPos(iss, zones){
  if(iss.cond==='CLOSED' && iss.resolvedX!=null && iss.resolvedY!=null){
    return {x:iss.resolvedX, y:iss.resolvedY};
  }
  const z=zones.find(z=>z.id===iss.zid);
  if(!z) return {x:iss.x||500, y:iss.y||350};
  return {x:z.x+z.w*iss.rx, y:z.y+z.h*iss.ry};
}
const nz = (x,y) => `${Math.round(x)} , ${Math.round(y/700*1000)}`;

/* ============ PIN ============ */
function PinGlyph({iss, pos, selected, onClick, fresh}){
  const c=PRI_COLOR[iss.pri], s=15;
  const active=iss.cond==='OPEN'||iss.cond==='CONTAINED';
  let shape;
  if(iss.cond==='CLOSED')               shape=<circle r={s-3} fill={c} stroke="#fff" strokeWidth="3" opacity=".55"/>;
  else if(iss.cond==='CONTAINED')       shape=<rect x={-s} y={-s} width={s*2} height={s*2} rx="3.5" fill="#fff" stroke={c} strokeWidth="4.5" transform="rotate(45)"/>;
  else if(iss.cond==='RESOLVED-VERIFY') shape=<path d={`M0,${-s-2} L${s+2},${s} L${-s-2},${s} Z`} fill="#fff" stroke={c} strokeWidth="4.5" strokeLinejoin="round"/>;
  else if(iss.cond==='MONITORING')      shape=<rect x={-s+1} y={-s+1} width={s*2-2} height={s*2-2} rx="5" fill="#fff" stroke={c} strokeWidth="4.5"/>;
  else                                  shape=<circle r={s} fill="#fff" stroke={c} strokeWidth="4.5"/>;
  return (
    <g className={'pin '+(fresh?'pin-in':'')} transform={`translate(${pos.x},${pos.y})`}
       onClick={e=>{e.stopPropagation(); onClick(iss);}} role="button" tabIndex="0"
       onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); onClick(iss);}}}
       aria-label={`${iss.id}: ${iss.title}`}>
      {active && (iss.pri==='P0'||iss.pri==='P1'||iss.escalated) && <circle className="halo-pulse" fill={iss.escalated?'var(--p0)':c} opacity=".4"/>}
      {selected && <circle r="30" fill="none" stroke={c} strokeWidth="2.5" opacity=".55" strokeDasharray="5 4"/>}
      {iss.linked && <circle r={s+7} fill="none" stroke={c} strokeWidth="2" opacity=".6"/>}
      <circle className="pin-hit" r="30"/>
      <g filter="url(#pinshadow)">{shape}</g>
      {iss.escalated && (
        <g transform={`translate(${-s+2},${-s-2})`}>
          <circle r="11" fill="#FCEDE8" stroke="var(--p0)" strokeWidth="1.4"/>
          <text y="4.5" textAnchor="middle" fontSize="11">📣</text>
        </g>)}
      {!iss.escalated && iss.needsReview && (
        <g transform={`translate(${-s+2},${-s-2})`}>
          <circle r="11" fill="#EDF3EF" stroke="var(--sage-deep)" strokeWidth="1.4"/>
          <text y="4.5" textAnchor="middle" fontSize="10">🔎</text>
        </g>)}
      {WORK_BADGE[iss.work] && (
        <g transform={`translate(${s-2},${-s-2})`}>
          <circle r="11" fill="#fff" stroke="rgba(45,55,72,.14)" strokeWidth="1"/>
          <text y="4.5" textAnchor="middle" fontSize="12">{WORK_BADGE[iss.work]}</text>
        </g>)}
    </g>
  );
}

/* ============ MAP ============ */
function MapStage({zones, issues, selected, onPin, onZone, adding, onPlace, freshId,
                   editing, selZone, onSelZone, onZoneChange, recurring, bgImage, levelKey, stock}){
  const svgRef=useRef(null);
  const dragRef=useRef(null);
  const contentRef=useRef(null);
  const ptrs=useRef(new Map());
  const gest=useRef(null);
  const movedRef=useRef(false);
  const [view,setView]=useState({x:0,y:0,k:1});
  useEffect(()=>{ setView({x:0,y:0,k:1}); }, [levelKey]);

  /* Convert client coords straight into CONTENT space by using the transformed
     group's own matrix — no manual un-projection, so hit-tests stay correct at
     any zoom. */
  const toContent=(e)=>{
    const g=contentRef.current;
    if(!g) return {x:0,y:0};
    const m=g.getScreenCTM(); if(!m) return {x:0,y:0};
    const pt=svgRef.current.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(m.inverse());
    return {x:p.x, y:p.y};
  };
  /* Keep the floor covering the frame: never zoom out past fit, never pan the
     content off the edge. */
  const clamp=(v)=>{
    const k=Math.max(1, Math.min(6, v.k));
    return {k,
      x: Math.max(1000*(1-k), Math.min(0, v.x)),
      y: Math.max(700*(1-k),  Math.min(0, v.y))};
  };
  function zoomAt(cx, cy, factor){
    setView(v=>{
      const k=Math.max(1, Math.min(6, v.k*factor));
      const s=k/v.k;
      return clamp({k, x:cx-(cx-v.x)*s, y:cy-(cy-v.y)*s});
    });
  }
  /* Viewport-space point (pre-transform), for anchoring a zoom at the pinch centre. */
  const toFrame=(clientX,clientY)=>{
    const m=svgRef.current.getScreenCTM(); if(!m) return {x:500,y:350};
    const pt=svgRef.current.createSVGPoint(); pt.x=clientX; pt.y=clientY;
    const p=pt.matrixTransform(m.inverse());
    return {x:p.x, y:p.y};
  };

  function bgDown(e){
    ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.current.size===2){
      dragRef.current=null;               // a second finger converts a zone drag into a pinch
      const [a,b]=[...ptrs.current.values()];
      gest.current={
        mode:'pinch',
        dist:Math.hypot(a.x-b.x,a.y-b.y)||1,
        mid0:toFrame((a.x+b.x)/2,(a.y+b.y)/2),
        startK:view.k, startX:view.x, startY:view.y,
      };
      try{ svgRef.current.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }
    if(ptrs.current.size===1 && !dragRef.current){
      movedRef.current=false;
      gest.current={
        mode: view.k>1.02 ? 'pan' : 'idle',
        cx:e.clientX, cy:e.clientY,
        ox:view.x, oy:view.y,
      };
      if(gest.current.mode==='pan'){
        try{ svgRef.current.setPointerCapture(e.pointerId); }catch(_){}
      }
    }
  }
  function bgMove(e){
    if(!ptrs.current.has(e.pointerId)) return;
    ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const g=gest.current; if(!g) return;
    if(g.mode==='pinch' && ptrs.current.size>=2){
      const [a,b]=[...ptrs.current.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(!g.dist) return;
      const mid=toFrame((a.x+b.x)/2,(a.y+b.y)/2);
      const k=Math.max(1,Math.min(6, g.startK*(d/g.dist)));
      const s=k/g.startK;
      setView(()=>clamp({
        k,
        x: mid.x - (g.mid0.x - g.startX)*s,
        y: mid.y - (g.mid0.y - g.startY)*s,
      }));
      movedRef.current=true;
      e.preventDefault();
    } else if(g.mode==='pan' || g.mode==='idle'){
      const ctm=svgRef.current && svgRef.current.getScreenCTM();
      if(!ctm || !ctm.a) return;
      const dx=(e.clientX-g.cx)/ctm.a;
      const dy=(e.clientY-g.cy)/ctm.d;
      if(Math.hypot(e.clientX-g.cx, e.clientY-g.cy)>8){
        movedRef.current=true;
        if(g.mode==='idle' && view.k>1.02) g.mode='pan';
      }
      if(g.mode==='pan'){
        setView(v=>clamp({k:v.k, x:g.ox+dx, y:g.oy+dy}));
        e.preventDefault();
      }
    }
  }
  function bgUp(e){
    ptrs.current.delete(e.pointerId);
    if(ptrs.current.size<2 && gest.current && gest.current.mode==='pinch') gest.current=null;
    if(ptrs.current.size===0) gest.current=null;
    try{ svgRef.current.releasePointerCapture(e.pointerId); }catch(_){}
  }
  function wheel(e){
    e.preventDefault();
    const f=toFrame(e.clientX,e.clientY);
    zoomAt(f.x, f.y, e.deltaY<0 ? 1.15 : 1/1.15);
  }
  const fit=()=>setView({x:0,y:0,k:1});
  /* A drag that started on a room or a pin must not count as a tap on release. */
  const tapped=()=>{ if(movedRef.current){ movedRef.current=false; return false; } return true; };

  function down(e, zone, mode){
    if(!editing) return;
    e.stopPropagation();
    e.preventDefault();
    ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    svgRef.current.setPointerCapture(e.pointerId);
    const p=toContent(e);
    dragRef.current={id:zone.id, mode, ox:p.x, oy:p.y, o:{...zone}};
    onSelZone(zone.id);
  }
  function move(e){
    bgMove(e);
    const d=dragRef.current; if(!d) return;
    e.preventDefault();
    const p=toContent(e);
    const dx=p.x-d.ox, dy=p.y-d.oy;
    if(d.mode==='move'){
      onZoneChange(d.id,{x:Math.max(10,Math.min(990-d.o.w,snap(d.o.x+dx))),
                         y:Math.max(10,Math.min(690-d.o.h,snap(d.o.y+dy)))});
    }else{
      onZoneChange(d.id,{w:Math.max(60,Math.min(990-d.o.x,snap(d.o.w+dx))),
                         h:Math.max(50,Math.min(690-d.o.y,snap(d.o.h+dy)))});
    }
  }
  function up(e){ dragRef.current=null; bgUp(e); }

  function click(e){
    if(movedRef.current){ movedRef.current=false; return; }  // a pan is not a tap
    if(editing){ onSelZone(null); return; }
    if(!adding) return;
    const p=toContent(e);
    const hit=[...zones].reverse().find(z=>p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h);
    onPlace(p.x,p.y,hit);
  }

  return (
    <div className={'mapwrap'+(adding?' adding':'')+(editing?' editing':'')}>
      <svg ref={svgRef} className="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
           onClick={click} onPointerDown={bgDown} onPointerMove={move} onPointerUp={up}
           onPointerCancel={up} onWheel={wheel}>
        <defs>
          <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#E8D9C6" opacity=".55"/></pattern>
          <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <circle cx="0" cy="0" r="1.6" fill="#D9C4A9" opacity=".8"/></pattern>
          <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="14" height="14" fill="#FDF3DC"/><rect width="7" height="14" fill="#F3DFA8"/></pattern>
          <pattern id="stripesX" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="14" height="14" fill="#FCEDE8"/><rect width="7" height="14" fill="#F3C3B2"/></pattern>
          <filter id="pinshadow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0" dy="3" stdDeviation="3.2" floodColor="#2D3748" floodOpacity=".22"/></filter>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" floodColor="#5D7196" floodOpacity=".13"/></filter>
        </defs>

        <rect width="1000" height="700" fill="var(--paper)"/>
        <g ref={contentRef} transform={`translate(${view.x},${view.y}) scale(${view.k})`}>
        {bgImage
          ? <image href={bgImage} xlinkHref={bgImage} x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet"/>
          : <rect width="1000" height="700" fill="url(#grain)"/>}
        {editing && <rect width="1000" height="700" fill="url(#grid)"/>}

        {zones.map(z=>{
          const k=KINDS[z.kind]||KINDS.office;
          const sel=editing&&selZone===z.id;
          const dueRecs=!editing ? (recurring||[]).filter(r=>r.zid===z.id&&dueStatus(r)!=='ok') : [];
          const overdueHere=dueRecs.some(r=>dueStatus(r)==='overdue');
          const lowHere=!editing ? (stock||[]).filter(it=>it.zid===z.id&&isLow(it)).length : 0;
          return (
            <g key={z.id} className="zone-g" filter="url(#soft)" style={{cursor:'pointer'}}
               onPointerDown={e=>{ if(editing) return; movedRef.current=false; }}
               onClick={e=>{ if(!editing&&!adding&&tapped()){ e.stopPropagation(); onZone(z);} }}>
              <path className={'zone-fill'+(editing?' zone-drag':'')} d={blob(z.x,z.y,z.w,z.h,seedOf(z.id))}
                    fill={k.fill} fillOpacity={bgImage?0.45:1} stroke={k.line} strokeWidth={bgImage?2.5:2}
                    onPointerDown={e=>down(e,z,'move')}/>
              {KIND_EMO[z.kind] && (
                <text x={z.x+z.w/2} y={z.y+z.h/2+Math.min(z.w,z.h)*0.13} textAnchor="middle"
                      fontSize={Math.min(Math.min(z.w,z.h)*0.5, 68)} opacity=".16"
                      style={{pointerEvents:'none'}}>{KIND_EMO[z.kind]}</text>
              )}
              <text className="zone-lbl" x={z.x+14} y={z.y+27}>{z.name}</text>
              <text className="zone-code" x={z.x+14} y={z.y+43}>{z.code} · {k.label}</text>
              {dueRecs.length>0 && (
                <g transform={`translate(${z.x+z.w-18},${z.y+z.h-18})`}>
                  <circle r="12" fill={overdueHere?'#FCEDE8':'#FDF3E9'} stroke={overdueHere?'var(--p0)':'#E5B248'} strokeWidth="1.6"/>
                  <text y="4.5" textAnchor="middle" fontSize="12">🧹</text>
                </g>
              )}
              {lowHere>0 && (
                <g transform={`translate(${z.x+z.w-18},${z.y+z.h-(dueRecs.length>0?46:18)})`}>
                  <circle r="12" fill="#FDF3E9" stroke="#E5B248" strokeWidth="1.6"/>
                  <text y="4.5" textAnchor="middle" fontSize="11">📦</text>
                </g>
              )}
              {sel && <>
                <rect className="edit-outline" x={z.x-6} y={z.y-6} width={z.w+12} height={z.h+12} rx="14"/>
                <circle className="handle" cx={z.x+z.w} cy={z.y+z.h} r="13" onPointerDown={e=>down(e,z,'size')}/>
              </>}
            </g>
          );
        })}

        {!editing && issues.filter(i=>i.cond==='CONTAINED' && i.control).map(i=>{
          const p=pinPos(i,zones);
          const z=zones.find(zz=>zz.id===i.zid);
          const w=Math.min(z?z.w*0.62:150, 170), h=Math.min(z?z.h*0.62:120, 140);
          const x=Math.max(4,p.x-w/2), y=Math.max(4,p.y-h/2);
          const today=new Date().toISOString().slice(0,10);
          const lapsed=!!(i.controlExp && i.controlExp<today);
          return (
            <g key={'ctl-'+i.id} style={{pointerEvents:'none'}}>
              <path d={blob(x,y,w,h,seedOf(i.id)+11)}
                    fill={lapsed?'url(#stripesX)':'url(#stripes)'} fillOpacity=".85"
                    stroke={lapsed?'var(--p0)':'#D8A93C'} strokeWidth="2.5" strokeDasharray="8 5"/>
              <text x={x+8} y={y+16} style={{fontSize:10.5,fontFamily:'IBM Plex Mono',
                    fill:lapsed?'#B0472A':'#8A6B2E',fontWeight:500}}>
                {lapsed?'CONTROL LAPSED':'TEMPORARY CONTROL'}
              </text>
              {i.controlExp && <text x={x+8} y={y+29} style={{fontSize:10,fontFamily:'IBM Plex Mono',
                    fill:lapsed?'#B0472A':'#9A7C42'}}>
                {lapsed?'expired '+fmtDate(i.controlExp):'expires '+fmtDate(i.controlExp)}
              </text>}
            </g>
          );
        })}

        {!editing && issues.map(i=>(
          <PinGlyph key={i.id} iss={i} pos={pinPos(i,zones)} selected={selected&&selected.id===i.id}
                    fresh={freshId===i.id} onClick={iss=>{ if(tapped()) onPin(iss); }}/>
        ))}
        </g>
      </svg>

      <div className="zoomer">
        <button onClick={()=>zoomAt(500,350,1.4)} aria-label="Zoom in">+</button>
        <button onClick={()=>zoomAt(500,350,1/1.4)} aria-label="Zoom out">−</button>
        <button onClick={fit} aria-label="Fit the whole floor" className="zfit">⤢</button>
      </div>
      {view.k>1.02 && <div className="zoomlvl mono">{view.k.toFixed(1)}×</div>}

      {adding && !editing && <div className="tip">👆 Tap where you saw it</div>}
    </div>
  );
}

/* ============ PROPERTY STAGE ============ */
function PropertyStage({buildings, editing, selBldg, onSelBldg, onBldgChange, onEnter, heat}){
  const svgRef=useRef(null);
  const dragRef=useRef(null);
  const justSelectedRef=useRef(false);

  function down(e, b, mode){
    if(!editing) return;
    e.stopPropagation();
    e.preventDefault();
    svgRef.current.setPointerCapture(e.pointerId);
    const m=svgRef.current.getScreenCTM();
    const inv=m?m.inverse():null;
    const p=svgPoint(svgRef.current,e,inv);
    dragRef.current={id:b.id, mode, ox:p.x, oy:p.y, o:{...b}, inv};
    justSelectedRef.current=true;
    onSelBldg(b.id);
  }
  function move(e){
    const d=dragRef.current; if(!d) return;
    e.preventDefault();
    const p=svgPoint(svgRef.current,e,d.inv);
    const dx=p.x-d.ox, dy=p.y-d.oy;
    if(d.mode==='move'){
      onBldgChange(d.id,{x:Math.max(10,Math.min(990-d.o.w,snap(d.o.x+dx))),
                         y:Math.max(10,Math.min(690-d.o.h,snap(d.o.y+dy)))});
    }else{
      onBldgChange(d.id,{w:Math.max(90,Math.min(990-d.o.x,snap(d.o.w+dx))),
                         h:Math.max(90,Math.min(690-d.o.y,snap(d.o.h+dy)))});
    }
  }
  function up(e){ if(dragRef.current){ dragRef.current=null; try{svgRef.current.releasePointerCapture(e.pointerId);}catch(_){} } }
  function click(){
    // A tap that just selected a building fires this same click on release —
    // without the guard, selecting and deselecting happened on the same tap.
    if(justSelectedRef.current){ justSelectedRef.current=false; return; }
    if(editing) onSelBldg(null);
  }

  return (
    <div className={'mapwrap'+(editing?' editing':'')}>
      <svg ref={svgRef} className="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
           onClick={click} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
        <defs>
          <pattern id="pgrain" width="6" height="6" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r=".8" fill="#E8D9C6" opacity=".55"/></pattern>
          <pattern id="pgrid" width="50" height="50" patternUnits="userSpaceOnUse">
            <circle cx="0" cy="0" r="1.6" fill="#D9C4A9" opacity=".8"/></pattern>
          <filter id="psoft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="5" floodColor="#5D7196" floodOpacity=".16"/></filter>
        </defs>
        <rect width="1000" height="700" fill="var(--paper)"/>
        <rect width="1000" height="700" fill="url(#pgrain)"/>
        {editing && <rect width="1000" height="700" fill="url(#pgrid)"/>}

        {buildings.map(b=>{
          const k=KINDS[b.kind]||KINDS.structure;
          const sel=editing&&selBldg===b.id;
          const h=!editing ? (heat||{})[b.id] : null;
          const hc=h?PRI_COLOR[h.iss.pri]:null;
          return (
            <g key={b.id} className="zone-g" filter="url(#psoft)"
               onClick={e=>{ if(!editing){ e.stopPropagation(); onEnter(b.id);} }}>
              <path className={'zone-fill'+(editing?' zone-drag':'')} d={blob(b.x,b.y,b.w,b.h,seedOf(b.id))}
                    fill={k.fill} stroke={h?hc:k.line} strokeWidth={h?4:2.5}
                    onPointerDown={e=>down(e,b,'move')}/>
              <text x={b.x+18} y={b.y+34} style={{fontSize:16,fontFamily:'Sora',fontWeight:600,fill:'#4E6183'}}>{b.emo} {b.name}</text>
              <text className="zone-code" x={b.x+18} y={b.y+52}>{k.label}</text>
              {h && <g transform={`translate(${b.x+b.w-34},${b.y+34})`}>
                {(h.iss.pri==='P0'||h.iss.pri==='P1') && <circle className="halo-pulse" fill={hc} opacity=".45"/>}
                <circle r="15" fill={hc}/>
                <text y="5.5" textAnchor="middle" style={{fontSize:14,fontWeight:700,fill:'#fff',fontFamily:'Sora'}}>{h.count}</text>
              </g>}
              {h && <text x={b.x+18} y={b.y+72} style={{fontSize:12,fontWeight:600,fill:hc,fontFamily:'Outfit'}}>
                {h.iss.pri} · {h.exc.label}
              </text>}
              {sel && <>
                <rect className="edit-outline" x={b.x-6} y={b.y-6} width={b.w+12} height={b.h+12} rx="16"/>
                <circle className="handle" cx={b.x+b.w} cy={b.y+b.h} r="14" onPointerDown={e=>down(e,b,'size')}/>
              </>}
            </g>
          );
        })}
      </svg>

      {!editing && <div className="legend" style={{maxWidth:210}}>
        <b>Your property</b>
        <div className="legend-row" style={{marginTop:6}}>A coloured ring means something inside needs attention.</div>
        <div className="legend-row">The number is how many.</div>
        <div className="legend-row" style={{marginTop:8,paddingTop:7,borderTop:'1px solid var(--hair)'}}>Tap a building to walk in.</div>
      </div>}
    </div>
  );
}

      <div className="comp-h">{zone.name}</div>
      <div className="comp-sub mono">{zone.code} · {k.label} · {zone.w} × {zone.h}</div>
      {issues.length ? (
        <div style={{marginTop:14}}>
          <div className="lbl" style={{margin:'0 0 2px'}}>Open here</div>
          {issues.map(i=>(
            <button key={i.id} className="zrow" onClick={()=>onOpen(i)}>
              <span className="dot" style={{background:PRI_COLOR[i.pri], width:11, height:11, flex:'0 0 auto'}}/>
              <span><span className="zt">{i.title}</span><br/><span className="zs mono">{i.id} · {i.pri} · {i.cond}</span></span>
            </button>))}
        </div>
      ) : <div className="zempty">Nothing open in this room right now. That is worth as much as a problem list — it means somebody walked it and there was nothing to report.</div>}

      {resolvedCount>0 &&
        <div className="hint" style={{marginTop:11}}>🔒 {resolvedCount} closed record{resolvedCount>1?'s':''} from this room, filed at the spot they were verified — not deleted, just out of the way.</div>}

      {recs && recs.length>0 && (
        <div style={{marginTop:14}}>
          <div className="lbl" style={{margin:'0 0 2px'}}>Routine checks</div>

            const st=dueStatus(r);
            return (
              <div key={r.id} className="zrow" style={{alignItems:'center'}}>
                <span style={{fontSize:17}}>🧹</span>
                <span style={{flex:1, minWidth:0}}>
                  <span className="zt">{r.title}</span><br/>
                  <span className="zs">{r.cadence} · last {fmtDate(r.lastDone)} · {st==='overdue'?'overdue since '+fmtDate(r.nextDue):st==='today'?'due today':'due '+fmtDate(r.nextDue)}</span>
                </span>
                <button className="ebtn solid" onClick={()=>onLogCheck(r)}>Looked fine</button>
              </div>
            );
          })}
          <div className="hint">Found something instead? "Report something here" below goes on the record the same way a walk-through would.</div>
        </div>
      )}

      <div className="comp-actions">
        <button className="btn ghost" onClick={onClose}>Close</button>
        <button className="btn primary" onClick={onReport}>Report something here</button>
      </div>
    </div>
  </>);
}

/* ============ COMPOSER ============ */
function Composer({at, zone, levelName, bldgName, role, onCancel, onSave}){
  const canOrder = role!=='tech';
  const [mode,setMode]=useState('report');
  const [obs,setObs]=useState(''), [cat,setCat]=useState(''), [pri,setPri]=useState('P2'), [shots,setShots]=useState([]);
  const [busyPhoto,setBusyPhoto]=useState(false);
  async function pickPhotos(fileList){
    const files=Array.from(fileList||[]); if(!files.length) return;
    setBusyPhoto(true);
    const added=[];
    for(const file of files.slice(0,4)){ const shot=await ingestPhoto(file); if(shot) added.push(shot); }
    setShots(p=>[...p,...added].slice(0,6));
    setBusyPhoto(false);
  }
  const [assignTo,setAssignTo]=useState(''), [due,setDue]=useState('');
  const ta=useRef(null);
  useEffect(()=>{ta.current&&ta.current.focus()},[mode]);
  /* Warn on EXPLANATORY language, not on words of damage. "Urinal 2 leaking at
     the base" is something you can watch happen — that's an observation. What
     makes it a diagnosis is claiming a cause or prescribing a fix. */
  const looksLikeDiagnosis=/\b(because|caused by|due to|the cause|needs? (a|an|to be)|should be replaced|must be replaced|it'?s the)\b/i.test(obs);
  const isOrder = mode==='order';
  const ready = obs.trim() && (!isOrder || assignTo);

  return (<>
    <div className="scrim" onClick={onCancel}/>
    <div className="modal" role="dialog" aria-label={isOrder?'Create a work order':'Report what you saw'}>
      {canOrder && (
        <div className="tabs" role="tablist" style={{padding:'0 0 12px', border:'none', margin:'0 0 2px'}}>
          <button className="tab" role="tab" aria-selected={!isOrder} onClick={()=>setMode('report')}>👀 What I saw</button>
          <button className="tab" role="tab" aria-selected={isOrder} onClick={()=>setMode('order')}>📋 A work order</button>
        </div>
      )}

      <div className="comp-h">{isOrder ? 'What needs to be done?' : 'What did you see?'}</div>
      <div className="comp-sub">
        {at && at.id && <><span className="iss-id mono">{at.id}</span>{' '}</>}
        {bldgName} · {levelName} · {zone?zone.name:'no room — dropped on the map'} {at&&<span className="mono">· {nz(at.x,at.y)}</span>}
      </div>
      {at && at.id && <div className="pickhint" style={{marginTop:6}}>This record already exists at this spot. If your phone dies now, {at.id} survives as an incomplete observation.</div>}

      <div className="lbl">{isOrder ? 'What are you asking them to do' : 'Describe it the way a camera would'} <span className="req">required</span></div>
      <textarea ref={ta} rows="3" value={obs} onChange={e=>setObs(e.target.value)}

  </>);

const ROLE_META={
  tech:{emo:'🔧', label:'Tech'},
  supervisor:{emo:'📋', label:'Supervisor'},
  manager:{emo:'🔑', label:'Manager'},
};
const ROLE_ORDER=['tech','supervisor','manager'];
const roleCan = (move, role) => (move.roles||ROLE_ORDER).includes(role);
const BUDGET_ROLES={supervisor:1, manager:1};
const LAYOUT_ROLES={supervisor:1, manager:1};
function authRole(){
  const r=(API.me && API.me.role) || API.claimRole || 'tech';
  return ROLE_ORDER.indexOf(r)>=0 ? r : 'tech';
}
function canSeeBudget(role){
  return !!BUDGET_ROLES[role || authRole()];
}
function canEditLayout(role){
  return !!LAYOUT_ROLES[role || authRole()];
}
const AUDIT_KEY='feos_audit_v1';
function auditLog(evt){
  const row={at:new Date().toISOString(), ...evt};
  try{
    const q=safeJsonParse(localStorage.getItem(AUDIT_KEY)||'[]');
    const next=(Array.isArray(q)?q:[]).concat(row).slice(-300);
    localStorage.setItem(AUDIT_KEY, JSON.stringify(next));
  }catch(_){}
}
function budgetForbidden(role, action, path){
  auditLog({kind:'deny', status:403, action:action||'budget', path:path||'', role:role||authRole(), reason:'budget_forbidden'});
  const err=new Error('Forbidden');
  err.status=403; err.kind='forbidden';
  return err;
}
function isBudgetRequest(path, payload){
  const p=String(path||'').toLowerCase();
  const q=p.split('?')[1]||'';
  if(/(^|\/)(api\/)?budget/.test(p)) return true;
  if(/\/export\/budget|\/budget\/export/.test(p)) return true;
  if(/sheet=budget|tab=budget/.test(q)) return true;
  if(payload && typeof payload==='object'){
    const s=JSON.stringify(payload).toLowerCase();
    if(/"sheet"\s*:\s*"budget"|"includebudget"\s*:\s*true/.test(s) && /export/.test(p)) return true;
  }
  return false;
}
const FINANCE_KEYS={budgeted:1,spent:1,remaining:1,accounted:1,accountedfor:1,unaccounted:1,unexplained:1,logged:1};
function stripFinance(value){
  if(Array.isArray(value)) return value.map(stripFinance).filter(v=>v!==undefined);
  if(!value || typeof value!=='object') return value;
  if('budgeted' in value && 'spent' in value) return undefined;
  const o={};
  Object.keys(value).forEach(k=>{
    const lk=k.toLowerCase();
    if(lk==='budget' || lk==='budgets') return;
    if(FINANCE_KEYS[lk]) return;
    const v=stripFinance(value[k]);
    if(v!==undefined) o[k]=v;
  });
  return o;
}
function projectForRole(data, role){
  if(data==null || canSeeBudget(role)) return data;
  return stripFinance(data);
}

/* ============ PHOTO EVIDENCE ============ */
/* Hash the ORIGINAL bytes — that's the evidence hash, and it's what a real
   backend would re-verify against. Store only a downscaled copy, because a
   full-resolution phone photo is several MB and localStorage caps around 5. */
async function sha256Hex(buf){
  try{
    if(!(window.crypto && window.crypto.subtle)) return null;
    const d=await window.crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(_){ return null; }
}
function downscale(file, maxDim=800, quality=0.6){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let thumb=null;
      try{ thumb=c.toDataURL('image/jpeg',quality); }catch(_){}
      URL.revokeObjectURL(url);
      res({thumb, w:img.width, h:img.height});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res({thumb:null,w:0,h:0}); };
    img.src=url;
  });
}
async function ingestPhoto(file){
  if(!file) return null;
  if(file.size>12*1024*1024) return null;
  const mime=(file.type||'').toLowerCase();
  if(mime && !/^image\/(jpeg|jpg|png|webp|gif|heic|heif)$/.test(mime)) return null;
  let hash=null;
  try{ hash=await sha256Hex(await file.arrayBuffer()); }catch(_){}
  const {thumb,w,h}=await downscale(file);
  const name=(file.name||'photo.jpg').replace(/[^\w.\-]+/g,'_').replace(/^\.+/,'').slice(0,80) || 'photo.jpg';
  return {name, size:file.size, w, h, hash, thumb, at:new Date().toISOString()};
}
/* Pull every photo out of a submitted form, using the move's own field defs
   rather than guessing at value shapes. */
function photosFromValues(fields, values){
  const out=[];
  fields.filter(f=>f.t==='photo').forEach(f=>{
    const arr=values[f.k];
    if(Array.isArray(arr)) out.push(...arr);
  });
  return out;
}

/* Honest hash line: real digest, or a plain statement that there isn't one. */
function hashLine(photos){
  if(!photos || !photos.length) return 'No photo attached — nothing to hash.';
  const withHash=photos.filter(p=>p.hash);
  if(!withHash.length) return photos.length+' photo'+(photos.length>1?'s':'')+' · this browser could not compute a digest (needs a secure context)';
  return 'sha256 '+withHash[0].hash.slice(0,16)+'… · computed in your browser from the original file'
    + (withHash.length>1 ? ' (+'+(withHash.length-1)+' more)' : '');
}

/* Two explicit inputs, not one chooser: Android frequently drops the camera
   option when `multiple` is set, since a camera returns a single file. */

function fmtDate(s){
  if(!s) return '';
  const d=new Date(s+'T12:00:00');
  return isNaN(d) ? s : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function plusDays(n){ return new Date(Date.now()+n*864e5).toISOString().slice(0,10); }

/* the status sentence is derived, never typed — so it can never drift from the record */
function plainOf(i){
  const v=i.vendor;
  let base;
  if(i.cond==='CLOSED') base = i.watchUntil
    ? 'Closed out. Verified, watched, and nothing came back.'
    : 'Closed out. Verified and closed on the spot — no watch period needed.';
  else if(i.cond==='MONITORING') base = `Fixed and verified. Being watched${i.watchUntil?' until '+fmtDate(i.watchUntil):''} before anyone can close it.`;
  else if(i.cond==='RESOLVED-VERIFY') base = 'Work is done. It is not closed. Somebody has to walk it and run the test.';
  else {
    const a = i.cond==='CONTAINED' ? 'Contained for now.' : 'Not contained.';
    let b='';
    if(i.work==='UNASSIGNED')            b='Nobody owns it yet.';
    else if(i.work==='ACTION PENDING')   b='Waiting on a decision.';
    else if(i.work==='IN-HOUSE WORK')    b=(i.owner||'The crew')+' is on it in-house'+(i.due?', due '+fmtDate(i.due):'')+'.';
    else if(i.work==='VENDOR REQUESTED') b=(v?v.name:'A contractor')+' requested, no date offered yet.';
    else if(i.work==='VENDOR SCHEDULED') b=(v?v.name:'Contractor')+' booked'+(v&&v.visit&&v.visit!=='Not scheduled'?' '+v.visit:'')+'.';
    else if(i.work==='BLOCKED')          b='Blocked — '+(i.blockedReason||'no reason recorded')+'.';
    const c = (v && v.photos===0 && v.claimed && v.claimed!=='—') ? ' Photo proof still missing.' : '';
    base = [a,b].filter(Boolean).join(' ')+c;
  }
  if(i.escalated) return '🚨 Escalated. '+base;
  if(i.needsReview) return '🔎 Waiting on a Supervisor to confirm. '+base;
  return base;
}

function seedEvents(i){
  const e=[{ic:'👀', h:'Reported what they saw', d:i.saw, m:`${i.sawBy} · ${i.sawAt}`}];
  i.chain.slice(1).forEach(c=>e.push({ic:c.icon, h:c.act, d:c.note||'', m:`${c.who} · ${c.t}`, fail:!!c.stall}));
  i.hyps.forEach(h=>e.push({ic:h.dead?'✋':'🤔', h:(h.dead?'Ruled out: ':'Theory added: ')+h.t, d:h.why, m:h.conf}));
  if(i.did && i.did!=='Nothing yet.') e.push({ic:'🛠', h:'Action taken', d:i.did, m:i.didBy});
  if(i.vendor && i.vendor.claimed && i.vendor.claimed!=='—')
    e.push({ic:'🧾', h:i.vendor.name+' logged a claim',
      d:i.vendor.claimed+(i.vendor.photos===0?' · no photo proof uploaded':` · ${i.vendor.photos} photo${i.vendor.photos>1?'s':''}`),
      m:i.vendor.visit, fail:i.vendor.photos===0});
  if(i.verify.state==='passed') e.push({ic:'✅', h:'Verification passed', d:i.verify.text, m:'—'});
  return e;
}
