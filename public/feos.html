            return {lvl:l.id, zid:z?z.id:null};
          };
          stockAdds.forEach(it=>{
            const loc=placeOf(it.bldg,it.level,it.room);
            const at=find(it.name);
            const row={id: at>=0 ? next[at].id : 'inv'+(next.length+1),
              name:it.name, cat:it.cat, unit:it.unit, onHand:it.onHand, par:it.par, unitCost:it.unitCost,
              lvl:loc.lvl, zid:loc.zid};
            if(at>=0) next[at]={...next[at], ...row};
            else next.push(row);

          return next;
        });

      const vNew=vendorAdds.length, vHist=histAdds.length, bLines=budgetLines.length, iLines=stockAdds.length;

      if(rc.levels) bits.push(rc.levels+' level'+(rc.levels>1?'s':''));
      if(rc.rooms) bits.push(rc.rooms+' room'+(rc.rooms>1?'s':''));
      if(rc.issues) bits.push(rc.issues+' issue'+(rc.issues>1?'s':''));
      if(rc.events) bits.push(rc.events+' log '+(rc.events===1?'entry':'entries'));
      if(rc.checks) bits.push(rc.checks+' routine check'+(rc.checks>1?'s':''));
      if(bLines) bits.push(bLines+' budget line'+(bLines>1?'s':''));
      if(vHist) bits.push(vHist+' vendor history row'+(vHist>1?'s':''));
      if(vNew) bits.push(vNew+' vendor'+(vNew>1?'s':''));
      if(iLines) bits.push(iLines+' inventory item'+(iLines>1?'s':''));
      const found=(parsed.sheets||[]).join(', ')||'none';
      const cols=(parsed.preview||[]).join(', ');
      setImportReport(bits.length
        ? {text:'Restored '+bits.join(', ')+'. Existing records were kept. Photos are not in the spreadsheet.'}
        : {error:true, choose:true,
           text:'Couldn’t tell what that file is. Sheets: '+found+'. Columns: '+(cols||'none')+'. Pick what it is — the tab does not have to be named Vendors, Inventory, or Budget.'});
  }

      const amt=Number(String(values.amt).replace(/[^0-9.]/g,''))||0;
      const inv=invoiceAmt(sel);
      if(amt>0 && inv>0 && Math.abs(amt-inv)<0.009){
        say('That amount is already on the contractor invoice. Not entered twice.');
        return;
      }
      patch.costExtra=extrasOf(sel)+amt;
      bumpSpent(sel.cat, amt);
      if(sel.vendor) rememberVendorSpend(sel.vendor.name, amt, values.what, sel.vendor.invoice);
    }
    if(move.id==='vclaim' && sel.vendor){
      const inv=invoiceAmt({vendor:{invoice:values.inv}});
      bumpSpent(sel.cat, inv);
      rememberVendorSpend(sel.vendor.name, inv, values.claim, values.inv);
    }
    if(consume){
      const item=inventory.find(it=>!it.archived && it.name===consume.name);
      if(!item){ say('That item is not on the active inventory list.'); return; }
      if(!(item.unitCost>0)){ say(item.name+' has no unit cost. Put a price on it in Inventory — entered once — then pull it.'); return; }
      if(item.onHand < consume.qty){
        say('Only '+item.onHand+' '+item.unit+' of '+item.name+' left — log what you actually took.');
        return;
      }
      const qty=consume.qty;
      const spend=item.unitCost*qty;
      setInventory(prev=>prev.map(it=>it.id===item.id?{...it,onHand:it.onHand-qty}:it));
      patch.costParts=partsOf(sel)+spend;
      patch.cost=(typeof sel.cost==='number'?sel.cost:0)+spend;
      ev.d=(ev.d?ev.d+' · ':'')+qty+' × '+item.name+' @ '+money(item.unitCost)+' = '+money(spend)+' on this job. Par unchanged.';
    }

    const newPhotos = photosFromValues(flds, values);
    if(newPhotos.length) ev.photos = newPhotos;
    const merged = {...sel, ...patch};
    if(newPhotos.length) merged.photos = [...(sel.photos||[]), ...newPhotos];
    merged.plain = plainOf(merged);
    merged.events = [...sel.events, ev];
    if(merged.cond==='CLOSED' && sel.cond!=='CLOSED'){
      // Freeze the physical location the moment a record locks — a resolved
      // issue no longer tracks a room that might later move, resize, or be deleted.
      const zs=zonesAll[sel.lvl]||[];
      const pos=pinPos(sel, zs);
      merged.resolvedX=pos.x; merged.resolvedY=pos.y;
      merged.resolvedWhereText=whereOf(sel);
    }

    if(merged.vendor && merged.vendor.name){
      setVendors(prev=>prev.some(v=>v.name===merged.vendor.name) ? prev
        : [...prev, {id:'V'+(prev.length+1), name:merged.vendor.name, trade:'—', contact:merged.vendor.contact||'—', notes:[]}]);
    }

    if(spawnNew){
      // Recurrence opens a fresh episode instead of reopening the old one —
      // the closed record stays exactly as it was verified, permanently.
      const id='ISS-'+(++seq.current);
      const nw={
        id, lvl:sel.lvl, zid:sel.zid, rx:sel.rx, ry:sel.ry, x:sel.x, y:sel.y, cat:sel.cat,
        pri:sel.pri, cond:'OPEN', work:'ACTION PENDING',
        title:spawnNew.saw.length>62?spawnNew.saw.slice(0,62)+'…':spawnNew.saw,
        plain:'Came back. Linked to '+sel.id+' so the whole history sits in one place.',
        saw:spawnNew.saw, sawBy:'You · just now',
        sawAt:'Just now · '+(spawnNew.photos||[]).length+' photo'+((spawnNew.photos||[]).length===1?'':'s'),
        photos:spawnNew.photos||[],
        hash: hashLine(spawnNew.photos||[]),
        photoCap:id+' · now', hyps:[], did:'Nothing yet.', didBy:'—',
        verify:{state:'none',text:'No action taken yet, so there is nothing to verify.'},
        events:[{ic:'👀',h:'Reported what you saw',d:spawnNew.saw,m:'You · just now'},
                {ic:'🔁',h:'Opened as a recurrence of '+sel.id,d:'The earlier record stays closed and locked exactly as it was verified.',m:'Just now'}],
        vendor:null, linked:sel.id,
        domino:[{t:spawnNew.saw.slice(0,52), d:'Today · '+id, k:'bad'},{t:'Same room, already closed once before',d:sel.id,k:'bad'}],
      };
      setIssues(prev=>[nw, ...prev.map(x=>x.id===sel.id?merged:x)]);
      setSel(nw);
      setActiveMove(null); setShowActions(false);
      postMove(move, values, sel.id);
      say(sel.id+' stays closed exactly as it was verified. '+id+' opens fresh, linked back to it.');
      return;
    }

    setIssues(prev=>prev.map(x=>x.id===sel.id?merged:x));
    setSel(merged);
    setActiveMove(null); setShowActions(false);
    postMove(move, values, sel.id);
    const msg = patch.cond==='CLOSED' ? sel.id+' is closed and on the record — its location is locked in.'
      : patch.cond==='MONITORING' ? sel.id+' passed and is now being watched before anyone can close it.'
      : ev.fail ? 'Logged — including the part that did not go well.'
      : 'Logged and on the record.';
    say(msg);
  }

  /* Sends a move to the server after it has already been applied locally.
     Two very different failure cases, deliberately handled differently:

     - The server REFUSED it (4xx). The domain core rejected the move —
       wrong role, wrong stage, watch window not elapsed. The local state
       is now wrong and there is no point retrying, so we say so plainly
       and reload the truth from the server.
     - The server was UNREACHABLE. The move is queued and replayed. */
  function postMove(move, values, issueId){
    if(!API.on()) return;
    const path=`/issues/${issueId}/moves/${move.id}`;
    const payload={...values};
    API.call('POST', path, payload)
      .then(()=>setConn('live'))
      .catch(err=>{
        if(err.status && err.status>=400 && err.status<500){
          setConn('live');
          say('The server refused that: '+err.message+' Reloading the record.');
          reloadFromServer();
        }else{
          const n=outboxPush({method:'POST', path, payload});
          setOutbox(n); setConn('offline');
        }
      });
  }

  async function reloadFromServer(){
    if(!API.on()) return;
    try{
      const snap=await API.call('GET', `/facilities/${API.facility}/snapshot`);
      setBuildings(snap.buildings); setLevels(snap.levels); setZonesAll(snap.zonesAll);
      setIssues(snap.issues.map(i=>({...i, chain:[], domino:[],
        hash:i.events&&i.events.length?('Ledger seq '+i.events.length):'', photoCap:'',
        verify:i.verify||{state:'none',text:''}, hyps:i.hyps||[], events:i.events||[]})));
      setSel(s=>s?(snap.issues.find(i=>i.id===s.id)||null):null);
      setConn('live');
      loadPlans(snap.levelImages);
    }catch(err){ setConn('offline'); setConnNote(err.message); }
  }

  function logCheck(rec){
    const days=CADENCE_DAYS[rec.cadence]||30;
    setRecurring(prev=>prev.map(r=>r.id===rec.id?{...r, lastDone:new Date().toISOString().slice(0,10), nextDue:plusDays(days)}:r));
    say(rec.title+' logged as checked — looked fine. Next one due in '+days+' days.');
  }
  function editVendor(name, patch){
    setVendors(prev=>prev.map(v=>v.name===name?{...v,...patch}:v));
  }
  function addVendorNote(name, text){
    setVendors(prev=>prev.map(v=>v.name===name?{...v, notes:[...(v.notes||[]), {text, by:'You · '+ROLE_META[role].label, at:'just now'}]}:v));
    say('Note added to '+name+'.');
  }
  function addVendor(name, trade, contact){
    const n=String(name||'').trim();
    if(!n){ say('Name the company.'); return false; }
    let dup=false;
    setVendors(prev=>{
      if(prev.some(v=>!v.archived && v.name.toLowerCase()===n.toLowerCase())){ dup=true; return prev; }
      const dead=prev.findIndex(v=>v.archived && v.name.toLowerCase()===n.toLowerCase());
      if(dead>=0){
        return prev.map((v,i)=>i===dead?{...v, archived:false, trade:trade||v.trade, contact:contact||v.contact}:v);
      }
      return [...prev, {id:'V'+(prev.length+1), name:n, trade:trade||'—', contact:contact||'—', notes:[], history:[], archived:false}];
    });
    if(dup){ say(n+' is already on the roster.'); return false; }
    say(n+' added to the roster.');
    return true;
  }
  function archiveVendor(name){
    setVendors(prev=>prev.map(v=>v.name===name?{...v, archived:true}:v));
    say(name+' removed from the active roster. Jobs that already name them keep their history.');
  }
  function addBudgetLine(row){
    const cat=row.category, period=String(row.period||'').trim();
    if(!cat || !period){ say('Category and period are required.'); return false; }
    if(!(Number(row.budgeted)>0)){ say('Enter the budgeted amount once.'); return false; }
    let dup=false;
    setBudget(prev=>{
      if(prev.some(b=>!b.archived && b.category===cat && String(b.period)===period)){ dup=true; return prev; }
      return [...prev, {category:cat, period, budgeted:Number(row.budgeted)||0, spent:Number(row.spent)||0, notes:'', archived:false}];
    });
    if(dup){ say(cat+' already has a '+period+' line. Edit that one — do not add it twice.'); return false; }
    say(cat+' · '+period+' added. Cap '+money(row.budgeted)+'. Job costs in that category fill in against it.');
    return true;
  }
  function archiveBudget(category, period){
    setBudget(prev=>prev.map(b=>b.category===category && b.period===period ? {...b, archived:true}:b));
    say(category+' · '+period+' removed. Job costs stay on their records.');

  function patchBudget(category, period, patch){
    setBudget(prev=>prev.map(b=>b.category===category && b.period===period ? {...b, ...patch}:b));

  const patchZone=(id,p)=>setZonesAll(prev=>({...prev,[level.id]:prev[level.id].map(z=>z.id===id?{...z,...p}:z)}));
  function uploadFloorplan(file){
    if(!file) return;
    const lid=level.id;
    const reader=new FileReader();
    reader.onload=e=>{
      const dataUrl=e.target.result;
      /* Show it immediately — tracing rooms is the next thing the manager
         will do and they should not wait on an upload to start. */
      setLevelImages(prev=>({...prev, [lid]:dataUrl}));
      if(!API.on()){
        say('Floorplan uploaded. Room shapes are now see-through so you can trace the real walls underneath.');
        return;
      }
      const b64=dataUrl.slice(dataUrl.indexOf(',')+1);
      API.call('POST', `/levels/${lid}/floorplan`, {
        data_base64:b64, filename:file.name||'floorplan.png',
        content_type:file.type||'image/png',
      }).then(()=>{
        setConn('live');
        say('Floorplan uploaded — everyone on this facility sees it now, not just this phone.');
      }).catch(err=>{
        if(err.status && err.status>=400 && err.status<500){
          /* Refused outright (too large, wrong type, not a manager). The
             local preview would be a lie about what everyone else can
             see, so take it back down. */
          setLevelImages(prev=>{ const n={...prev}; delete n[lid]; return n; });
          setConn('live');
          say('The server refused that plan: '+err.message);
        }else{
          setConn('offline');
          say('Saved on this phone. It will upload for everyone else when you have signal.');
        }
      });
    };
    reader.readAsDataURL(file);
  }
  function removeFloorplan(){
    const lid=level.id;
    setLevelImages(prev=>{ const n={...prev}; delete n[lid]; return n; });

      API.call('DELETE', `/levels/${lid}/floorplan`)

  const selectedZone=zones.find(z=>z.id===selZone)||null;

  function addZone(){
    const id='n'+(++zseq.current);
    const nz={id, code:'NEW-'+zseq.current, name:'New room', kind:'office',

  function dupZone(){
    if(!selectedZone) return; const id='n'+(++zseq.current);
    const c={...selectedZone,id,code:selectedZone.code+'-B',name:selectedZone.name+' (copy)',
      x:Math.min(990-selectedZone.w,selectedZone.x+30), y:Math.min(690-selectedZone.h,selectedZone.y+30)};
    setZonesAll(p=>({...p,[level.id]:[...p[level.id],c]})); setSelZone(id);
  }
  function delZone(){
    if(!selectedZone) return;
    const n=issues.filter(i=>i.lvl===level.id&&i.zid===selectedZone.id&&i.cond!=='CLOSED').length;
    if(n){ say('Cannot delete '+selectedZone.name+' — it has '+n+' open issue'+(n>1?'s':'')+' attached. Rooms with live history get versioned, never erased.'); return; }
    setZonesAll(p=>({...p,[level.id]:p[level.id].filter(z=>z.id!==selectedZone.id)})); setSelZone(null);
  }
  function addLevel(){
    const id=bldg.id+'-n'+(++lseq.current);
    const top=Math.max(...levels.filter(l=>l.b===bldg.id).map(l=>l.stack))+1;
    const name='Level '+(top+1);
    setLevels(p=>[...p,{id,b:bldg.id,emo:'📦',name,stack:top}]);
    setZonesAll(p=>({...p,[id]:[]})); setSelZone(null);
    setStacked(true);
    say(name+' added to '+bldg.name+' — see it stacked with your other floors here.');
  }
  function delLevel(){
    if(!level) return;
    const roomCount=(zonesAll[level.id]||[]).length;
    if(roomCount){ say('Cannot delete '+level.name+' — it has '+roomCount+' room'+(roomCount>1?'s':'')+'. Delete those first.'); return; }
    const siblings=levels.filter(l=>l.b===bldg.id);
    if(siblings.length<=1){ say('Cannot delete the only level in '+bldg.name+' — a building needs at least one floor.'); return; }
    const removedId=level.id, removedName=level.name;
    setLevels(p=>p.filter(l=>l.id!==removedId));
    setZonesAll(p=>{ const n={...p}; delete n[removedId]; return n; });
    const next=siblings.find(l=>l.id!==removedId);
    setLevelId(next.id); setSelZone(null);
    say(removedName+' deleted.');
  }
  function addBldg(){
    const bid='B'+(++bseq.current), lid=bid+'-1', n=bseq.current;
    /* Every new building used to be called "New building" with the same
       icon, so adding three left three identical pills in the header with
       no way to tell them apart. Number them, and skip any number already
       taken so a rename-then-add can't collide either. */
    const used=new Set(buildings.map(b=>b.name.trim().toLowerCase()));
    let k=buildings.length+1, name='Building '+k;
    while(used.has(name.toLowerCase())) name='Building '+(++k);
    const nb={id:bid, emo:'🏗', name, kind:'structure',
      x:snap(120+((n%4)*40)), y:snap(110+((n%3)*40)), w:280, h:230};

    setBuildings(p=>[...p,nb]);
    setLevels(p=>[...p,{id:lid,b:bid,emo:'🚪',name:'Level 1',stack:0}]);
    setZonesAll(p=>({...p,[lid]:[starterRoom]}));

    say(name+' created — Level 1 already has a restroom on it. Rename, resize, or add more once you walk in.');
  }

      setRecurring(PREBUILD_RECURRING); setVendors(PREBUILD_VENDORS); setBudget(PREBUILD_BUDGET); setInventory(PREBUILD_INVENTORY);
      setLevelId('B1-1'); setRole('supervisor'); setShowProperty(false); setEditing(true);
      seq.current=1000; zseq.current=2; lseq.current=1; bseq.current=1;

    } else {
      setBuildings(BUILDINGS0); setLevels(LEVELS0); setZonesAll(ZONES0);
      setIssues(ISSUES0.map(i=>({...i, events:seedEvents(i)})));
      setRecurring(RECURRING0); setVendors(VENDORS0); setBudget(BUDGET0); setInventory(INVENTORY0); setLevelId('B1-1'); setRole('supervisor'); setShowProperty(false); setEditing(false);
      seq.current=1070; zseq.current=100; lseq.current=9; bseq.current=9;
      setDataset('demo');

  function mintIssueId(){
    if(API.on() && window.crypto && crypto.randomUUID)
      return 'ISS-'+crypto.randomUUID().replace(/-/g,'').slice(0,10).toUpperCase();
    if(API.on())
      return 'ISS-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    return 'ISS-'+(++seq.current);
  }

      const path=`/facilities/${encodeURIComponent(API.facility)}/issues`;
      API.call('POST', path, payload)
        .then(()=>{ setConn('live'); say(id+' is on the record'+(z?' at '+z.name:'')+'.'); })

          <div className="lenspanel">
            <div className="lenspanel-h">
              <span>{lensDef.label} · property-wide</span>
              <button className="lensclose" onClick={()=>setLensPanelOpen(false)} aria-label="Close">×</button>
            </div>
            {propertyMatches.length ? propertyMatches.map(i=>(
              <button key={i.id} className="zrow" onClick={()=>{jumpToIssue(i); setLensPanelOpen(false);}}>
                <span className="dot" style={{background:PRI_COLOR[i.pri], width:11, height:11, flex:'0 0 auto', marginTop:2}}/>
                <span style={{flex:1, minWidth:0}}>
                  <span className="zt">{i.title}</span><br/>
                  <span className="zs">{i.id} · {i.pri} · {i.cond} · 📍 {whereOf(i)}</span>
                </span>
              </button>
            )) : <div className="dir-empty">Nothing here right now.</div>}
          </div>
        </>}
      </header>

      <div className={'body'+(sel?' has-ticket':'')+(adding?' is-adding':'')}>
        <nav className={'rail'+(buildings.length===0?' rail-blank':'')} aria-label="Buildings and levels">
          {buildings.length===0 ? (
            <div className="blank-rail">
              <div className="blank-rail-icon">🏗️</div>
              <div className="blank-rail-h">Nothing built yet</div>
              <p>{role==='manager'
                ? 'Your property is the empty map on the right. Tap ➕ Building to place your first one — drag and resize it, then walk into it to add floors and rooms.'
                : 'Setting up a property needs Manager access. Switch roles above to begin.'}</p>
            </div>
          ) : <>
            {buildings.map(b=>(
              <div key={b.id} className="bgroup">
                <div className="bhead">{b.emo} {b.name}</div>
                {levels.filter(l=>l.b===b.id).sort((x,y)=>y.stack-x.stack).map(l=>{
                  const li=issues.filter(i=>i.lvl===l.id&&i.cond!=='CLOSED');
                  return (
                    <button key={l.id} className="lvl" aria-current={!stacked&&levelId===l.id}
                      onClick={()=>{setLevelId(l.id); setStacked(false); setShowProperty(false); setSel(null); setSelZone(null); setLensPanelOpen(false);}}>
                      <span className="lvl-emo">{l.emo}</span>
                      <span style={{minWidth:0}}>
                        <span className="lvl-name">{b.name.split(' ')[0]} · {l.name}</span>
                        <span className="lvl-meta">{(zonesAll[l.id]||[]).length} rooms · {li.length?li.length+' open':'all quiet'}</span>
                      </span>
                      <span className="lvl-dots">{li.slice(0,3).map(i=><span key={i.id} className="dot" style={{background:PRI_COLOR[i.pri]}}/>)}</span>
                    </button>);
                })}
              </div>))}

            {/* Mobile only (see .railmobile / .bgroup in the narrow media query).
                One pill per building; tapping it drops down that building's
                floors and nothing else. Floors never sit in the header —
                that was the original congestion, and 3 buildings x 4 floors
                is 12 items across a phone.

                Buildings themselves are few enough to scroll, so they are
                not collapsed at the first sign of a second one. Only when
                there are more than RAIL_PILL_MAX does the tail fold into a
                "+N more" chip, and the building you are currently standing
                in is always one of the visible pills rather than being
                hidden behind that chip. */}
            <div className="railmobile">
              {(()=>{
                const cur = bldg ? bldg.id : null;
                const overflow = buildings.length > RAIL_PILL_MAX;
                let shown = buildings, rest = [];
                if(overflow){
                  const head = buildings.slice(0, RAIL_PILL_MAX-1);
                  // pull the current building forward if the fold would hide it
                  if(cur && !head.some(b=>b.id===cur)){
                    head[head.length-1] = buildings.find(b=>b.id===cur);
                  }
                  shown = head;
                  rest = buildings.filter(b=>!shown.some(s=>s.id===b.id));
                }
                return (<>
                  {shown.map(b=>{
                    const blvls=levels.filter(l=>l.b===b.id).sort((x,y)=>y.stack-x.stack);
                    const bIssues=issues.filter(i=>blvls.some(l=>l.id===i.lvl)&&i.cond!=='CLOSED');
                    const isCur = cur===b.id && !stacked && !showProperty;
                    return (
                      <button key={b.id} className={'lvl'+(railBldgOpen===b.id?' lvl-open':'')}
                        aria-current={isCur} aria-expanded={railBldgOpen===b.id}
                        onClick={()=>setRailBldgOpen(o=>o===b.id?null:b.id)}>
                        <span className="lvl-emo">{b.emo}</span>
                        <span className="lvl-name">{b.name}</span>
                        {bIssues.length>0 && <span className="lvl-dots">{bIssues.slice(0,3).map(i=><span key={i.id} className="dot" style={{background:PRI_COLOR[i.pri]}}/>)}</span>}
                        <span className="lvl-caret">▾</span>
                      </button>);
                  })}
                  {rest.length>0 && (
                    <button className="lvl" aria-expanded={railBldgOpen==='__all'}
                      onClick={()=>setRailBldgOpen(o=>o==='__all'?null:'__all')}>
                      <span className="lvl-name">+{rest.length} more</span>
                      <span className="lvl-caret">▾</span>
                    </button>)}
                </>);
              })()}
            </div>
          </>}
          <div className="rail-foot">
            {buildings.length>0 && <>
              <button className="rail-btn" aria-pressed={showProperty}
                onClick={()=>{setShowProperty(s=>!s); setStacked(false); setSel(null); setSelZone(null);}}>
                🏢 {showProperty?'Back to floor':'Property view'}
              </button>
              <button className="rail-btn" aria-pressed={stacked} onClick={()=>{setStacked(s=>!s); setShowProperty(false);}}>🧊 {stacked?'Flat map':'See it stacked'}</button>
              <button className="rail-btn" aria-pressed={editing}
                onClick={()=>{
                  if(!canEditLayout(role)){ say('Editing the building layout needs Supervisor access. You\u2019re viewing as '+ROLE_META[role].label+'.'); return; }
                  setEditing(e=>!e); setStacked(false); setSel(null); setSelZone(null);
                }}>
                {canEditLayout(role) ? (editing?'✏️ Done editing':'✏️ Edit layout') : '🔒 Supervisor only'}
              </button>
              <button className="rail-btn" onClick={()=>{setDirectoryInit({tab:'vendors',q:''}); setShowDirectory(true);}}>📇 Vendors & rooms</button>
              <button className="rail-btn" onClick={()=>setShowCalendar(true)}>📅 Calendar</button>
              <button className="rail-btn" onClick={()=>setShowInv(true)}>📦 Inventory</button>
              {canSeeBudget(role) && <button className="rail-btn" onClick={()=>setShowBudget(true)}>💰 Budget</button>}
              {canSeeBudget(role) && <button className="rail-btn" onClick={()=>{setImportReport(null); setShowData(true);}}>💾 Your data</button>}
            </>}
            {role!=='tech' && <>
            <button className="rail-btn" onClick={()=>loadDataset(dataset==='demo'?'blank':'demo')}>
              {dataset==='demo' ? '🧪 Try a blank template' : '🏛 Load the Northgate demo'}
            </button>
            <div className="rail-note">{dataset==='blank'
              ? 'Starter floor: Main Building, Level 1, Office and Restroom. Rename and resize. No issues are logged yet.'
              : 'Northgate is the populated walkthrough. Blank template is one building, an office and a restroom — no tickets yet.'}</div>
            </>}
          </div>
        </nav>

        {showProperty ? (
          <div className="stage">
            <div className="stage-head">
              <span className="stage-title">🏢 Your Property</span>
              <span className="stage-sub">{buildings.length} building{buildings.length===1?'':'s'}</span>
              <button className="editbtn" aria-pressed={editing}
                onClick={()=>{
                  if(!canEditLayout(role)){ say('Editing the building layout needs Supervisor access. You\u2019re viewing as '+ROLE_META[role].label+'.'); return; }
                  setEditing(e=>!e); setSelBldgId(null);
                }}>
                {canEditLayout(role) ? (editing?'Done editing':'✏️ Edit layout') : '🔒 Supervisor only'}
              </button>
            </div>
            {editing && <PropertyEditorBar buildings={buildings} selBldg={selBldgId}
              onBldgChange={patchBldg} onAddBldg={addBldg} onEnter={enterBuilding}
              onDone={()=>{setEditing(false); setSelBldgId(null);}}/>}
            <PropertyStage buildings={buildings} editing={editing} selBldg={selBldgId}
              onSelBldg={setSelBldgId} onBldgChange={patchBldg} onEnter={enterBuilding} heat={heat}/>
            {!editing && <AttentionSheet ranked={ranked} whereOf={whereOf} open={attnOpen}
              onToggle={()=>setAttnOpen(o=>!o)} onGo={iss=>{setShowProperty(false); jumpToIssue(iss);}}/>}
          </div>
        ) : !level ? (
          <div className="stage">
            <div className="blankstage">
              <div className="blankstage-icon">🗺️</div>
              <h2>No map yet</h2>
              <p>Once your first building exists, its map opens here — the exact same tap-to-place, tap-to-report experience as the populated demo, just starting from nothing.</p>
            </div>
          </div>
        ) : stacked
          ? <div className="stage"><Stacked buildings={buildings} levels={levels} zonesAll={zonesAll} issues={issues}
                     activeId={levelId} onPick={id=>{setLevelId(id); setStacked(false);}}/></div>
          : <div className="stage">
              <div className="stage-head">
                <span className="stage-title">{bldg.emo} {bldg.name} · {level.name}</span>
                <span className="stage-sub">{zones.length} rooms · {shown.length} of {onLevel.length} shown{lens!=='all'?' · '+lensDef.label.toLowerCase():''}{dueCount?' · '+dueCount+' check'+(dueCount>1?'s':'')+' due':''}</span>
                <button className="editbtn" aria-pressed={editing}
                  onClick={()=>{
                    if(!canEditLayout(role)){ say('Editing the building layout needs Supervisor access. You\u2019re viewing as '+ROLE_META[role].label+'.'); return; }
                    setEditing(e=>!e); setSel(null); setSelZone(null); setAdding(false);
                  }}>
                  {canEditLayout(role) ? (editing?'Done editing':'✏️ Edit layout') : '🔒 Supervisor only'}
                </button>
              </div>

              {!editing && (
                <div className="legend">
                  <b>Reading the map</b>
                  <span className="legend-row"><svg width="17" height="17"><circle cx="8.5" cy="8.5" r="6" fill="#fff" stroke="var(--p2)" strokeWidth="3"/></svg> Circle — still open</span>
                  <span className="legend-row"><svg width="17" height="17"><rect x="3" y="3" width="11" height="11" rx="2" fill="#fff" stroke="var(--p2)" strokeWidth="3" transform="rotate(45 8.5 8.5)"/></svg> Diamond — contained</span>
                  <span className="legend-row"><svg width="17" height="17"><path d="M8.5,2 L15,14 L2,14 Z" fill="#fff" stroke="var(--p2)" strokeWidth="2.6" strokeLinejoin="round"/></svg> Triangle — needs verifying</span>
                  <span className="legend-row"><svg width="17" height="17"><rect x="2.5" y="2.5" width="12" height="12" rx="3" fill="#fff" stroke="var(--p3)" strokeWidth="3"/></svg> Square — being watched</span>
                  <span className="legend-row"><svg width="17" height="13"><rect width="17" height="13" rx="3" fill="#F3DFA8" stroke="#D8A93C" strokeWidth="1.5" strokeDasharray="3 2"/></svg> Striped — a temporary control</span>
                  <span className="legend-row">Red stripes: expired. Tap a room to report.</span>
                </div>
              )}

              {editing && <EditorBar bldg={bldg} level={level} zone={selectedZone} hasImage={!!levelImages[level.id]}
                onBldg={p=>setBuildings(prev=>prev.map(b=>b.id===bldg.id?{...b,...p}:b))}
                onLevel={p=>setLevels(prev=>prev.map(l=>l.id===level.id?{...l,...p}:l))}
                onZone={p=>patchZone(selZone,p)}
                onAddZone={addZone} onAddLevel={addLevel} onDelLevel={delLevel}
                onUploadImage={uploadFloorplan} onRemoveImage={removeFloorplan}
                onDup={dupZone} onDel={delZone} onDone={()=>{setEditing(false); setSelZone(null);}}/>}

              <MapStage zones={zones} issues={shown} selected={sel} onPin={setSel}
                onZone={z=>setSheetZone(z)} adding={adding}
                onPlace={(x,y,zone)=>setPending({x,y,zone,id:'ISS-'+(++seq.current)})} freshId={fresh}
                editing={editing} selZone={selZone} onSelZone={setSelZone} onZoneChange={patchZone}
                recurring={recurring.filter(r=>r.lvl===level.id)} bgImage={levelImages[level.id]} levelKey={level.id}
                stock={inventory.filter(it=>it.lvl===level.id)}/>

              {!editing && <AttentionSheet ranked={ranked} whereOf={whereOf} open={attnOpen} raised
                onToggle={()=>setAttnOpen(o=>!o)} onGo={jumpToIssue}/>}

              {!editing && !sel && <button className="fab" aria-pressed={adding} onClick={()=>{setAdding(a=>!a); setSel(null);}}
                title={adding?'Cancel':'Report something'} aria-label={adding?'Cancel placing':'Report something'}>
                <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
                  <path d="M13 4.5 V21.5 M4.5 13 H21.5" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round"/>
                </svg></button>}
            </div>}

        {sel && !stacked && !editing && <Drawer iss={sel} where={whereOf(sel)} onClose={()=>setSel(null)} onToast={say}
          onExport={()=>setShowPack(true)}
          onUpdate={moveId=>{
            if(moveId){
              const mv=MOVES.find(m=>m.id===moveId);
              if(mv && !roleCan(mv,role)){ say('That needs Supervisor access. You\u2019re viewing as '+ROLE_META[role].label+'.'); return; }
              setActiveMove(mv);
            } else { setShowActions(true); }
          }}/>}
      </div>

      {showDirectory && (
        <Directory buildings={buildings} levels={levels} zonesAll={zonesAll} issues={issues} recurring={recurring}
          vendors={vendors} role={role}
          initialTab={directoryInit.tab} initialQuery={directoryInit.q}
          onClose={()=>setShowDirectory(false)}
          onOpenIssue={iss=>{setShowDirectory(false); jumpToIssue(iss);}}
          onOpenRoom={(lvlId,zoneId)=>{setShowDirectory(false); jumpToRoom(lvlId,zoneId);}}
          onEditVendor={editVendor} onAddNote={addVendorNote}
          onAddVendor={addVendor} onArchiveVendor={archiveVendor}/>)}

      {searchOpen && (
        <SearchOverlay buildings={buildings} levels={levels} zonesAll={zonesAll} issues={issues} vendors={vendors}
          onClose={()=>setSearchOpen(false)}
          onOpenIssue={iss=>{setSearchOpen(false); jumpToIssue(iss);}}
          onOpenRoom={(lvlId,zoneId)=>{setSearchOpen(false); jumpToRoom(lvlId,zoneId);}}
          onOpenVendors={name=>{setSearchOpen(false); setDirectoryInit({tab:'vendors', q:name}); setShowDirectory(true);}}/>)}

      {showInv && (
        <InventoryPanel inventory={inventory} levels={levels} buildings={buildings} zonesAll={zonesAll}
          onAdjust={adjustStock} onAdd={addStock} onArchive={archiveStock}
          onClose={()=>setShowInv(false)}
          onGoRoom={(lvlId,zoneId)=>{setShowInv(false); jumpToRoom(lvlId,zoneId);}}/>)}

      {showBudget && canSeeBudget(role) && (
        <BudgetPanel budget={budget} issues={issues}
          onClose={()=>setShowBudget(false)}
          onOpenIssue={iss=>{setShowBudget(false); jumpToIssue(iss);}}
          onAdd={addBudgetLine} onArchive={archiveBudget} onPatch={patchBudget}/>)}

      {showData && canSeeBudget(role) && (
        <DataPanel
          counts={{issues:issues.length, rooms:Object.values(zonesAll).reduce((a,z)=>a+z.length,0),
                   vendors:vendors.length, events:issues.reduce((a,i)=>a+(i.events||[]).length,0)}}
          busy={dataBusy} report={importReport}
          onExport={exportXlsx} onImport={importXlsx} onImportAs={importAs}
          siteId={siteId}
          onCopySite={()=>{
            if(!siteId) return;
            const link=siteLink(siteId);
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(link).then(()=>say('Live link copied. Open it on the other device.')).catch(()=>say(link));
            } else say(link);
          }}
          onClose={()=>setShowData(false)}/>)}

      {showPack && sel && (
        <ExportPack iss={sel} where={whereOf(sel)}
          propertyName={propertyName}
          onClose={()=>setShowPack(false)}/>)}

      {showCalendar && (
        <CalendarOverlay issues={issues} recurring={recurring}
          onClose={()=>setShowCalendar(false)}
          onOpenIssue={iss=>{setShowCalendar(false); jumpToIssue(iss);}}
          onOpenRoom={(lvlId,zoneId)=>{setShowCalendar(false); jumpToRoom(lvlId,zoneId);}}/>)}

      {showActions && sel && (
        <ActionSheet iss={sel} role={role} onClose={()=>setShowActions(false)}
          onPick={id=>{setShowActions(false); setActiveMove(MOVES.find(m=>m.id===id));}}/>)}

      {activeMove && sel && (
        <ActionForm move={activeMove} iss={sel} role={role} vendors={vendors} inventory={inventory} onCancel={()=>setActiveMove(null)}
          onSubmit={v=>applyMove(activeMove, v)}/>)}

      {sheetZone && !pending && (
        <ZoneSheet zone={sheetZone} issues={onLevel.filter(i=>i.zid===sheetZone.id&&i.cond!=='CLOSED')}
          resolvedCount={onLevel.filter(i=>i.zid===sheetZone.id&&i.cond==='CLOSED').length}
          recs={recurring.filter(r=>r.zid===sheetZone.id)}
          onLogCheck={logCheck}
          onClose={()=>setSheetZone(null)}
          onOpen={i=>{setSheetZone(null); setSel(i);}}
          onReport={()=>setPending({x:sheetZone.x+sheetZone.w/2, y:sheetZone.y+sheetZone.h/2, zone:sheetZone, id:'ISS-'+(++seq.current)})}/>)}

      {pending && <Composer at={pending} zone={pending.zone} levelName={level.name} bldgName={bldg.name} role={role}
        onCancel={()=>{setPending(null); setAdding(false); setSheetZone(null);}} onSave={save}/>}

      {railBldgOpen==='__all' && (<>
        <div className="lens-backdrop" onClick={()=>setRailBldgOpen(null)}/>
        <div className="bldgpanel">
          <div className="lenspanel-h">
            <span>All buildings</span>
            <button className="lensclose" onClick={()=>setRailBldgOpen(null)} aria-label="Close">×</button>
          </div>
          {buildings.map(b=>{
            const blvls=levels.filter(l=>l.b===b.id).sort((x,y)=>y.stack-x.stack);
            return (
              <div key={b.id} className="bldggroup">
                <div className="bldggroup-h">{b.emo} {b.name}</div>
                {blvls.map(l=>{
                  const li=issues.filter(i=>i.lvl===l.id&&i.cond!=='CLOSED');
                  return (
                    <button key={l.id} className="lvl" aria-current={!stacked&&levelId===l.id}
                      onClick={()=>{setLevelId(l.id); setStacked(false); setShowProperty(false); setSel(null); setSelZone(null); setLensPanelOpen(false); setRailBldgOpen(null);}}>
                      <span className="lvl-emo">{l.emo}</span>
                      <span style={{minWidth:0}}>
                        <span className="lvl-name">{l.name}</span>
                        <span className="lvl-meta">{(zonesAll[l.id]||[]).length} rooms · {li.length?li.length+' open':'all quiet'}</span>
                      </span>
                      <span className="lvl-dots">{li.slice(0,3).map(i=><span key={i.id} className="dot" style={{background:PRI_COLOR[i.pri]}}/>)}</span>
                    </button>);
                })}
              </div>);
          })}
        </div>
      </>)}

      {railBldgOpen && railBldgOpen!=='__all' && (()=>{
        const b=buildings.find(x=>x.id===railBldgOpen); if(!b) return null;
        const blvls=levels.filter(l=>l.b===b.id).sort((x,y)=>y.stack-x.stack);
        return (<>
          <div className="lens-backdrop" onClick={()=>setRailBldgOpen(null)}/>
          <div className="bldgpanel">
            <div className="lenspanel-h">
              <span>{b.emo} {b.name}</span>
              <button className="lensclose" onClick={()=>setRailBldgOpen(null)} aria-label="Close">×</button>
            </div>
            {blvls.map(l=>{
              const li=issues.filter(i=>i.lvl===l.id&&i.cond!=='CLOSED');
              return (
                <button key={l.id} className="lvl" aria-current={!stacked&&levelId===l.id}
                  onClick={()=>{setLevelId(l.id); setStacked(false); setShowProperty(false); setSel(null); setSelZone(null); setLensPanelOpen(false); setRailBldgOpen(null);}}>
                  <span className="lvl-emo">{l.emo}</span>
                  <span style={{minWidth:0}}>
                    <span className="lvl-name">{l.name}</span>
                    <span className="lvl-meta">{(zonesAll[l.id]||[]).length} rooms · {li.length?li.length+' open':'all quiet'}</span>
                  </span>
                  <span className="lvl-dots">{li.slice(0,3).map(i=><span key={i.id} className="dot" style={{background:PRI_COLOR[i.pri]}}/>)}</span>
                </button>);
            })}
          </div>
        </>);
      })()}

      {conn!=='local' && (conn!=='live' || outbox>0) && (
        <div className="connbar" role="status">
          <span>{conn==='loading' ? '⏳' : conn==='offline' ? '📴' : '📤'}</span>
          <span style={{flex:1}}>{
            conn==='loading' ? 'Connecting to the facility…'
            : conn==='offline'
              ? (outbox>0
                  ? `Offline — ${outbox} ${outbox===1?'report is':'reports are'} saved on this phone and will send when you have signal.`
                  : 'Offline — showing the facility as of the last sync.')
              : `Sending ${outbox} queued ${outbox===1?'report':'reports'}…`
          }</span>
          {conn==='offline' && <button className="connretry" onClick={async()=>{
            const r=await outboxFlush(); setOutbox(r.left);
            if(r.left===0) reloadFromServer();
          }}>Retry</button>}
        </div>)}

      {inboxOpen && <>
        <div className="lens-backdrop" onClick={()=>setInboxOpen(false)}/>
        <div className="bldgpanel inbox-panel">
          <div className="lenspanel-h">
            <span>Inbox{unread>0?` · ${unread} unread`:''}</span>
            <span style={{display:'flex',gap:8,alignItems:'center'}}>
              {unread>0 && <button className="rail-btn" onClick={markAllRead}>Mark all read</button>}
              <button className="lensclose" onClick={()=>setInboxOpen(false)} aria-label="Close">×</button>
            </span>
          </div>
          {notifs.length===0
            ? <div className="inbox-empty">Nothing yet. Reports and anything waiting on you show up here.</div>
            : notifs.map(n=>(
                <button key={n.id} className={'notif'+(n.read_at?'':' notif-unread')}
                  onClick={()=>openFromNotification(n)}>
                  <span className="notif-ic">{n.urgency==='urgent'?'🚨':'📋'}</span>
                  <span style={{minWidth:0}}>
                    <span className="notif-t">{n.title}</span>
                    <span className="notif-b">{n.body}</span>
                  </span>
                </button>))}
        </div>
      </>}

      {claimOpen && <EnrollGate
        onDone={()=>{ setClaimOpen(false); setConn('live'); say('This phone is enrolled. The session lasts until you close the tab or sign out.'); }}
        onCancel={()=>{ API.enrollToken=null; setClaimOpen(false); }}/>}
      {toast && <div className="toast"><span>✅</span><span>{toast}</span></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
